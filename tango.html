<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>単語帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;0,700;1,400&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#F4F1EA; --paper:#FFFFFF; --soft:#F8F5EE; --ink:#1E2A3A; --ink-2:#4A5568; --ink-3:#8A93A3;
  --rule:#E2DCCF; --navy:#2B3F5C; --orange:#C8693E; --orange-soft:#F7E6DC; --green:#3E8A6A; --green-soft:#E3F1EA;
  --violet:#6B5BA8; --violet-soft:#ECE8F6; --hl:#FFF0B8; --hl-line:#E9C46A;
  --en:"Crimson Pro","Georgia","Times New Roman",serif;
  --jp:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#13171E; --paper:#1B212B; --soft:#202733; --ink:#E9EDF3; --ink-2:#B8C1CF; --ink-3:#7F8A9C;
    --rule:#2F3846; --navy:#9CB8E0; --orange:#E89A72; --orange-soft:#3A2A22; --green:#6CC49E; --green-soft:#1C3229;
    --violet:#B3A6E8; --violet-soft:#2A2540; --hl:#4A3F17; --hl-line:#C9A443;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#13171E; --paper:#1B212B; --soft:#202733; --ink:#E9EDF3; --ink-2:#B8C1CF; --ink-3:#7F8A9C;
  --rule:#2F3846; --navy:#9CB8E0; --orange:#E89A72; --orange-soft:#3A2A22; --green:#6CC49E; --green-soft:#1C3229;
  --violet:#B3A6E8; --violet-soft:#2A2540; --hl:#4A3F17; --hl-line:#C9A443;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--jp);font-size:15.5px;line-height:1.8;-webkit-font-smoothing:antialiased}
.wrap{max-width:900px;margin:0 auto;padding:0 16px 80px}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}

header{padding:28px 0 10px}
.kicker{display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:var(--ink-3);font-size:12.5px}
.badge{background:var(--navy);color:var(--paper);border-radius:6px;padding:5px 11px;line-height:1.15;font-weight:700;font-size:13px}
.theme{margin-left:auto;border:1px solid var(--rule);background:var(--paper);color:var(--ink-2);border-radius:99px;padding:4px 12px;font-size:12.5px}
h1{font-size:clamp(22px,5vw,30px);line-height:1.35;margin:12px 0 4px;letter-spacing:.01em}
.lead{color:var(--ink-2);margin:0;font-size:14px}

.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:16px 0 4px}
.search{flex:1 1 220px;min-width:0;border:1px solid var(--rule);background:var(--paper);border-radius:10px;padding:9px 12px;font:inherit;font-family:var(--en);font-size:17px;color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--rule);background:var(--paper);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:700;color:var(--ink-3)}
.chip[aria-pressed="true"]{color:var(--ink);border-color:var(--ink-3);background:var(--soft)}
.chip i{font-style:normal;display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}

.az{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--rule);margin:10px -16px 0;padding:8px 16px}
.az-in{display:grid;grid-template-columns:repeat(13,1fr);gap:4px;max-width:900px;margin:0 auto}
.az button{border:0;background:transparent;border-radius:8px;padding:5px 0;font-family:var(--en);font-weight:700;font-size:18px;color:var(--ink-2)}
.az button:hover{background:var(--soft)}
.az button.on{background:var(--navy);color:var(--paper)}
.az button:disabled{opacity:.3;cursor:default}

.lettertitle{display:flex;align-items:baseline;gap:12px;margin:22px 0 10px}
.lettertitle b{font-family:var(--en);font-size:44px;line-height:1;color:var(--navy)}
.lettertitle span{color:var(--ink-3);font-size:13px}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.w{display:flex;align-items:center;gap:8px;text-align:left;border:1px solid var(--rule);background:var(--paper);border-radius:10px;padding:7px 10px;min-width:0}
.w:hover{border-color:var(--ink-3)}
.w .hw{font-family:var(--en);font-size:18px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.w .n{font-size:11.5px;color:var(--ink-3)}
.lv{flex:none;font-size:10.5px;font-weight:700;border-radius:5px;padding:1px 6px;line-height:1.5;letter-spacing:.02em}
.lv.B1{background:var(--green-soft);color:var(--green)}
.lv.B2{background:var(--orange-soft);color:var(--orange)}
.lv.C1,.lv.C2,.lv.C1p{background:var(--violet-soft);color:var(--violet)}
.empty{color:var(--ink-3);padding:30px 0;text-align:center}

/* detail */
.back{border:1px solid var(--rule);background:var(--paper);border-radius:99px;padding:5px 14px;font-size:13px;font-weight:700;color:var(--ink-2);margin-top:20px}
.dhead{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin:14px 0 6px}
.dhead h2{font-family:var(--en);font-size:clamp(32px,8vw,44px);margin:0;line-height:1.1}
.dhead .lv{font-size:12px;padding:3px 9px}
.dsub{color:var(--ink-3);font-size:13px}
.bar{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 16px}
.btn{border:1px solid var(--rule);background:var(--paper);border-radius:8px;padding:6px 12px;font-size:13px;font-weight:700;color:var(--ink-2)}
.btn:hover{border-color:var(--ink-3);color:var(--ink)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:var(--paper)}
.btn[aria-pressed="true"]{background:var(--soft);color:var(--ink);border-color:var(--ink-3)}
.vsel{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--ink-2)}
.vsel select{max-width:220px;border:1px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 8px;font:inherit;font-weight:500}
.cards{display:flex;flex-direction:column;gap:10px}
.card{background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:12px 16px 12px}
.card.playing{border-color:var(--orange);box-shadow:0 0 0 2px var(--orange-soft)}
.loc{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--ink-3);font-weight:500}
.loc .tag{background:var(--soft);border:1px solid var(--rule);border-radius:5px;padding:0 7px}
.loc .adv{background:var(--orange-soft);color:var(--orange);border-radius:5px;padding:0 7px;font-weight:700}
.loc .src{background:var(--green-soft);color:var(--green);border-radius:5px;padding:0 7px;font-weight:700}
.w.ph .hw{font-style:italic;white-space:normal;overflow:visible;line-height:1.3}
.w.wide{grid-column:span 2}
.loc .app{background:var(--navy);color:var(--paper);border-radius:5px;padding:0 7px;font-weight:700}
.en{font-family:var(--en);font-size:21px;line-height:1.45;margin:6px 0 8px;overflow-wrap:anywhere}
.en mark{background:linear-gradient(transparent 58%,var(--hl) 58%);color:inherit;font-weight:700;padding:0 1px}
.ja{color:var(--ink-2);font-size:14.5px;border-left:3px solid var(--hl-line);padding:2px 0 2px 10px;margin:0 0 8px}
.ja[hidden]{display:none}
.acts{display:flex;gap:6px}
.embed header{padding-top:6px}
.embed .kicker{display:none}
.embed .az{position:static;backdrop-filter:none;background:transparent}
.foot{margin-top:48px;color:var(--ink-3);font-size:12px;line-height:1.7;border-top:1px solid var(--rule);padding-top:14px}
.foot a{color:var(--ink-2)}
@media (max-width:560px){
  .az-in{grid-template-columns:repeat(9,1fr)}
  .az button{font-size:16px}
  .words{grid-template-columns:repeat(auto-fill,minmax(135px,1fr))}
  .en{font-size:19.5px}
}

.vbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0 2px}.vbar .vnote{font-size:12px;color:var(--ink-3)}.vbar .vpick{max-width:280px}
.grades{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 4px}
@media (max-width:560px){.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.grades .grade{padding:8px 4px;font-size:13.5px;min-width:0}}
.grade{border:2px solid var(--rule);background:var(--paper);border-radius:12px;padding:10px 22px;font-size:16px;font-weight:700;color:var(--ink-2)}
.grade:hover{border-color:var(--ink-3);color:var(--ink)}
.grade[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--paper)}
.grade small{display:block;font-size:11.5px;font-weight:500;opacity:.8}
.wnav{display:flex;justify-content:space-between;gap:8px;margin-top:16px}
.wnav .btn{max-width:48%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hint{color:var(--ink-3);font-size:14px;padding:26px 0;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kicker"><span class="badge">単語帳</span><span>英検レベル別 単語・熟語</span>
      <button class="theme" id="theme" type="button">表示切替</button></div>
    <h1>単語帳</h1>
    <div class="grades" id="grades">
      <button class="grade" type="button" data-g="5" aria-pressed="false">英検５級レベル<small id="n5"></small></button>
      <button class="grade" type="button" data-g="4" aria-pressed="false">英検４級レベル<small id="n4"></small></button>
      <button class="grade" type="button" data-g="3" aria-pressed="false">英検３級レベル<small id="n3"></small></button>
    </div>
    <div class="vbar">
      <label class="vsel">声<select class="vpick" aria-label="読み上げの声"></select></label>
      <button class="btn" type="button" id="vtest">試聴</button>
      <span class="vnote">★ は自然な音声（Google・Microsoft Natural など）</span>
    </div>
    <div id="gtools" hidden>
      <p class="lead" id="lead"></p>
      <div class="tools">
        <input class="search" id="q" type="search" placeholder="語・句を検索（例：apple, get up）" autocomplete="off" autocapitalize="off" spellcheck="false">
        <div class="chips" id="tychips"></div>
      </div>
    </div>
  </header>
  <nav class="az" aria-label="アルファベット索引" id="aznav" hidden><div class="az-in" id="az"></div></nav>
  <main id="main"><p class="hint">上のボタンでレベルを選んでください。</p></main>
</div>

",[[20,25]],"T"],["together","Let's study English together before we go out for lunch.","昼食に出かける前に、一緒に英語を勉強しましょう。",[[20,28]],"T"],["tomato","Can you cut the tomatoes while I wash the lettuce?","レタスを洗っている間、トマトを切ってもらえますか。",[[16,24]],"T"],["tomorrow","Tomorrow is my birthday, and I'm going out with friends.","明日は誕生日で、友達と出かけます。",[[0,8]],"T"],["tonight","Let's watch a movie tonight after we finish cleaning up.","今夜は、片づけが終わったら映画を見ましょう。",[[20,27]],"T"],["toothbrush","Don't forget your toothbrush when you pack for the trip.","旅行の荷造りをするとき、歯ブラシを忘れないでください。",[[18,28]],"T"],["top","Put your name at the top.","一番上に名前を書いてください。",[[21,24]],"T"],["tower","Can we go up the tower?","その塔に登れますか。",[[17,22]],"T"],["town","Is there a hotel in town?","町にホテルはありますか。",[[20,24]],"T"],["toy","Please put your toys away before your friends arrive.","友達が来る前に、おもちゃを片づけてください。",[[16,20]],"T"],["train","I go to school by train.","私は電車で学校に行きます。",[[18,23]],"T"],["travel","I want to travel with my family.","私は家族と旅行したいです。",[[10,16]],"T"],["trip","How was your trip, and did you take any photos?","旅行はどうでしたか。それと、写真は撮りましたか。",[[13,17]],"T"],["trumpet","My brother plays the trumpet in the school band.","兄は学校のバンドで、トランペットを吹いています。",[[21,28]],"T"],["try","Please try this cake and tell me what you think.","このケーキを食べて、感想を聞かせてください。",[[7,10]],"T"],["tulip","Let's plant tulips in the garden.","庭にチューリップを植えましょう。",[[12,18]],"T"],["turn","Please turn left here and stop in front of the bank.","ここを左に曲がって、銀行の前で止まってください。",[[7,11]],"T"],["twice","I swim twice a week at the pool near our house.","家の近くのプールで、週に2回泳ぎます。",[[7,12]],"T"],["umbrella","I need an umbrella today because it may rain later.","後で雨が降るかもしれないので、今日は傘が必要です。",[[10,18]],"U"],["uncle","My uncle is a doctor at the hospital near our house.","おじは、家の近くの病院の医師です。",[[3,8]],"U"],["under","My dog is under the table.","私のイヌはテーブルの下にいます。",[[10,15]],"U"],["understand","I don't understand this word, so could you explain it?","この単語が分からないので、説明してもらえますか。",[[8,18]],"U"],["uniform","Do we need to wear uniforms?","制服を着る必要はありますか。",[[19,27]],"U"],["until","Please wait here until five because I'm still at work.","まだ仕事中なので、5時までここで待っていてください。",[[17,22]],"U"],["useful","That's really useful, so I'll write it down for later.","とても役立つので、後のために書き留めておきます。",[[14,20]],"U"],["usual","Let's meet at the usual place.","いつもの場所で会いましょう。",[[18,23]],"U"],["usually","I usually get up at seven.","私はたいてい7時に起きます。",[[2,9]],"U"],["vacation","My summer vacation starts tomorrow, so I'll visit my aunt.","明日から夏休みなので、おばを訪ねます。",[[10,18]],"V"],["vegetable","Do you want vegetables with that?","それに野菜も付けますか。",[[12,22]],"V"],["video","Let's watch this video to learn how to make pizza.","この動画を見て、ピザの作り方を学びましょう。",[[17,22]],"V"],["visit","I visit my grandmother on Sundays.","私は日曜日に祖母を訪ねます。",[[2,7]],"V"],["volleyball","We play volleyball at school during the lunch break.","学校では、昼休みにバレーボールをします。",[[8,18]],"V"],["volunteer","I'd like to work as a volunteer.","ボランティアとして働きたいです。",[[22,31]],"V"],["wait","Can you wait a minute while I finish this e-mail?","このメールを書き終えるまで、ちょっと待ってもらえますか。",[[8,12]],"W"],["wait for ~","Please wait for me near the front door after class.","授業の後、玄関のドアの近くで待っていてください。",[[7,11],[12,15]],"W"],["waiter","Let's ask the waiter if we can pay by card.","カードで払えるか、ウエーターに聞きましょう。",[[14,20]],"W"],["waitress","Let's ask the waitress if the soup contains any milk.","スープに牛乳が入っているか、ウエートレスに聞きましょう。",[[14,22]],"W"],["wake","Please wake me at seven because I have an early train.","朝早い電車に乗るので、7時に起こしてください。",[[7,11]],"W"],["wake up","What time do you wake up?","何時に目を覚ましますか。",[[17,21],[22,24]],"W"],["walk to ~","I walk to school every day.","私は毎日歩いて学校に行きます。",[[2,6],[7,9]],"W"],["want to do","I want to play soccer after I finish my homework.","宿題が終わったら、サッカーをしたいです。",[[2,6],[7,9]],"W"],["warm","It's warm today, so we can eat lunch in the garden.","今日は暖かいので、庭で昼食を食べられます。",[[5,9]],"W"],["wash","Please wash your hands before you sit down to eat.","食事のために席に着く前に、手を洗ってください。",[[7,11]],"W"],["watch","Is your watch right, or is it running fast?","あなたの時計は合っていますか、それとも進んでいますか。",[[8,13]],"W"],["water","Can I have some water, please?","お水をいただけますか。",[[16,21]],"W"],["watermelon","Would you like some watermelon after we finish eating lunch?","昼食が終わったら、スイカはいかがですか。",[[20,30]],"W"],["way","Is this the way to the station?","駅へはこの道で合っていますか。",[[12,15]],"W"],["wear","What do you want to wear?","何を着たいですか。",[[20,24]],"W"],["weather","What's the weather like there at the moment?","今、そちらの天気はどうですか。",[[11,18]],"W"],["weekend","What do you do on weekends?","あなたは週末に何をしますか。",[[18,26]],"W"],["welcome","You're always welcome here, even if you don't call first.","先に電話をしなくても、いつでも来てくださいね。",[[14,21]],"W"],["well","You sing really well, so why not join our band?","歌がとても上手なので、私たちのバンドに入りませんか。",[[16,20]],"W"],["whale","We saw a whale from the boat.","船からクジラが見えました。",[[9,14]],"W"],["wife","How is your wife, and is she enjoying her new job?","奥さんはお元気ですか。新しい仕事は楽しんでいますか。",[[12,16]],"W"],["will","I will call you tomorrow after I finish work.","明日、仕事が終わったら電話します。",[[2,6]],"W"],["win","I hope we win this game.","この試合に勝てるといいですね。",[[10,13]],"W"],["window","Please open the window because the kitchen is getting hot.","台所が暑くなってきたので、窓を開けてください。",[[16,22]],"W"],["windy","It's windy today, so be careful with your umbrella.","今日は風が強いので、傘に気をつけてください。",[[5,10]],"W"],["with","I play tennis with my father.","私は父とテニスをします。",[[14,18]],"W"],["wonderful","Have a wonderful time, and tell us about it afterward.","楽しんできて、後で話を聞かせてくださいね。",[[7,16]],"W"],["word","What does this word mean in the sentence on the board?","黒板の文では、この単語はどんな意味ですか。",[[15,19]],"W"],["work","My father works at a bank.","父は銀行で働いています。",[[10,15]],"W"],["world","I want to travel around the world.","私は世界中を旅行したいです。",[[28,33]],"W"],["worry","Don't worry about me because I can get home by myself.","一人で帰れるので、私のことは心配しないでください。",[[6,11]],"W"],["worry about ~","Don't worry about the test because there's still time to study.","まだ勉強する時間があるので、テストのことは心配しないでください。",[[6,11],[12,17]],"W"],["would","Would you like some tea while we wait for Ken?","ケンを待つ間、お茶はいかがですか。",[[0,5]],"W"],["write","Could you write it down so I don't forget?","忘れないように、書いてもらえますか。",[[10,15]],"W"],["write back","Please write back soon and tell me about your new school.","すぐに返事を書いて、新しい学校のことを教えてください。",[[7,12],[13,17]],"W"],["write to ~","Can I write to you when I move to Canada?","カナダに引っ越したら、お便りしてもいいですか。",[[6,11],[12,14]],"W"],["writer","My uncle is a writer and works from home every day.","おじは作家で、毎日自宅で仕事をしています。",[[14,20]],"W"],["wrong","Sorry, you have the wrong number.","すみません、番号をお間違えですよ。",[[20,25]],"W"],["year","I'm thirteen years old, and my birthday is in August.","私は13歳で、誕生日は8月です。",[[13,18]],"Y"],["yet","The bus isn't here yet, so we have time to talk.","バスはまだ来ていないので、話す時間があります。",[[19,22]],"Y"],["zebra","Let's go and see the zebras.","シマウマを見に行きましょう。",[[21,27]],"Z"],["zoo","Let's go to the zoo tomorrow.","明日、動物園に行きましょう。",[[16,19]],"Z"]],"3":[["A as well as B","I've invited Ken as well as the friends you met.","あなたが会った友達に加えて、ケンも招待しました。",[[17,19],[20,24],[25,27]],"A"],["a couple of ～","I've invited a couple of friends you haven't met.","あなたがまだ会ったことのない友達を、2人ほど招待しました。",[[13,14],[15,21],[22,24]],"A"],["a few ～","I've got a few questions that I'd like to ask.","お聞きしたいことが、いくつかあります。",[[9,10],[11,14]],"A"],["a friend of mine","A friend of mine has offered to drive us.","友達の一人が、車で送ってくれると言ってくれました。",[[0,1],[2,8],[9,11],[12,16]],"A"],["a glass of ～","Can I have a glass of water?","水を1杯いただけますか。",[[11,12],[13,18],[19,21]],"A"],["a little too（形容詞）","The jacket I ordered is a little too big.","注文したジャケットは、少し大きすぎます。",[[24,25],[26,32],[33,36]],"A"],["a lot","I've learned a lot since I started working here.","ここで働き始めてから、たくさんのことを学びました。",[[13,14],[15,18]],"A"],["a lot of ～","I've met a lot of friendly people since I moved here.","ここに引っ越してから、親切な人たちにたくさん出会いました。",[[9,10],[11,14],[15,17]],"A"],["a number of ～","A number of people have asked where to buy it.","それをどこで買えるか、何人もの人に聞かれました。",[[0,1],[2,8],[9,11]],"A"],["a pair of ～","I've found a pair of shoes I really like.","とても気に入った靴が、1足見つかりました。",[[11,12],[13,17],[18,20]],"A"],["a piece of ～","I've found a piece of glass on the kitchen floor.","台所の床に、ガラスの破片が落ちていました。",[[11,12],[13,18],[19,21]],"A"],["a sheet of ～","Please use a sheet of paper that's blank on both sides.","両面とも何も書いていない紙を、1枚使ってください。",[[11,12],[13,18],[19,21]],"A"],["a slice of ～","I've saved a slice of cake for my brother.","兄のために、ケーキを一切れ取っておきました。",[[11,12],[13,18],[19,21]],"A"],["a.m.","The store opens at nine a.m.","その店は午前9時に開きます。",[[24,28]],"A"],["above","The photo above the door was taken by my sister.","ドアの上の写真は、姉が撮ったものです。",[[10,15]],"A"],["abroad","Have you ever thought about studying abroad for a year?","1年間の留学を考えたことはありますか。",[[37,43]],"A"],["absent","Do you know why Ken was absent from school yesterday?","ケンが昨日学校を休んだ理由を知っていますか。",[[24,30]],"A"],["accident","The road was closed because of an accident this morning.","今朝、事故でその道が通行止めになりました。",[[34,42]],"A"],["across","The shop across the street has started selling fresh bread.","通りの向かいのお店が、焼きたてのパンを売り始めました。",[[9,15]],"A"],["act","I've never acted in a play, but I'd like to.","劇に出たことはありませんが、出てみたいです。",[[11,16]],"A"],["action","Have you seen the action film everyone's talking about?","みんなが話題にしているアクション映画を、見ましたか。",[[18,24]],"A"],["activity","What's an activity you've always wanted to try?","ずっとやってみたかった活動は何ですか。",[[10,18]],"A"],["actor","My brother is an actor.","兄は俳優です。",[[17,22]],"A"],["actress","She's the actress who was in that film we watched.","彼女、私たちが見たあの映画に出ていた女優さんだよ。",[[10,17]],"A"],["actually","Actually, I've already seen that film, but I'd watch it again.","実は、その映画はもう見ましたが、また見たいです。",[[0,8]],"A"],["add","I've added your name to the list for Saturday.","土曜日の名簿にあなたの名前を入れておきました。",[[5,10]],"A"],["address","Could you tell me where to write my address?","住所をどこに書けばいいか教えていただけますか。",[[36,43]],"A"],["adult","It's hard for an adult to learn everything again.","大人が何もかも学び直すのは大変です。",[[17,22]],"A"],["adventure","That's an adventure I'd love to share with my friends.","それは友達と一緒に体験してみたい冒険です。",[[10,19]],"A"],["advice","I've followed your advice, and I feel much better now.","あなたの助言どおりにしたら、ずっと調子がよくなりました。",[[19,25]],"A"],["afraid","I'm afraid of the dog that's standing by the gate.","門のそばにいる犬が怖いです。",[[4,10]],"A"],["after a while","After a while, I realized I didn't know where to go.","しばらくして、どこへ行けばいいか分からないことに気づきました。",[[0,5],[6,7],[8,13]],"A"],["after school","I've been helping at the library after school this week.","今週は放課後、図書館の手伝いをしています。",[[33,38],[39,45]],"A"],["again","Can you say that again?","もう一度言ってくれますか。",[[17,22]],"A"],["against","The bike leaning against the wall belongs to my brother.","壁に立てかけてある自転車は兄のものです。",[[17,24]],"A"],["age","Can you guess how old she is without asking her age?","年齢を聞かずに、彼女が何歳か当てられますか。",[[48,51]],"A"],["ago","This photo was taken two years ago in our garden.","この写真は、2年前にうちの庭で撮ったものです。",[[31,34]],"A"],["agree","I agree with what you said about the school trip.","修学旅行についてあなたが言ったことに賛成です。",[[2,7]],"A"],["agree with ～","I agree with what you said about the price.","値段についてあなたが言ったことに、賛成です。",[[2,7],[8,12]],"A"],["ahead","I can't see what's ahead because of the fog.","霧で前に何があるのか見えません。",[[19,24]],"A"],["air","I've opened the windows to let some fresh air in.","新鮮な空気を入れるため、窓を開けました。",[[42,45]],"A"],["airport","Could you tell me how to get to the airport?","空港への行き方を、教えてもらえますか。",[[36,43]],"A"],["alarm","I've set the alarm so I won't miss the bus.","バスに乗り遅れないようにアラームをセットしました。",[[13,18]],"A"],["alive","The plant I bought last year is still alive.","去年買った植物はまだ元気に育っています。",[[38,43]],"A"],["all","Is that all?","それで全部ですか。",[[8,11]],"A"],["all day (long)","I've been cleaning the house all day long.","一日中、ずっと家の掃除をしています。",[[29,32],[33,36]],"A"],["all night (long)","The baby has been crying all night long.","赤ちゃんは一晩中、ずっと泣いています。",[[25,28],[29,34]],"A"],["all over the world","Photos from our class have been shared all over the world.","私たちのクラスの写真が、世界中で共有されています。",[[39,42],[43,47],[48,51],[52,57]],"A"],["all the time","I've been feeling tired all the time since I started work.","働き始めてから、いつも疲れを感じています。",[[24,27],[28,31],[32,36]],"A"],["all the way","We've walked all the way from the station.","駅からここまで、ずっと歩いてきました。",[[13,16],[17,20],[21,24]],"A"],["almost","I've almost finished the book you lent me last week.","先週貸してくれた本は、もう少しで読み終わります。",[[5,11]],"A"],["alone","I wouldn't leave a small child alone in the car.","私なら、小さな子を車に一人で残しません。",[[31,36]],"A"],["along","The people walking along the beach are my parents.","浜辺を歩いているのは私の両親です。",[[19,24]],"A"],["aloud","Could you read aloud what's written on that sign?","あの看板に書いてあることを声に出して読んでもらえますか。",[[15,20]],"A"],["already","I've already sent the message you asked me to write.","頼まれたメッセージは、もう送信しました。",[[5,12]],"A"],["also","My sister also likes this song.","妹もこの歌が好きです。",[[10,14]],"A"],["although","Although I've tried several times, I still can't open it.","何度も試しましたが、まだ開けられません。",[[0,8]],"A"],["among","I've found your notebook among the books on my desk.","机の上の本に紛れて、あなたのノートが見つかりました。",[[25,30]],"A"],["～ and so on","We need cups, plates, napkins, and so on.","カップ、お皿、ナプキンなどが必要です。",[[31,34],[35,37],[38,40]],"A"],["angry","I'm angry because someone has eaten the cake I saved.","取っておいたケーキを誰かに食べられて、腹が立っています。",[[4,9]],"A"],["animal","What's the strangest animal you've seen near your home?","家の近くで見た、一番珍しい動物は何ですか。",[[21,27]],"A"],["another","I've found another way to get to the station.","駅への別の行き方を、見つけました。",[[11,18]],"A"],["another（形容詞）minute(s)","Could you wait another five minutes while I get ready?","支度をするので、あと5分待ってもらえますか。",[[15,22],[28,35]],"A"],["answer","I've found the answer to the question you asked yesterday.","昨日聞かれた質問の答えが、見つかりました。",[[15,21]],"A"],["anymore","I've sold my bike because I don't use it anymore.","もう使わないので、自転車は売りました。",[[41,48]],"A"],["anyone","Does anyone know how to turn on this machine?","この機械の電源の入れ方が分かる人はいますか。",[[5,11]],"A"],["anything","Do you want anything?","何か欲しいものはありますか。",[[12,20]],"A"],["anything else", arted walking.","いつものようにバスが遅れているので、歩き始めました。",[[16,18],[19,24]],"A"],["as you know","As you know, I've been working here for a year.","ご存じのように、ここで働いて1年になります。",[[0,2],[3,6],[7,11]],"A"],["ask A to do","I've asked Ken to bring the book you wanted.","欲しがっていた本を持ってくるよう、ケンに頼みました。",[[5,10],[15,17]],"A"],["ask (A) for ～","I've asked the staff for a map of this area.","この辺りの地図を、係の人にお願いしました。",[[5,10],[21,24]],"A"],["asleep","I found my son asleep on the sofa again.","また息子がソファで寝ているのを見つけました。",[[15,21]],"A"],["at a time","Please send the photos one at a time.","写真は1枚ずつ送ってください。",[[27,29],[30,31],[32,36]],"A"],["at first","I was shy at first, but I've made some friends.","最初は人見知りしていましたが、友達が何人かできました。",[[10,12],[13,18]],"A"],["at last","At last, we've found a place that's big enough.","やっと、十分な広さのある場所が見つかりました。",[[0,2],[3,7]],"A"],["at least","I've reminded him at least three times about the meeting.","会議のことは、少なくとも3回は彼に念を押しました。",[[18,20],[21,26]],"A"],["at once","The teacher told us to leave the room at once.","先生は私たちに、すぐ部屋を出るように言いました。",[[38,40],[41,45]],"A"],["at school","I've left my jacket at school, so I'm going back.","学校に上着を忘れたので、取りに戻ります。",[[20,22],[23,29]],"A"],["at the age of ～","I learned to swim at the age of seven.","7歳のときに、泳げるようになりました。",[[18,20],[21,24],[25,28],[29,31]],"A"],["at the end of ～","I've written my phone number at the end of the letter.","手紙の最後に、電話番号を書いておきました。",[[29,31],[32,35],[36,39],[40,42]],"A"],["at the foot of ～","We've booked a cabin at the foot of the mountain.","山のふもとにある小屋を、予約しました。",[[21,23],[24,27],[28,32],[33,35]],"A"],["athlete","She's an athlete who has competed in several countries.","彼女はいくつもの国で試合に出てきた選手です。",[[9,16]],"A"],["attack","My dog was attacked by another dog at the park.","公園で、うちの犬が別の犬に襲われました。",[[11,19]],"A"],["attend","I've never attended a wedding held outside before.","屋外で行われる結婚式に出席するのは初めてです。",[[11,19]],"A"],["aunt","My aunt is a teacher.","おばは先生です。",[[3,7]],"A"],["award","That's the award my brother won for his photograph.","それは兄が写真で受賞 kery you recommended.","勧めてくれたパン屋さんで、焼きたてのパンを買いました。",[[17,22]],"F"],["fridge","I've put the milk you bought in the fridge.","買ってきてくれた牛乳は、冷蔵庫に入れました。",[[36,42]],"F"],["friendly","Everyone I've met in this town has been friendly.","この町で出会った人は、みんな親しみやすい人ばかりです。",[[40,48]],"F"],["friendship","Our friendship has grown stronger since we started working together.","一緒に働き始めてから、友情が深まりました。",[[4,14]],"F"],["from A to B","I've walked from the station to the beach today.","今日は、駅から海岸まで歩きました。",[[12,16],[29,31]],"F"],["from abroad","A friend from abroad has asked us to show him around.","海外から来た友達に、案内を頼まれました。",[[9,13],[14,20]],"F"],["from beginning to end","I've read your report from beginning to end twice.","あなたの報告書を、最初から最後まで2回読みました。",[[22,26],[27,36],[37,39],[40,43]],"F"],["fruit","Would you like some fruit?","果物はいかがですか。",[[20,25]],"F"],["full","I'm full, thank you.","もうおなかいっぱいです。ありがとう。",[[4,8]],"F"],["fun","Have fun at the party!","パーティーを楽しんできてね！",[[5,8]],"F"],["funny","The story was so funny that everyone started laughing.","その話がとてもおかしくて、みんな笑い始めました。",[[17,22]],"F"],["furniture","We've bought some furniture that was made in this town.","この町で作られた家具を、いくつか買いました。",[[18,27]],"F"],["future","I've been thinking about what I'd like to do in the future.","将来何をしたいか、ずっと考えています。",[[52,58]],"F"],["garbage","I've taken out the garbage, so you don't need to.","ごみは出しておいたので、あなたは出さなくて大丈夫です。",[[19,26]],"G"],["garden","Let's have lunch in the garden.","庭で昼食を食べましょう。",[[24,30]],"G"],["gate","The gate has been locked, and I don't have a key.","門に鍵が掛かっていて、私は鍵を持っていません。",[[4,8]],"G"],["generation","My grandmother's generation didn't have the phones we use today.","祖母の世代には、今私たちが使っている電話はありませんでした。",[[17,27]],"G"],["German","The song we've been listening to is in German.","今まで聴いていた曲は、ドイツ語の歌です。",[[39,45]],"G"],["gesture","I didn't understand the gesture he made with his hand.","彼が手でした身ぶりの意味が分かりませんでした。",[[24,31]],"G"],["get a good grade","I've worked hard because I want to get a good grade.","いい成績を取りたいので、一生懸命取り組んできました。",[[35,38],[39,40],[41,45],[46,51]],"G"],["get a perfect score","I've never gotten a perfect score on this quiz.","このクイズで満点を取ったことは、まだありません。",[[11,17],[18,19],[20,27],[28,33]],"G"],["get angry","I get angry when people leave the door standing open.","ドアを開けたままにされると、腹が立ちます。",[[2,5],[6,11]],"G"],["get away from ～","I'd like to get away from the city for a while.","しばらく、都会を離れて過ごしたいです。",[[12,15],[16,20],[21,25]],"G"],["get back (from ～)","I've just got back from the trip I told you about.","話していた旅行から、今帰ってきたところです。",[[10,13],[14,18]],"G"],["get better","My ankle has got better, so I can walk again.","足首がよくなって、また歩けるようになりました。",[[13,16],[17,23]],"G"],["get cold","It's got cold, so I've brought the plants inside.","寒くなったので、植物を中に入れました。",[[5,8],[9,13]],"G"],["get dark","It's getting dark, and we still haven't found the path.","暗くなってきましたが、まだ道が見つかりません。",[[5,12],[13,17]],"G"],["get excited","The children get excited when they see the presents I've bought.","買ってきたプレゼントを見ると、子どもたちは大喜びします。",[[13,16],[17,24]],"G"],["get home","I'll call you when I've got home safely.","無事に家に着いたら、電話します。",[[24,27],[28,32]],"G"],["get hungry","I've been getting hungry earlier since I started swimming.","水泳を始めてから、早い時間におなかがすくようになりました。",[[10,17],[18,24]],"G"],["get in ～","We got in the car that was waiting outside.","外で待っていた車に、乗り込みました。",[[3,6],[7,9]],"G"],["get off (～)","Could you tell me where to get off the bus?","バスをどこで降りればいいか、教えてもらえますか。",[[27,30],[31,34]],"G"],["get on (～)","We've got on the wrong train, so let's get off.","電車を間違えたので、降りましょう。",[[6,9],[10,12]],"G"],["get out of ～","I heard someone get out of the car outside.","外で、誰かが車から降りる音が聞こえました。",[[16,19],[20,23],[24,26]],"G"],["get to ～","Could you explain how to get to the place you've booked?","予約してくれた場所への行き方を、説明してもらえますか。",[[25,28],[29,31]],"G"],["get well","I hope you get well before the trip we've planned.","計画している旅行までに、元気になるといいですね。",[[11,14],[15,19]],"G"],["gift","Thanks for the lovely gift!","すてきな贈り物をありがとう！",[[22,26]],"G"],["give","Can you give me a hand?","ちょっと手伝ってくれますか。",[[8,12]],"G"],["give A a ride","I'd give you a ride if my car weren't being repaired.","車が修理中でなければ、乗せていってあげるのですが。",[[4,8],[13,14],[15,19]],"G"],["give back ～","I've given back all the books I borrowed from Ken.","ケンから借りた本は、全部返しました。",[[5,10],[11,15]],"G"],["give up doing","I've given up trying to fix this old printer.","この古いプリンターを直そうとするのは、諦めました。",[[5,10],[11,13],[14,20]],"G"],["glad","I'm glad you've found a job you really like.","本当に好きな仕事が見つかって、よかったですね。",[[4,8]],"G"],["glass","Can I have a clean glass?","きれいなコップをもらえますか。",[[19,24]],"G"],["glove","Have you seen the glove I dropped near the bench?","ベンチの近くに落とした手袋を見ませんでしたか。",[[18,23]],"G"],["go [walk] straight","Go straight until you reach the bridge shown on this map.","この地図の橋に着くまで、まっすぐ進んでください。",[[0,2],[3,11]],"G"],["go abroad","I've always wanted to go abroad with my best friend.","親友と海外へ行きたいと、ずっと思っています。",[[22,24],[25,31]],"G"],["go and do","Could you go and check which windows are still open?","まだ開いている窓がどれか、見てきてもらえますか。",[[10,12],[13,16]],"G"],["go away","The pain hasn't gone away, so I've called the doctor.","痛みが治まらないので、医師に電話しました。",[[16,20],[21,25]],"G"],["go back home","I've decided to go back home after I graduate.","卒業したら、故郷に帰ることにしました。",[[16,18],[19,23],[24,28]],"G"],["go by","A year has gone by since we moved here.","ここに引っ越してから、1年がたちました。",[[11,15],[16,18]],"G"],["go fishing","Have you ever gone fishing with the people from work?","職場の人たちと、釣りに行ったことはありますか。",[[14,18],[19,26]],"G"],["go for a walk","I'd go for a walk if it weren't raining.","雨が降っていなければ、散歩に行くのですが。",[[4,6],[7,10],[11,12],[13,17]],"G"],["go home","I've told Ken to go home before it gets dark.","暗くなる前に帰るよう、ケンに言いました。",[[17,19],[20,24]],"G"],["go into ～","I saw someone go into the room you've just cleaned.","今掃除したばかりの部屋に、誰かが入るのを見ました。",[[14,16],[17,21]],"G"],["go on a tour","We've decided to go on a tour of the castle.","お城を見学するツアーに、参加することにしました。",[[17,19],[20,22],[23,24],[25,29]],"G"],["go on a trip","I've never gone on a trip without taking my camera.","カメラを持たずに旅行したことは、一度もありません。",[[11,15],[16,18],[19,20],[21,25]],"G"],["go out (for ～)","We've decided to go out for dinner after the meeting.","会議の後は、夕食を食べに出かけることにしました。",[[17,19],[20,23]],"G"],["go shopping","I've made a list, so we're ready to go shopping.","リストを作ったので、買い物に行けます。",[[36,38],[39,47]],"G"],["go to bed","I've finished everything, so I'm going to bed now.","全部終わったので、もう寝ます。",[[33,38],[39,41],[42,45]],"G"],["go to see a movie","I've asked Ken to go to see a movie with us.","私たちと映画を見に行かないか、ケンを誘いました。",[[18,20],[21,23],[24,27],[28,29],[30,35]],"G"],["go to sleep","The baby has gone to sleep, so please speak quietly.","赤ちゃんが眠ったので、静かに話してください。",[[13,17],[18,20],[21,26]],"G"],["go to the doctor","I've decided to go to the doctor about this cough.","このせきを診てもらいに、病院へ行くことにしました。",[[16,18],[19,21],[22,25],[26,32]],"G"],["go to work","I've been going to work by bike since last month.","先月から、自転車で通勤しています。",[[10,15],[16,18],[19,23]],"G"],["goal","I've finally reached the goal I set last year.","去年決めた目標を、ようやく達成しました。",[[25,29]],"G"],["god","Do you know which god the people here pray to?","この土地の人々がどの神様に祈るか知っていますか。",[[18,21]],"G"],["goldfish","The goldfish we bought last summer has grown a lot.","去年の夏に買った金魚が、ずいぶん大きくなりました。",[[4,12]],"G"],["government","The government has announced a plan to repair this road.","政府は、この道路を修理する計画を発表しました。",[[4,14]],"G"],["grade","What grade are you in?","何年生ですか。",[[5,10]],"G"],["graduate","I've kept in touch with my friends since we graduated.","卒業してからも、友達とはずっと連絡を取り合っています。",[[44,53]],"G"],["graduate from ～","It's been three years since I graduated from this school.","この学校を卒業してから、3年になります。",[[30,39],[40,44]],"G"],["gram","Add ten grams of sugar.","砂糖を10グラム加えてください。",[[8,13]],"G"],["grandfather","My grandfather is very kind.","祖父はとても親切です。",[[3,14]],"G"],["grandmother","My grandmother likes flowers.","祖母は花が好きです。",[[3,14]],"G"],["grandparent","I've learned how to make the bread my grandparents used to bake.","祖父母がよく焼いていたパンの作り方を、覚え ]],"H"],["have a cold","I've had a cold since I got back from the trip.","旅行から帰ってきてから、ずっと風邪をひいています。",[[5,8],[9,10],[11,15]],"H"],["have a dream","I've had the same dream about missing a train twice.","電車に乗り遅れる同じ夢を、2回見ました。",[[0,4],[5,8],[18,23]],"H"],["have a fight","I've had a fight with Ken, and I'm still upset.","ケンとけんかして、まだ気持ちが落ち着きません。",[[5,8],[9,10],[11,16]],"H"],["have a good memory","You have a good memory for names you've heard only once.","一度聞いただけの名前を、よく覚えていますね。",[[4,8],[9,10],[11,15],[16,22]],"H"],["have a good sleep","I had a good sleep, so I feel much better now.","ぐっすり眠ったので、ずっと気分がよくなりました。",[[2,5],[6,7],[8,12],[13,18]],"H"],["have a great time","We've had a great time staying with your family.","ご家族の所に泊めていただいて、とても楽しかったです。",[[6,9],[10,11],[12,17],[18,22]],"H"],["have a stomachache","I've had a stomachache since I finished my lunch.","昼食を食べ終えてから、ずっとおなかが痛いです。",[[5,8],[9,10],[11,22]],"H"],["have a talk","I'd like to have a talk about what's happened.","起きたことについて、話し合いたいです。",[[12,16],[17,18],[19,23]],"H"],["have been to ～","I've been to the café you told me about.","教えてくれたカフェに、行ってきました。",[[0,4],[5,9],[10,12]],"H"],["have enough（名詞）to do","I've checked, and we have enough money to buy it.","確認したところ、それを買うだけのお金はあります。",[[21,25],[26,32],[39,41]],"H"],["have fun","We've had fun making the decorations for your party.","あなたのパーティーの飾り作りを、楽しみました。",[[6,9],[10,13]],"H"],["have lunch","I've already had lunch, but I'd love some coffee.","お昼はもう食べましたが、コーヒーはいただきたいです。",[[13,16],[17,22]],"H"],["have never been to ～","I've never been to a place as quiet as this.","こんなに静かな所に来たのは、初めてです。",[[0,4],[5,10],[11,15],[16,18]],"H"],["have no idea","I have no idea why the lights have gone out.","なぜ明かりが消えたのか、さっぱり分かりません。",[[2,6],[7,9],[10,14]],"H"],["have time to do","I'd help you if I had time to stay.","ここにいられる時間があれば、手伝うのですが。",[[18,21],[22,26],[27,29]],"H"],["have to do","I've lost my key, so I have to wait outside.","鍵をなくしたので、外で待たなければなりません。",[[23,27],[28,30]],"H"],["headache","I've had a heada   if (!grade) return;
  const nw=W().filter(w=>!w.ph).length, np=W().length-nw;
  $('lead').textContent = `英検${ZEN[grade]}級レベルの単語 ${nw} 語・熟語 ${np} 項目。クリックすると例文と日本語訳が出ます。`;
  const TY=[{k:'w',label:'単語',n:nw},{k:'p',label:'熟語',n:np}];
  $('tychips').innerHTML = TY.map(x=>`<button class="chip" type="button" data-t="${x.k}" aria-pressed="${typ[x.k]}">${x.label} <span style="font-weight:500">${x.n}</span></button>`).join('');
  $('tychips').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{typ[b.dataset.t]=!typ[b.dataset.t]; store.set('tango-typ',JSON.stringify(typ)); renderGrades(); route();});
}
$('grades').addEventListener('click',e=>{const b=e.target.closest('.grade'); if(!b) return; if(b.dataset.g===grade && !cur && !query) return; query=''; $('q').value=''; location.hash='#g'+b.dataset.g+'/A';});
function renderAZ(){
  const has=new Set(visible().map(w=>w.L));
  $('az').innerHTML = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map(L=>`<button type="button" data-l="${L}" class="${!query&&L===letter&&!cur?'on':''}" ${has.has(L)?'':'disabled'}>${L}</button>`).join('');
  $('az').querySelectorAll('button').forEach(b=>b.onclick=()=>{query=''; $('q').value=''; location.hash='#g'+grade+'/'+b.dataset.l;});
}
function wordBtn(w){
  return `<button class="w${w.ph?' ph':''}${w.ph&&w.h.length>22?' wide':''}" type="button" data-i="${w.i}"><span class="hw">${esc(w.h)}</span></button>`;
}
function listItems(){
  const v=visible();
  if(query){ const q=query.toLowerCase(); return v.filter(w=>w.h.toLowerCase().includes(q)).sort((a,b)=>(b.h.toLowerCase().startsWith(q))-(a.h.toLowerCase().startsWith(q))||a.i-b.i); }
  return v.filter(w=>w.L===letter);
}
function renderList(){
  const items=listItems();
  const title = query ? `<b style="font-size:26px">“${esc(query)}”</b>` : `<b>${letter}</b>`;
  $('main').innerHTML = `<div class="lettertitle">${title}<span>${items.length} 項目</span></div>` +
    (items.length?`<div class="words">${items.map(wordBtn).join('')}</div>`:`<div class="empty">該当する語がありません</div>`);
  $('main').querySelectorAll('.w').forEach(b=>b.onclick=()=>{location.hash='#g'+grade+'/w='+b.dataset.i;});
}
function highlight(en, spans){
  const sp=[...spans].sort((a,b)=>a[0]-b[0]), merged=[];
  for(const [a,b] of sp){ const last=merged[merged.length-1];
    if(last && a>=last[1] && /^\s*$/.test(en.slice(last[1],a))) last[1]=Math.max(last[1],b);
    else if(!last || a>=last[1]) merged.push([a,b]); }
  let out='', pos=0;
  for(const [a,b] of merged){ out+=esc(en.slice(pos,a))+'<mark>'+esc(en.slice(a,b))+'</mark>'; pos=b; }
  return out+esc(en.slice(pos));
}
let jaOpen=false;
function renderDetail(w){
  const seq=listItems(), k=seq.indexOf(w), prev=k>0?seq[k-1]:null, next=k>=0&&k<seq.length-1?seq[k+1]:null;
  $('main').innerHTML = `
    <button class="back" type="button" id="back">← ${query?'検索結果':letter+' の一覧'}へ</button>
    <div class="dhead"><h2>${esc(w.h)}</h2><span class="dsub">英検${ZEN[grade]}級レベル・${w.ph?'熟語':'単語'}</span></div>
    <div class="bar">
      <button class="btn" type="button" id="rate" aria-pressed="false">ゆっくり</button>
      <label class="vsel">声<select class="vpick" aria-label="読み上げの声"></select></label>
    </div>
    <div class="card" id="card">
      <div class="en" lang="en">${highlight(w.en, w.spans)}</div>
      <div class="ja"${jaOpen?'':' hidden'}>${esc(w.ja)}</div>
      <div class="acts"><button class="btn tj" type="button" aria-pressed="${jaOpen}">${jaOpen?'訳を隠す':'日本語訳'}</button><button class="btn say" type="button">🔊 読み上げ</button></div>
    </div>
    <div class="wnav">
      ${prev?`<button class="btn" type="button" data-i="${prev.i}">◀ ${esc(prev.h)}</button>`:'<span></span>'}
      ${next?`<button class="btn" type="button" data-i="${next.i}">${esc(next.h)} ▶</button>`:'<span></span>'}
    </div>`;
  const c=$('card'), tj=c.querySelector('.tj'), ja=c.querySelector('.ja');
  $('back').onclick=()=>{location.hash='#g'+grade+'/'+(query?'q='+encodeURIComponent(query):letter);};
  tj.onclick=()=>{jaOpen=ja.hidden; ja.hidden=!jaOpen; tj.setAttribute('aria-pressed',jaOpen); tj.textContent=jaOpen?'訳を隠す':'日本語訳';};
  c.querySelector('.say').onclick=()=>{stop(); speak(w.en,c);};
  $('main').querySelectorAll('.wnav .btn').forEach(b=>b.onclick=()=>{location.hash='#g'+grade+'/w='+b.dataset.i;});
  fillVoices();
  $('rate').setAttribute('aria-pressed',slow); $('rate').onclick=e=>{slow=!slow; e.currentTarget.setAttribute('aria-pressed',slow);};
  toTop();
}
// speech
let slow=false, voice=null, enVoices=[];
// 自然な音声（Edge の Natural/Online、Chrome の Google、Apple の Premium/Enhanced）を優先
const NOVELTY=/\b(Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Good News|Jester|Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox|Fred|Junior|Ralph|Kathy|Grandma|Grandpa|Eddy|Flo|Reed|Rocko|Sandy|Shelley)\b/;
function vRank(v){
  const n=v.name, us=/^en[-_]US/i.test(v.lang)?0:0.5;
  if(NOVELTY.test(n)) return 9;
  if(/Natural|Online/i.test(n)) return 0+us;
  if(/^Google/i.test(n)) return (/US English/i.test(n)?1:1.2)+us;
  if(/Premium|Enhanced|Siri/i.test(n)) return 2+us;
  if(/Samantha|Ava|Allison|Aria|Jenny|Alex|Daniel|Karen|Moira/i.test(n)) return 3+us;
  return 5+us;
}
const isNatural=v=>vRank(v)<3;
function pickVoice(){
  enVoices=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang)).sort((a,b)=>vRank(a)-vRank(b)||a.name.localeCompare(b.name));
  const chosen=store.get('goi-voice');
  voice=(chosen&&enVoices.find(v=>v.voiceURI===chosen))||enVoices[0]||null;
  fillVoices();
}
function fillVoices(){
  const chosen=store.get('goi-voice')||'';
  const nat=enVoices.filter(isNatural), rest=enVoices.filter(v=>!isNatural(v));
  const opt=(v,star)=>`<option value="${esc(v.voiceURI)}">${star?'★ ':''}${esc(v.name+' ('+v.lang+')')}</option>`;
  const html='<option value="">（自動：'+esc(voice?voice.name:'既定')+'）</option>'+
    (nat.length?'<optgroup label="自然な音声">'+nat.map(v=>opt(v,1)).join('')+'</optgroup>':'')+
    (rest.length?'<optgroup label="その他の音声">'+rest.map(v=>opt(v,0)).join('')+'</optgroup>':'');
  document.querySelectorAll('select.vpick').forEach(sel=>{
    sel.innerHTML=html;
    sel.value=enVoices.some(v=>v.voiceURI===chosen)?chosen:'';
    sel.onchange=()=>{store.set('goi-voice',sel.value); pickVoice(); stop(); speak('Hello. This is my voice.');};
  });
}
if('speechSynthesis' in window){pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; setTimeout(pickVoice,500); setTimeout(pickVoice,1500);}
$('vtest').onclick=()=>{stop(); speak('Hello. Nice to meet you.');};
function speak(text,card,done){
  if(!('speechSynthesis' in window)){alert('このブラウザは読み上げに対応していません');return;}
  document.querySelectorAll('.card.playing').forEach(c=>c.classList.remove('playing'));
  const u=new SpeechSynthesisUtterance(text.replace(/[’‘]/g,"'").replace(/[“”]/g,'"'));
  u.lang='en-US'; if(voice) u.voice=voice; u.rate=slow?0.7:0.95;
  card&&card.classList.add('playing');
  u.onend=u.onerror=()=>{card&&card.classList.remove('playing'); done&&done();};
  speechSynthesis.speak(u);
}
function stop(){ if('speechSynthesis' in window) speechSynthesis.cancel(); document.querySelectorAll('.card.playing').forEach(c=>c.classList.remove('playing')); }
// routing: #g5/A  #g5/w=12  #g5/q=xxx
function route(){
  stop();
  const h=decodeURIComponent(location.hash.slice(1));
  const m=h.match(/^g([543])(?:\/(.*))?$/);
  cur=null;
  if(!m){ grade=null; renderGrades(); $('main').innerHTML='<p class="hint">上のボタンでレベルを選んでください。</p>'; store.set('tango-pos',''); return; }
  grade=m[1]; const rest=m[2]||'A';
  store.set('tango-pos', h);
  if(rest.startsWith('w=')){ const w=W()[Number(rest.slice(2))]; if(w){ cur=w; if(!query) letter=w.L; renderGrades(); renderAZ(); renderDetail(w); return; } }
  else if(rest.startsWith('q=')){ query=rest.slice(2); $('q').value=query; }
  else if(/^[A-Z]$/.test(rest)){ letter=rest; query=''; $('q').value=''; }
  renderGrades(); renderAZ(); renderList();
}
let qt;
$('q').addEventListener('input',e=>{clearTimeout(qt); qt=setTimeout(()=>{query=e.target.value.trim(); history.replaceState(null,'','#g'+grade+'/'+(query?'q='+encodeURIComponent(query):letter)); route();},150);});
window.addEventListener('hashchange',route);
function toTop(){ if (EMBED) parent.postMessage({ sub: true, t: "top" }, "*"); else window.scrollTo(0,0); }
if (EMBED) {
  const post = () => parent.postMessage({ sub: true, t: "h", h: Math.ceil(document.documentElement.getBoundingClientRect().height) }, "*");
  new ResizeObserver(post).observe(document.body); window.addEventListener("load", post);
  window.addEventListener("message", e => {
    const d = e.data || {};
    if (d.t === "theme") document.documentElement.dataset.theme = d.dark ? "dark" : "light";
    if (d.t === "stop") { try { stop(); } catch (er) {} }
  });
}
if (!location.hash) { const p=store.get('tango-pos'); if (p) history.replaceState(null,'','#'+p); }
route();
if (EMBED) parent.postMessage({ sub: true, t: "ready" }, "*");
</script>
