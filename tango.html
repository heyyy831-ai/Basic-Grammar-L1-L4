 corporation whose offices are near our school.","彼女は、私たちの学校の近くに事務所がある企業に入りました。",[[13,24]],"C"],["correct","You should have checked that the address was correct.","住所が正しいか、確認するべきでした。",[[45,52]],"C"],["cost","This would cost less than repairing our old one.","これなら、古いものを修理するより安く済むでしょう。",[[11,15]],"C"],["costume","You should wear whichever costume you feel comfortable in.","着ていて落ち着く衣装なら、どれを着てもよいでしょう。",[[26,33]],"C"],["Could [Can] you tell me where ~?","Could you tell me where you'd like to meet?","どこで会いたいか、教えていただけますか。",[[0,5],[6,9],[10,14],[15,17],[18,23]],"C"],["count","By noon, we'll have counted all the tickets.","正午までには、チケットをすべて数え終えているでしょう。",[[20,27]],"C"],["countryside","Living in the countryside would give us more space.","田舎に住めば、もっと広々と暮らせるでしょう。",[[14,25]],"C"],["couple","The couple had lived next door before moving abroad.","そのご夫婦は、海外へ移る前は隣に住んでいました。",[[4,10]],"C"],["courage","It was her courage that made me speak up.","私が声を上げるきっかけは、彼女の勇気でした。",[[11,18]],"C"],["cover","The table was covered with papers when I arrived.","私が着いたとき、テーブルは書類で覆われていました。",[[14,21]],"C"],["crash","I heard something crash in the kitchen.","台所で、何かが大きな音を立てて落ちるのが聞こえました。",[[18,23]],"C"],["create","We want to create a welcoming space for everyone.","誰もが気軽に来られる場所を作りたいです。",[[11,17]],"C"],["creation","It was her latest creation that everyone wanted to photograph.","誰もが写真に撮りたがったのは、彼女の最新作でした。",[[18,26]],"C"],["credit","I'd pay by credit card if I were you.","私があなたなら、クレジットカードで払います。",[[11,17]],"C"],["crime","The crime had happened before anyone noticed the broken window.","割れた窓に誰かが気付く前に、犯罪は起きていました。",[[4,9]],"C"],["crocodile","We watched a crocodile slide quietly into the river.","ワニが静かに川へ滑り込むのを、見ていました。",[[13,22]],"C"],["crop","Heavy rain had damaged the crop before the harvest.","収穫前に、大雨で作物が傷んでいました。",[[27,31]],"C"],["crowd","I saw her disappear into the crowd.","彼女が人混みの中へ消えるのを、見ました。",[[29,34]],"C"],["cure","They're trying to find a cure for the disease.","彼らは、その病気の治療法を見つけようとしています。",[[25,29]],"C"],["currently","We're currently considering moving to a larger apartment.","現在、もっと広いアパートへの引っ越しを検討しています。",[[6,15]],"C"],["custom","You should respect local customs wherever you travel.","どこへ旅行しても、地元の習慣を尊重するとよいでしょう。",[[25,32]],"C"],["customer","We should listen to whatever the customer says.","お客様のお話には、何であれ耳を傾けるべきです。",[[33,41]],"C"],["cute","I couldn't help smiling at your cute puppy.","あなたのかわいい子犬を見て、思わずほほ笑みました。",[[32,36]],"C"],["cycle","I'd cycle to work if the roads were safer.","道がもっと安全なら、自転車で通勤するのですが。",[[4,9]],"C"],["damage","They'll have repaired the damage by next Friday.","来週の金曜日までには、その損傷を修理し終えているでしょう。",[[26,32]],"D"],["danger","The danger made us turn back before reaching the summit.","危険だったので、頂上に着く前に引き返しました。",[[4,10]],"D"],["dangerous","I wouldn't park anywhere dangerous, especially near the school.","私なら、特に学校の近くでは危険な場所に駐車しません。",[[25,34]],"D"],["data","We've been collecting data since the project began.","計画が始まって以来、データを集め続けています。",[[22,26]],"D"],["date","You should have told me the correct date.","正しい日付を、私に伝えるべきでした。",[[36,40]],"D"],["dead","My phone must have been dead when you called.","電話をくれたとき、私の携帯は電池切れだったのでしょう。",[[24,28]],"D"],["death","I wish I'd visited him before his death.","亡くなる前に、彼を訪ねておけばよかったです。",[[34,39]],"D"],["decide","You should decide what matters most to you.","自分にとって一番大切なことを、決めるとよいでしょう。",[[11,17]],"D"],["decide on ~","We should have decided on a date earlier.","日取りは、もっと早く決めるべきでした。",[[15,22],[23,25]],"D"],["decision","We had made our decision before the price increased.","値上がりする前に、私たちは決めていました。",[[16,24]],"D"],["decorate","The room was decorated with flowers from our garden.","部屋は、うちの庭の花で飾られていました。",[[13,22]],"D"],["decoration","I watched the children make decorations for the party.","子どもたちがパーティーの飾りを作るのを、見ていました。",[[28,39]],"D"],["decrease","Sales had decreased before we changed our opening hours.","営業時間を変える前から、売り上げは減っていました。",[[10,19]],"D"],["degree","She'll have completed her degree by next summer.","来年の夏までには、彼女は学位を取得しているでしょう。",[[26,32]],"D"],["delay","We should have allowed for a delay at the airport.","空港での遅れを、見込んでおくべきでした。",[[29,34]],"D"],["delicate","You should handle these delicate glasses with care.","この繊細なグラスは、丁寧に扱うべきです。",[[24,32]],"D"],["delicious","The delicious smell made us stop at the bakery.","おいしそうな匂いに誘われて、パン屋に立ち寄りました。",[[4,13]],"D"],["delighted","We were delighted with what you arranged for us.","手配してくださった内容に、私たちは大変満足しました。",[[8,17]],"D"],["deliver","I'll have the flowers delivered before she gets home.","彼女が帰宅する前に、花を届けてもらいます。",[[22,31]],"D"],["delivery","We should arrange delivery for a day when you're home.","家にいる日に、配達してもらうよう手配しましょう。",[[18,26]],"D"],["demonstrate","Would you please demonstrate how to use this machine?","この機械の使い方を、実演してもらえますか。",[[17,28]],"D"],["demonstration","We watched the chef give a cooking demonstration.","シェフが料理の実演をするところを、見ていました。",[[35,48]],"D"],["dentist","I need to see a dentist.","歯医者に行かなくてはなりません。",[[16,23]],"D"],["deny","He denied taking the money from my desk.","彼は、私の机のお金を取ったことを否定しました。",[[3,9]],"D"],["department","Would you please put me through to the sales department?","営業部につないでいただけますか。",[[45,55]],"D"],["depend","We should depend less on cars for short journeys.","近くへ行くときは、車に頼りすぎないほうがよいでしょう。",[[10,16]],"D"],["depend on [upon] ~","The price would depend on which room we chose.","料金は、どの部屋を選ぶかによるでしょう。",[[16,22],[23,25]],"D"],["dependent","I'd be less dependent on buses if I could drive.","運転できれば、それほどバスに頼らずに済むのですが。",[[12,21]],"D"],["describe","Would you please describe the bag that you lost?","なくしたかばんがどのようなものか、説明できますか。",[[17,25]],"D"],["desert","We found a village whose houses overlooked the desert.","家々から砂漠が見渡せる村を、見つけました。",[[47,53]],"D"],["design","I prefer a less complicated design than this one.","これより、もっと単純なデザインのほうが好きです。",[[28,34]],"D"],["despite","Despite the rain, we had already decided to go.","雨にもかかわらず、私たちはすでに出かけると決めていました。",[[0,7]],"D"],["dessert","What would you like to have for dessert tonight?","今夜のデザートは、何がいいですか。",[[32,39]],"D"],["destroy","The storm might have destroyed the old wooden bridge.","嵐で、古い木の橋が壊れたのかもしれません。",[[21,30]],"D"],["detail","Would you please explain that last detail once more?","最後の細かい点を、もう一度説明してもらえますか。",[[35,41]],"D"],["develop","We've been trying to develop a better teaching method.","もっと良い指導方法を、開発しようとし続けています。",[[21,28]],"D"],["die","The flowers I've been growing have all died.","育てていた花が、全部枯れてしまいました。",[[39,43]],"D"],["diet","I'm trying to include more vegetables in my diet.","食生活にもっと野菜を取り入れようとしています。",[[44,48]],"D"],["different","I'd choose something different if I were you.","私があなたなら、違うものを選びます。",[[21,30]],"D"],["difficult","The task was less difficult than I'd imagined.","その作業は、想像していたほど難しくありませんでした。",[[18,27]],"D"],["difficulty","I've had difficulty sleeping since I moved here.","ここに引っ越してから、寝付きがよくありません。",[[9,19]],"D"],["dig","The dog likes to dig in the garden.","その犬は、庭で穴を掘るのが好きです。",[[17,20]],"D"],["dinosaur","My son wants to see the dinosaur exhibit.","息子は恐竜の展示を見たがっています。",[[24,32]],"D"],["direct","A direct flight would save us several hours.","直行便なら、数時間を節約できるでしょう。",[[2,8]],"D"],["direction","I wish I'd checked which direction we should take.","どちらへ進むべきか、確認しておけばよかったです。",[[25,34]],"D"],["director","The director had everyone rehearse the scene again.","監督は全員に、もう一度その場面を練習させました。",[[4,12]],"D"],["disappear","I saw my dog disappear around the corner.","犬が角を曲がって見えなくなるのを、見ました。",[[13,22]],"D"],["disappoint","I didn't want to disappoint my parents.","両親をがっかりさせたくありませんでした。",[[17,27]],"D"],["disaster","It was the disaster that brought our community together.","地域が一つになるきっかけは、その災害でした。",[[11,19]],"D"],["discount","You should have asked about the student discount.","学生割引について、尋ねておくべきでした。",[[40,48]],"D"],["discover","We returned home, only to discover the door unlocked.","帰宅すると、ドアに鍵がかかっていないことが分かりました。",[[26,34]],"D"],["discovery","The discovery made us rethink what we knew.","その発見で、知っていたことを考え直しました。",[[4,13]],"D"],["discuss","We need to discuss the plans for Friday.","金曜日の予定について、話し合う必要があります。",[[11,18]],"D"],["disease","She studies a disease whose cause is still unknown.","彼女は、原因がまだ分からない病気を研究しています。",[[14,21]],"D"],["dislike","I dislike driving when it's dark and rainy.","暗くて雨が降っているときの運転は苦手です。",[[2,9]],"D"],["display","Would you please put these books on the front display?","これらの本を、店の前の陳列場所に置いてもらえますか。",[[46,53]],"D"],["distance","The distance would be manageable if we took turns driving.","交代で運転すれば、その距離でも無理なく行けるでしょう。",[[4,12]],"D"],["divide","We should divide the work according to everyone's strengths.","それぞれの得意分野に応じて、仕事を分担するとよいでしょう。",[[10,16]],"D"],["do A harm","You might have done yourself harm by lifting that.","それを持ち上げて、体を傷めていたかもしれません。",[[15,19],[29,33]],"D"],["do well","You should do well if you keep practicing.","練習を続ければ、うまくできるはずです。",[[11,13],[14,18]],"D"],["Do you mind if ...?","Do you mind if I take whatever chair is free?","空いている椅子なら、どれを使っても構いませんか。",[[0,2],[3,6],[7,11],[12,14]],"D"],["Does that mean ...?","Does that mean you had already left before I called?","電話したときには、もう出発していたということですか。",[[0,4],[5,9],[10,14]],"D"],["Don't worry.","Don't worry, whatever happens during the journey.","旅行中に何が起きても、心配しないでください。",[[0,5],[6,11]],"D"],["dormitory","This is the dormitory where I spent my first year.","ここが、1年目を過ごした学生寮です。",[[12,21]],"D"],["double","I'd like a double room for two nights.","ダブルルームを2泊予約したいのですが。",[[11,17]],"D"],["downstairs","I could hear someone play the piano downstairs.","下の階で、誰かがピアノを弾くのが聞こえました。",[[36,46]],"D"],["dramatic","The lighting had a less dramatic effect than we'd hoped.","照明の効果は、期待していたほど劇的ではありませんでした。",[[24,32]],"D"],["draw","I've been drawing pictures of the flowers in our garden.","庭の花の絵を、ずっと描いています。",[[10,17]],"D"],["dress","I'd wear whichever dress makes you feel more confident.","私なら、より自信を持てるほうのワンピースを着ます。",[[19,24]],"D"],["dress up","Do we need to dress up for the party?","そのパーティーには、おしゃれをして行く必要がありますか。",[[14,19],[20,22]],"D"],["drop by","I dropped by, only to find the office closed.","立ち寄りましたが、事務所は閉まっていました。",[[2,9],[10,12]],"D"],["drop in at [on] ~","We should drop in at the bakery before leaving.","出発前に、パン屋へちょっと寄るとよいでしょう。",[[10,14],[15,17],[18,20]],"D"],["drugstore","This is the drugstore where I bought the thermometer.","ここが、私が体温計を買った薬局です。",[[12,21]],"D"],["due to ~","The flight had been delayed due to fog.","霧のために、飛行機は遅れていました。",[[28,31],[32,34]],"D"],["each other","I wish we could see each other more often.","もっとよく、会えたらいいのに。",[[20,24],[25,30]],"E"],["earn","By Friday, I'll have earned enough to buy the ticket.","金曜日までには、チケット代を稼げているでしょう。",[[21,27]],"E"],["earthquake","I'd never experienced an earthquake before I moved here.","ここに引っ越すまでは、地震を体験したことがありませんでした。",[[25,35]],"E"],["easily","The new lock lets us open the door more easily.","新しい鍵のおかげで、ドアを開けやすくなりました。",[[40,46]],"E"],["eat out","Would you like to eat out tonight?","今夜は、外食しませんか。",[[18,21],[22,25]],"E"],["economy","The local economy would improve if more tourists visited.","観光客が増えれば、地元の経済は良くなるでしょう。",[[10,17]],"E"],["edge","You should keep hot drinks away from the table's edge.","熱い飲み物は、テーブルの端から離しておくべきです。",[[49,53]],"E"],["educate","We want to educate children about local wildlife.","地元の野生生物について、子どもたちに教えたいです。",[[11,18]],"E"],["education","She returned to the town where her education had begun.","彼女は、教育を受け始めた町へ戻りました。",[[35,44]],"E"],["effect","The medicine should have taken effect by now.","その薬は、もう効いているはずです。",[[31,37]],"E"],["effort","It was your effort that made the event successful.","行事が成功したのは、あなたの尽力のおかげでした。",[[12,18]],"E"],["either A or B","I'd choose either the salad or the soup.","私なら、サラダかスープのどちらかを選びます。",[[11,17],[28,30]],"E"],["electricity","Without electricity, we would have to close the shop.","電気がなければ、店を閉めなければならないでしょう。",[[8,19]],"E"],["electronic","You should have switched off your electronic devices earlier.","電子機器は、もっと早く電源を切るべきでした。",[[34,44]],"E"],["else","Give the spare ticket to whoever else wants to come.","ほかに来たい人がいれば、その人に予備の券をあげてください。",[[33,37]],"E"],["embarrass","I didn't mean to embarrass you in front of everyone.","みんなの前で、あなたに恥をかかせるつもりはありませんでした。",[[17,26]],"E"],["emergency","We should agree on what to do in an emergency.","緊急時に何をするか、決めておくべきです。",[[36,45]],"E"],["emotion","It was the emotion in her voice that moved me.","心を動かされたのは、彼女の声にこもった感情でした。",[[11,18]],"E"],["employ","The shop had employed fifty people before it closed.","その店は、閉店前には50人を雇っていました。",[[13,21]],"E"],["employee","Ask whichever employee is free to help you.","手の空いている店員なら、誰にでも助けを頼んでください。",[[14,22]],"E"],["empty","Would you please leave the seat beside me empty?","私の隣の席は、空けておいてもらえますか。",[[42,47]],"E"],["end up doing [with ~]","We might end up staying another night.","結局、もう1泊することになるかもしれません。",[[9,12],[13,15],[16,23]],"E"],["endlessly","We would talk endlessly about our plans after school.","放課後には、計画についていつまでも話したものでした。",[[14,23]],"E"],["enemy","The game's rules let you escape without fighting an enemy.","そのゲームでは、敵と戦わずに逃げることもできます。",[[52,57]],"E"],["energy","I wish I had enough energy to join you.","ご一緒できるだけの元気があればいいのに。",[[20,26]],"E"],["engine","The engine must have stopped while we were inside.","私たちが中にいる間に、エンジンが止まったのでしょう。",[[4,10]],"E"],["engineer","We had an engineer check the heating system.","技術者に、暖房設備を点検してもらいました。",[[10,18]],"E"],["enjoyable","It's been an enjoyable evening, and I'd love to come again.","楽しい夜でしたし、ぜひまた来たいです。",[[13,22]],"E"],["enough","By June, I'll have saved enough for a new bike.","6月までには、新しい自転車の代金を貯めているでしょう。",[[25,31]],"E"],["enough to do","I'd be strong enough to lift it if I trained.","鍛えれば、それを持ち上げられるくらい強くなるでしょう。",[[14,20],[21,23]],"E"],["enter","I've forgotten the code we need to enter the building.","建物に入るための暗証番号を忘れてしまいました。",[[35,40]],"E"],["entertain","This game should entertain the children during the journey.","このゲームなら、移動中に子どもたちが楽しめるでしょう。",[[17,26]],"E"],["entertainment","The hotel is known for its live entertainment.","そのホテルは、ライブの催しで知られています。",[[32,45]],"E"],["entrance","I found a bicycle blocking the entrance this morning.","今朝、自転車が入口をふさいでいました。",[[31,39]],"E"],["environment","We've been trying to create a quieter environment for studying.","もっと静かに勉強できる環境を作ろうと、取り組んでいます。",[[38,49]],"E"],["environmentally","We should choose a more environmentally friendly product.","もっと環境に優しい製品を、選ぶべきです。",[[24,39]],"E"],["equally","I'll let you decide how to divide the work equally.","仕事を均等に分ける方法は、あなたに決めてもらいます。",[[43,50]],"E"],["equipment","Do we need to bring our own equipment?","用具は、自分たちで持ってくる必要がありますか。",[[28,37]],"E"],["escape","I watched the cat escape through the open window.","猫が開いた窓から逃げるのを、見ていました。",[[18,24]],"E"],["especially","I wish I'd visited the coast, especially that little village.","海岸、特にあの小さな村を訪ねておけばよかったです。",[[30,40]],"E"],["euro","You should have brought some one-euro coins for parking.","駐車用に、1ユーロ硬貨を何枚か持ってくるべきでした。",[[33,37]],"E"],["even","I wouldn't even try lifting that box alone.","私なら、一人でその箱を持ち上げようとはしません。",[[11,15]],"E"],["even if ...","I'd still go even if the weather were bad.","天気が悪くても、私ならやはり行きます。",[[13,17],[18,20]],"E"],["event","The event we've been planning will be held on Saturday.","ずっと準備してきたイベントは、土曜日に開催されます。",[[4,9]],"E"],["eventually","Having asked for directions, we eventually found our hotel.","道を尋ねて、私たちはようやくホテルを見つけました。",[[32,42]],"E"],["every other month [day, year, week]","I've been visiting my aunt every other week.","おばを、隔週で訪ねています。",[[27,32],[33,38],[39,43]],"E"],["exact","Would you please give me the exact address?","正確な住所を教えてもらえますか。",[[29,34]],"E"],["exactly","That's exactly what I was going to say.","まさに、それを言おうとしていたところです。",[[7,14]],"E"],["examination","I've been studying for the examination since last month.","先月から、ずっと試験勉強をしています。",[[27,38]],"E"],["examine","I'll have a doctor examine your ankle this afternoon.","今日の午後、医師にあなたの足首を診てもらいます。",[[19,26]],"E"],["excellent","It was your excellent advice that helped us most.","最も助けになったのは、あなたの素晴らしい助言でした。",[[12,21]],"E"],["except","Everyone except Ken had left before the rain started.","雨が降り始める前に、ケン以外は全員帰っていました。",[[9,15]],"E"],["exchange","You should exchange the shoes before wearing them outside.","外で履く前に、その靴を交換するとよいでしょう。",[[11,19]],"E"],["exchange A for B","I should have exchanged the shirt for a smaller one.","そのシャツを、もっと小さいものに交換するべきでした。",[[14,23],[34,37]],"E"],["excuse","You shouldn't use tiredness as an excuse for being rude.","疲れを、失礼な態度の言い訳にしてはいけません。",[[34,40]],"E"],["exercise","I try to get some exercise every day.","毎日、少しは運動するようにしています。",[[18,26]],"E"],["exhibit","We've been preparing a new exhibit since last month.","先月から、新しい展示の準備を続けています。",[[27,34]],"E"],["exhibition","Her exhibition had opened before we arrived in town.","私たちが町に着く前に、彼女の展覧会は始まっていました。",[[4,14]],"E"],["exist","I wish that little bookshop still existed today.","あの小さな本屋が、今もあればいいのに。",[[34,41]],"E"],["expand","They plan to expand the shop next year.","彼らは来年、店を拡張する予定です。",[[13,19]],"E"],["expect","I hadn't expected the room to be so large.","部屋がこんなに広いとは、思っていませんでした。",[[9,17]],"E"],["expensive","This option is less expensive than repairing the old one.","この方法は、古いものを修理するより費用がかかりません。",[[20,29]],"E"],["experience","It was that experience that inspired me to teach.","教える仕事に就きたいと思ったきっかけは、あの経験でした。",[[12,22]],"E"],["experiment","By lunchtime, we'll have finished the experiment.","昼食の時間までには、実験を終えているでしょう。",[[38,48]],"E"],["expert","You should ask an expert about that old painting.","その古い絵については、専門家に聞くとよいでしょう。",[[18,24]],"E"],["explain","Would you please explain how to get to the station?","駅までの行き方を説明してもらえますか。",[[17,24]],"E"],["explanation","Would you please give me a simpler explanation?","もっと分かりやすく説明してもらえますか。",[[35,46]],"E"],["explore","I'd explore the old town if we had more time.","もっと時間があれば、旧市街を見て回るのですが。",[[4,11]],"E"],["explorer","She's an explorer whose stories always fascinate the children.","彼女は、その話がいつも子どもたちを夢中にさせる探検家です。",[[9,17]],"E"],["express","I wish I could express my feelings more clearly.","自分の気持ちを、もっとはっきり表せたらいいのに。",[[15,22]],"E"],["expression","It was her expression that made me stop joking.","冗談をやめたのは、彼女の表情を見たからでした。",[[11,21]],"E"],["extra","We should have brought an extra chair.","椅子をもう一つ、持ってくるべきでした。",[[26,31]],"E"],["extremely","We'd left early, knowing the roads would be extremely busy.","道路が大変混むと分かっていたので、早く出ていました。",[[44,53]],"E"],["face","It was your face that I recognized in the photograph.","その写真で見覚えがあったのは、あなたの顔でした。",[[12,16]],"F"],["fact","The facts made us change our minds about the plan.","事実を知って、私たちはその計画への考えを変えました。",[[4,9]],"F"],["factor","Cost should be one factor in choosing your course.","講座を選ぶ際には、費用も判断材料にするべきです。",[[19,25]],"F"],["factory","This is the factory where my grandfather used to work.","ここが、祖父が以前働いていた工場です。",[[12,19]],"F"],["fail","If I'd practiced more, I wouldn't have failed the test.","もっと練習していたら、試験に落ちなかったのに。",[[39,45]],"F"],["failure","Don't let one failure stop you from trying again.","一度の失敗で、再び挑戦するのをやめないでください。",[[14,21]],"F"],["fair","It wouldn't be fair to make you pay for everything.","あなたに全部払ってもらうのは、不公平でしょう。",[[15,19]],"F"],["fairly","I'd expected the walk to be fairly short.","その散歩道は、かなり短いと思っていました。",[[28,34]],"F"],["faith","Her faith in me made me try again.","彼女が信じてくれたので、もう一度挑戦しました。",[[4,9]],"F"],["fall asleep","I've been trying to read, but I keep falling asleep.","本を読もうとしていますが、何度も眠ってしまいます。",[[37,44],[45,51]],"F"],["familiar","That voice sounds familiar, but I can't remember whose it is.","聞き覚えのある声ですが、誰の声か思い出せません。",[[18,26]],"F"],["fantastic","I wish you'd joined us on that fantastic trip.","あの素晴らしい旅行に、一緒に来てくれたらよかったのに。",[[31,40]],"F"],["far","The beach is twice as far away as the station.","浜辺は、駅の倍の距離にあります。",[[22,25]],"F"],["fare","The fare should have included your return journey.","その運賃には、帰りの分も含まれているはずでした。",[[4,8]],"F"],["fashion","She wants to work in the fashion industry.","彼女はファッション業界で働きたいと思っています。",[[25,32]],"F"],["fat","You should trim the fat before cooking the meat.","肉を調理する前に、脂身を切り落とすとよいでしょう。",[[20,23]],"F"],["fault","It was my fault that we had left too late.","出発が遅すぎたのは、私の責任でした。",[[10,15]],"F"],["favor","Would you please do me a small favor?","ちょっとお願いしてもよいですか。",[[31,36]],"F"],["fear","I couldn't help shaking with fear during the storm.","嵐の間、怖くて震えずにはいられませんでした。",[[29,33]],"F"],["feature","You should compare this feature with the cheaper model's.","この機能を、安い機種のものと比べるとよいでしょう。",[[24,31]],"F"],["fee","By Monday, we'll have paid the registration fee.","月曜日までには、登録料を払い終えているでしょう。",[[44,47]],"F"],["feed","I had fed the cat before leaving for work.","仕事に出かける前に、猫に餌をやっていました。",[[6,9]],"F"],["feel like doing","I've been working all day, so I feel like going out.","一日中働いていたので、出かけたい気分です。",[[32,36],[37,41],[42,47]],"F"],["female","A female passenger whose luggage was missing asked for help.","荷物が見つからない女性客が、助けを求めました。",[[2,8]],"F"],["fever","I've been feeling tired since my fever started.","熱が出始めてから、ずっとだるく感じています。",[[33,38]],"F"],["fight","I've never seen my parents fight about money.","両親がお金のことで言い争うのを、見たことがありません。",[[27,32]],"F"],["figure","I saw a figure move behind the curtain.","カーテンの後ろで、人影が動くのを見ました。",[[8,14]],"F"],["figure out ~","I wish I could figure out what you meant.","あなたの言ったことの意味が、分かったらいいのに。",[[15,21],[22,25]],"F"],["fill","Would you please fill this bottle with water?","このボトルに水を入れてもらえますか。",[[17,21]],"F"],["fill out [in] ~","You should have filled out the form before arriving.","到着する前に、用紙に記入しておくべきでした。",[[16,22],[23,26]],"F"],["fill up ~","Would you please fill up my water bottle?","私の水筒を、いっぱいにしてもらえますか。",[[17,21],[22,24]],"F"],["film","It was this film that made me interested in history.","歴史に興味を持ったきっかけは、この映画でした。",[[12,16]],"F"],["final","You should think carefully before making your final choice.","最終的に決める前に、よく考えるべきです。",[[46,51]],"F"],["finally","By Friday, I'll finally have finished that long report.","金曜日までには、ついにあの長い報告書を仕上げているでしょう。",[[16,23]],"F"],["find out ~","I asked around, only to find out nobody knew.","聞いて回りましたが、誰も知らないことが分かりました。",[[24,28],[29,32]],"F"],["fit","I'd buy this jacket if it fit me better.","もっと体に合えば、このジャケットを買うのですが。",[[26,29]],"F"],["fix","I'll have someone fix the lamp this afternoon.","今日の午後、誰かにランプを直してもらいます。",[[18,21]],"F"],["flash","You shouldn't use flash where the signs forbid it.","表示で禁止されている場所では、フラッシュを使ってはいけません。",[[18,23]],"F"],["flashlight","We should have brought a flashlight for this path.","この道を歩くなら、懐中電灯を持ってくるべきでした。",[[25,35]],"F"],["flat","I should have checked the tires before one went flat.","パンクする前に、タイヤを点検しておくべきでした。",[[48,52]],"F"],["flavor","Which ice cream flavor would you like?","アイスクリームは、どの味がよいですか。",[[16,22]],"F"],["flight","Our flight had already left when we reached the airport.","空港に着いたとき、私たちの便はもう出発していました。",[[4,10]],"F"],["float","The children watched their paper boats float downstream.","子どもたちは、紙の船が川下へ浮かんでいくのを見ました。",[[39,44]],"F"],["flow","I watched the river flow past the old bridge.","川の水が古い橋を通り過ぎるのを、見ていました。",[[20,24]],"F"],["fold","I found the towels folded neatly on my bed.","タオルが、ベッドの上にきちんと畳まれていました。",[[19,25]],"F"],["follow","You should have followed the instructions more carefully.","説明書には、もっと注意深く従うべきでした。",[[16,24]],"F"],["following","You should read the following instructions before starting.","始める前に、次の注意事項を読むべきです。",[[20,29]],"F"],["for a while","I've been thinking about changing jobs for a while.","しばらく前から、転職を考えています。",[[39,42],[43,44],[45,50]],"F"],["for free","I signed up, only to find it wasn't for free.","申し込みましたが、無料ではないことが分かりました。",[[36,39],[40,44]],"F"],["for fun","I've been learning to draw just for fun.","楽しみとして、絵の描き方を習っています。",[[32,35],[36,39]],"F"],["for instance","You should try something new, for instance learning guitar.","例えばギターなど、新しいことを始めるとよいでしょう。",[[30,33],[34,42]],"F"],["For one thing, ...","For one thing, we should consider the cost.","まず一つには、費用を考えるべきです。",[[0,3],[4,7],[8,13]],"F"],["for short","Elizabeth, whose friends call her Liz for short, teaches English.","英語教師のエリザベスは、友達から略してリズと呼ばれています。",[[38,41],[42,47]],"F"],["for sure","I should have checked so I'd know for sure.","確実に分かるよう、確認するべきでした。",[[34,37],[38,42]],"F"],["for the first time","Visiting Japan for the first time, I felt completely lost.","初めて日本を訪れたときは、全く勝手が分かりませんでした。",[[15,18],[19,22],[23,28],[29,33]],"F"],["forecast","You should have checked the forecast before setting off.","出発する前に、天気予報を確認するべきでした。",[[28,36]],"F"],["foreign","I've been making friends with students from foreign countries.","外国から来た学生たちと、友達になってきています。",[[44,51]],"F"],["forever","I wish we could stay here forever.","ずっと、ここにいられたらいいのに。",[[26,33]],"F"],["forget","I'd forgotten where I'd put the tickets.","チケットをどこに置いたのか、忘れていました。",[[4,13]],"F"],["forgive","You should forgive yourself for making one small mistake.","小さな間違い一つで、自分を責めすぎないほうがよいですよ。",[[11,18]],"F"],["form","By tomorrow, I'll have completed every section of the form.","明日までには、用紙の全項目に記入し終えているでしょう。",[[54,58]],"F"],["formal","I'd wear something less formal than that suit.","私なら、そのスーツほど改まっていないものを着ます。",[[24,30]],"F"],["fortunately","Fortunately, we had left before the storm arrived.","幸い、嵐が来る前に出発していました。",[[0,11]],"F"],["fossil","Walking along the beach, the children found a fossil.","浜辺を歩いていて、子どもたちは化石を見つけました。",[[46,52]],"F"],["frame","The frame is made of wood from our garden.","その額縁は、うちの庭の木で作られています。",[[4,9]],"F"],["frankly","Frankly, I wouldn't pay that much for a meal.","率直に言って、私なら食事にそんなに払いません。",[[0,7]],"F"],["freedom","I'd like a job that gives me more freedom.","もっと自由のある仕事に就きたいです。",[[34,41]],"F"],["freeze","Don't let the water pipes freeze this winter.","この冬は、水道管を凍らせないようにしてください。",[[26,32]],"F"],["fresh","The room was filled with the smell of fresh bread.","部屋には、焼きたてのパンの匂いが満ちていました。",[[38,43]],"F"],["friendly","She introduced me to her cousin, whose smile was friendly.","彼女が紹介してくれたいとこは、親しみやすい笑顔の人でした。",[[49,57]],"F"],["frightened","She was frightened at the thought of speaking in public.","人前で話すことを考えて、彼女はおびえていました。",[[8,18]],"F"],["frightening","Driving through that storm must have been frightening.","あの嵐の中での運転は、怖かったことでしょう。",[[42,53]],"F"],["from now on","You should check your work more carefully from now on.","これからは、作業をもっと注意深く確認するべきです。",[[42,46],[47,50],[51,53]],"F"],["from time to time","We would visit that little cafe from time to time.","私たちは、ときどきあの小さなカフェを訪ねたものでした。",[[32,36],[37,41],[42,44],[45,49]],"F"],["front","I saw a taxi stop outside the front door.","玄関の外に、タクシーが止まるのを見ました。",[[30,35]],"F"],["fuel","We need to stop and get some fuel.","車を止めて、燃料を補給する必要があります。",[[29,33]],"F"],["fulfill","I hope to fulfill my dream of opening a cafe.","カフェを開くという夢を、かなえたいと思っています。",[[10,17]],"F"],["full-time","I've been looking for a full-time job since March.","3月から、常勤の仕事を探しています。",[[24,33]],"F"],["furniture","We're pleased with the furniture we bought for the kitchen.","台所用に買った家具に、満足しています。",[[23,32]],"F"],["further","You should ask whoever answers for further information.","電話に出た人に、詳しい情報を尋ねるとよいでしょう。",[[35,42]],"F"],["future","I've been thinking about what I'd like to do in the future.","将来何をしたいか、ずっと考えています。",[[52,58]],"F"],["gain","Working with her would help you gain valuable experience.","彼女と働けば、貴重な経験を積めるでしょう。",[[32,36]],"G"],["gallery","Do you remember the gallery where we first met?","私たちが初めて会った画廊を、覚えていますか。",[[20,27]],"G"],["garbage","I've taken out the garbage, so you don't need to.","ごみは出しておいたので、あなたは出さなくて大丈夫です。",[[19,26]],"G"],["gather","We watched the children gather outside the main entrance.","子どもたちが正面入口の外に集まるのを、見ていました。",[[24,30]],"G"],["general","I'd like some general information about the course.","その講座の概要を教えていただきたいです。",[[14,21]],"G"],["generally","I'd generally choose a quieter restaurant for a meeting.","打ち合わせなら、私なら普通もっと静かな店を選びます。",[[4,13]],"G"],["generation","My grandparents' generation would often walk miles to school.","祖父母の世代は、学校まで何マイルも歩いたものでした。",[[17,27]],"G"],["gentle","You should be gentle when you hold the kitten.","子猫を抱くときは、優しく扱ってください。",[[14,20]],"G"],["get A back from B","You should have got your book back from Ken.","ケンから、本を返してもらうべきでした。",[[16,19],[30,34],[35,39]],"G"],["get A to do","Would you please get him to call me tonight?","今夜私に電話するよう、彼に頼んでもらえますか。",[[17,20],[25,27]],"G"],["get along [on] with ~","I'd get along with him if he listened more.","彼がもっと話を聞けば、うまくやっていけるのですが。",[[4,7],[8,13],[14,18]],"G"],["get away","I'd love to get away for the weekend.","週末には、どこかへ出かけてのんびりしたいです。",[[12,15],[16,20]],"G"],["get better","Your ankle should have got better by now.","足首は、もう良くなっているはずです。",[[23,26],[27,33]],"G"],["get married","They're planning to get married next spring.","二人は、来春結婚する予定です。",[[20,23],[24,31]],"G"],["get out of ~","I heard someone get out of the car outside.","外で、誰かが車から降りる音が聞こえました。",[[16,19],[20,23],[24,26]],"G"],["get over ~","It took longer than I'd expected to get over the cold.","その風邪が治るのは、思っていたより長くかかりました。",[[36,39],[40,44]],"G"],["get rid of ~","We need to get rid of these old boxes.","この古い箱は、処分する必要があります。",[[11,14],[15,18],[19,21]],"G"],["get together","We should get together before you leave.","あなたが出発する前に、集まるとよいでしょう。",[[10,13],[14,22]],"G"],["gift","If I'd known, I would have brought you a gift.","知っていたら、贈り物を持ってきたのに。",[[41,45]],"G"],["Give [Lend] me a hand.","Would you please give me a hand with these bags?","このかばんを運ぶのを、手伝ってもらえますか。",[[17,21],[22,24],[25,26],[27,31]],"G"],["give A a ride","I'd give you a ride if my car weren't being repaired.","車が修理中でなければ、乗せてあげるのですが。",[[4,8],[13,14],[15,19]],"G"],["give up ~","You shouldn't give up before trying what she suggested.","彼女の提案を試す前に、諦めるべきではありません。",[[14,18],[19,21]],"G"],["global","We've been discussing global problems in class this month.","今月は授業で、地球規模の問題を話し合っています。",[[22,28]],"G"],["go against ~","I don't want to go against my parents' wishes.","両親の希望に背くことは、したくありません。",[[16,18],[19,26]],"G"],["go ahead","We decided to go ahead with the trip.","私たちは、旅行を決行することにしました。",[[14,16],[17,22]],"G"],["Go ahead.","Go ahead and take whatever you need.","どうぞ、必要なものは何でも持っていってください。",[[0,2],[3,8]],"G"],["go through ~","We should have gone through the instructions together.","一緒に、説明書を確認するべきでした。",[[15,19],[20,27]],"G"],["go wrong","Something must have gone wrong during the journey.","移動中に、何か問題が起きたのでしょう。",[[20,24],[25,30]],"G"],["goal","By December, I'll have reached my savings goal.","12月までには、貯金の目標を達成しているでしょう。",[[42,46]],"G"],["(That's a) good idea.","That's a good idea that would save us time.","それは、時間の節約になるよい案ですね。",[[9,13],[14,18]],"G"],["Good luck!","Good luck with whatever you decide to do next!","次に何をするにしても、うまくいくことを願っています。",[[0,4],[5,9]],"G"],["government","The government has announced a plan to repair this road.","政府は、この道路を修理する計画を発表しました。",[[4,14]],"G"],["grade","By June, I'll have finished sixth grade.","6月までには、6年生を終えているでしょう。",[[34,39]],"G"],["gradually","I've been gradually getting used to the new schedule.","新しい予定に、少しずつ慣れてきています。",[[10,19]],"G"],["graduate","My sister had graduated before we moved to this town.","この町に引っ越す前に、姉は卒業していました。",[[14,23]],"G"],["graduate from ~","She had graduated from college before moving here.","ここに移る前に、彼女は大学を卒業していました。",[[8,17],[18,22]],"G"],["graduation","What are you planning to do after graduation?","卒業後は、何をする予定ですか。",[[34,44]],"G"],["grandparent","My grandparents would bake bread every Sunday.","祖父母は、毎週日曜日にパンを焼いたものでした。",[[3,15]],"G"],["greatly","I was greatly encouraged by what you told me.","あなたの言葉に、とても励まされました。",[[6,13]],"G"],["grocery","Do you remember the grocery store where we met?","私たちが会った食料品店を、覚えていますか。",[[20,27]],"G"],["ground","The ground was covered with snow when we woke up.","目が覚めると、地面は雪で覆われていました。",[[4,10]],"G"],["grow","I've been growing tomatoes on my balcony this summer.","この夏は、ベランダでずっとトマトを育てています。",[[10,17]],"G"],["grow up","That's the village where my mother grew up.","あれが、母の育った村です。",[[35,39],[40,42]],"G"],["guard","The guard let us enter after checking our tickets.","警備員は券を確認してから、私たちを中に入れてくれました。",[[4,9]],"G"],["guess","I'd never have guessed that this painting was yours.","この絵があなたのものとは、とても思い付かなかったでしょう。",[[15,22]],"G"],["Guess what!","Guess what! I've been learning to play the guitar!","聞いてください。ギターを習っているんです。",[[0,5],[6,10]],"G"],["guest","Our guest was surprised at how early we eat.","お客さんは、私たちの食事の早さに驚いていました。",[[4,9]],"G"],["guide","We were pleased with the guide's helpful advice.","案内人の役立つ助言に、私たちは満足しました。",[[25,32]],"G"],["habit","Reading before bed had become a habit by then.","その頃には、寝る前の ただいま。買ってきたものを、ぜひ見てください。",[[0,3],[4,8]],"I"],["I'm just looking.","I'm just looking, but I'd love to try this on.","見ているだけですが、これを試着してみたいです。",[[0,3],[4,8],[9,16]],"I"],["I'm not sure.","I'm not sure if we should book now.","今予約するべきか、よく分かりません。",[[0,3],[4,7],[8,12]],"I"],["I'm sorry to hear that.","I'm sorry to hear that you couldn't do what you wanted.","やりたかったことができなかったそうで、残念ですね。",[[0,3],[4,9],[10,12],[13,17],[18,22]],"I"],["I'm wondering if ...","I'm wondering if you'd like to join us tomorrow.","明日、ご一緒できればと思っているのですが。",[[0,3],[4,13],[14,16]],"I"],["idea","You should share whatever idea comes to mind.","思い付いた考えは、何でも話してみるとよいでしょう。",[[26,30]],"I"],["ideal","This room would be ideal for our meeting.","この部屋は、私たちの会議にぴったりでしょうね。",[[19,24]],"I"],["If only ...","If only I had more time to practice.","もっと練習する時間があればいいのに。",[[0,2],[3,7]],"I"],["if you like","You can choose whichever seat you prefer, if you like.","よろしければ、お好きな席をどれでも選べます。",[[42,44],[45,48],[49,53]],"I"],["ill","He may have been ill when you visited.","あなたが訪ねたとき、彼は病気だったのかもしれません。",[[17,20]],"I"],["image","I found the image displayed on every screen.","どの画面にも、その画像が表示されていました。",[[12,17]],"I"],["imagination","Her imagination makes ordinary stories come alive.","彼女の想像力は、ありふれた話を生き生きとさせます。",[[4,15]],"I"],["imagine","Can you imagine what life would be like without music?","音楽のない生活がどんなものか、想像できますか。",[[8,15]],"I"],["immediately","You should have told me immediately about the change.","変更について、すぐに教えてくれるべきでした。",[[24,35]],"I"],["import","The coffee is made from beans we import ourselves.","そのコーヒーは、自分たちで輸入した豆で入れています。",[[33,39]],"I"],["importance","It was that mistake that taught me the importance of checking.","確認の大切さを教えてくれたのは、あの間違いでした。",[[39,49]],"I"],["impress","I was impressed with the way you handled everything.","あなたの見事な対応に、感心しました。",[[6,15]],"I"],["improve","I've been practicing daily, hoping to improve my pronunciation.","発音を良くしたくて、毎日練習し続けています。",[[38,45]],"I"],["in [at] the beginning of ~","I saw her appear at the beginning of th vents have made me think differently about work.","最近の出来事で、仕事についての考え方が変わりました。",[[0,6]],"R"],["recently","I've been speaking to my sister more often recently.","最近は、姉と以前よりよく話しています。",[[43,51]],"R"],["recipe","It's the recipe my grandmother would use every Sunday.","それは、祖母が毎週日曜日に使っていたレシピです。",[[9,15]],"R"],["recognize","If you'd waved, I would have recognized you.","手を振ってくれていたら、あなただと分かったのに。",[[29,39]],"R"],["recommend","Would you please recommend a quiet place for lunch?","静かに昼食を取れる場所を、おすすめしてもらえますか。",[[17,26]],"R"],["recover","By next month, he'll have recovered enough to travel.","来月までには、旅行できるほど回復しているでしょう。",[[26,35]],"R"],["recovery","The doctor was pleased with how quickly your recovery progressed.","医師は、あなたの回復の早さを喜んでいました。",[[45,53]],"R"],["recycle","Would you please show me which things can be recycled here?","ここでは何をリサイクルできるか、教えてもらえますか。",[[45,53]],"R"],["reduce","We're trying to reduce the amount of waste.","私たちは、ごみの量を減らそうとしています。",[[16,22]],"R"],["refer","You should refer to whichever map is most recent.","一番新しい地図を、参照するとよいでしょう。",[[11,16]],"R"],["reflect","I watched the water reflect the changing colors of sunset.","水が夕焼けの変わる色を映すのを、見ていました。",[[20,27]],"R"],["refresh","A short walk always makes me feel refreshed.","少し歩くと、いつも気分がすっきりします。",[[34,43]],"R"],["regard A as B","I'd regard that as a reason to try again.","私なら、それを再挑戦する理由と考えます。",[[4,10],[16,18]],"R"],["regardless of ~","You should welcome everyone, regardless of where they come from.","どこの出身でも、誰でも歓迎するべきです。",[[29,39],[40,42]],"R"],["regret","I regret not spending more time with her.","彼女ともっと時間を過ごさなかったことを、後悔しています。",[[2,8]],"R"],["regular","Our regular driver should have arrived by now.","いつもの運転手は、もう着いているはずです。",[[4,11]],"R"],["regularly","I've been walking regularly since I moved here.","ここに引っ越してから、定期的に歩いています。",[[18,27]],"R"],["reject","They might have rejected the application because it arrived late.","届くのが遅くて、申し込みを断られたのかもしれません。",[[16,24]],"R"],["relation","We should consider the relation between these two events.","この二つの出来事の関係を、考えるべきです。",[[23,31]],"R"],["relative","I stayed with a relative whose house overlooks the sea.","海を見渡せる家に住む親戚の所に、泊まりました。",[[16,24]],"R"],["relax","I've been looking for somewhere quiet to relax after work.","仕事の後でくつろげる静かな所を、ずっと探しています。",[[41,46]],"R"],["release","By next month, the band will have released another album.","来月までには、そのバンドはもう1枚アルバムを出しているでしょう。",[[34,42]],"R"],["rely","I'd rely on her if I needed help.","助けが必要なら、私なら彼女を頼ります。",[[4,8]],"R"],["rely on ~","I'd rely on him if I needed help.","助けが必要なら、私なら彼を頼ります。",[[4,8],[9,11]],"R"],["remain","The driver made us remain seated until the bus stopped.","運転手は、バスが止まるまで私たちを座らせていました。",[[19,25]],"R"],["remember","I wish I could remember what you told me.","教えてくれたことを、思い出せたらいいのに。",[[15,23]],"R"],["remind","Would you please remind me to call her tonight?","今夜彼女に電話するよう、声をかけてもらえますか。",[[17,23]],"R"],["remind A of B","These photos remind me of our trip together.","この写真を見ると、一緒に行った旅行を思い出します。",[[13,19],[23,25]],"R"],["remove","Please remove whatever you don't need from the table.","不要なものは、何でもテーブルからどけてください。",[[7,13]],"R"],["rent","We've been hoping to rent a house near here.","この近くに家を借りたいと、ずっと思っています。",[[21,25]],"R"],["repair","I'll have my bike repaired before the trip.","旅行の前に、自転車を修理してもらいます。",[[18,26]],"R"],["repeat","Would you please repeat what you said about the meeting?","会議について言ったことを、もう一度言ってもらえますか。",[[17,23]],"R"],["replace","We need to replace the batteries in this clock.","この時計の電池を、取り替える必要があります。",[[11,18]],"R"],["reply","Would you please reply to her email this afternoon?","今日の午後、彼女のメールに返事をしてもらえますか。",[[17,22]],"R"],["report","I've finished the report you've been waiting for.","お待ちいただいていた報告書が、できました。",[[18,24]],"R"],["request","I'd like to request a room with a view.","眺めの良い部屋を、お願いしたいのですが。",[[12,19]],"R"],["require","The job would require working on weekends.","その仕事では、週末に働くことが必要になるでしょう。",[[14,21]],"R"],["rescue","The firefighters managed to rescue everyone from the building.","消防士たちは、建物から全員を救出することができました。",[[28,34]] r number.","番号を知っていれば、すぐに彼女に電話するのですが。",[[13,18],[19,23]],"R"],["ring","I love your ring because it's such a lovely color.","とてもきれいな色で、その指輪がすてきですね。",[[12,16]],"R"],["rise","We've been watching the river rise since this morning.","今朝から、川の水位が上がるのを見ています。",[[30,34]],"R"],["rock","Sitting on the rock, we watched the sun go down.","岩に座って、日が沈むのを見ていました。",[[15,19]],"R"],["role","You should choose whichever role suits your experience.","経験に合う役割なら、どれを選んでもよいでしょう。",[[28,32]],"R"],["root","It was poor communication that lay at the root of everything.","すべての根本にあったのは、意思疎通の不足でした。",[[42,46]],"R"],["rough","The flight must have been rough in that storm.","あの嵐では、飛行機がずいぶん揺れたのでしょう。",[[26,31]],"R"],["round","I'd prefer a round table if we had enough space.","十分な広さがあれば、丸いテーブルのほうがよいです。",[[13,18]],"R"],["route","Which route would you recommend for walking to school?","学校まで歩くには、どの経路がおすすめですか。",[[6,11]],"R"],["row","It was in the front row that I saw her.","彼女を見かけたのは、最前列でした。",[[20,23]],"R"],["rude","I didn't mean to be rude to you.","あなたに失礼な態度を取るつもりはありませんでした。",[[20,24]],"R"],["rug","This rug would look lovely in our living room.","この敷物は、うちの居間に置くと素敵でしょうね。",[[5,8]],"R"],["rule","You should have explained the rule before we started.","始める前に、そのルールを説明するべきでした。",[[30,34]],"R"],["rumor","The rumor had spread before anyone checked the facts.","事実を確認する前に、うわさは広がっていました。",[[4,9]],"R"],["run","I saw the children run towards the bus stop.","子どもたちがバス停へ走るのを、見ました。",[[19,22]],"R"],["run after ~","I saw your dog run after the little boy.","あなたの犬が、男の子を追いかけて走るのを見ました。",[[15,18],[19,24]],"R"],["run out of ~","We must have run out of milk yesterday.","昨日、牛乳が切れてしまったのでしょう。",[[13,16],[17,20],[21,23]],"R"],["run over ~","I could have run over that cat in the dark.","暗い中で、あの猫を車でひいていたかもしれません。",[[13,16],[17,21]],"R"],["safe","I wish the children had somewhere safe to play.","子どもたちに、安全に遊べる場所があればいいのに。",[[34,38]],"S"],["safety","You should take safety seriously, whatever the activity.","どんな活動でも、安全を真剣に考えるべきです。",[[16,22]],"S"],["sa r.","全くそのとおりです。もっと早く出発すべきでしたね。",[[0,3],[4,7],[8,11],[12,16],[17,22]],"Y"],["You can't miss it.","You can't miss it, whatever route you take.","どの道から行っても、すぐに分かりますよ。",[[0,3],[4,9],[10,14],[15,17]],"Y"],["You have the wrong number.","You have the wrong number, so you should try reception.","電話番号をお間違えなので、受付にかけてみてください。",[[0,3],[4,8],[9,12],[13,18],[19,25]],"Y"],["You mean ...?","You mean they'd already left before you called?","電話をかける前に、もう出発していたということですか。",[[0,3],[4,8]],"Y"],["You'll find it on your right [left].","You'll find it on your right, and it should be open.","右側にあります。開いているはずですよ。",[[0,6],[7,11],[12,14],[15,17],[18,22],[23,28]],"Y"]],"2":[["A as well as B","By Friday, I'll have invited Ken as well as Sue.","金曜日までには、スーだけでなくケンも招待しているでしょう。",[[33,35],[36,40],[41,43]],"A"],["a man [person] of one's word","He said he'd pay, and he's a man of his word.","彼は払うと言いましたし、約束を守る人です。",[[27,28],[29,32],[33,35],[36,39],[40,44]],"A"],["a piece of cake","Had we practiced, the test would've been a piece of cake.","練習していたら、その試験は朝飯前だったでしょう。",[[41,42],[43,48],[49,51],[52,56]],"A"],["A rather than B","I'd choose the train rather than drive in this weather.","この天気なら、運転するより電車を選びます。",[[21,27],[28,32]],"A"],["a wide range of ~","A wide range of activities is being planned for families.","家族向けに、幅広い催しを計画しています。",[[0,1],[2,6],[7,12],[13,15]],"A"],["abandon","The old hospital has been abandoned for years.","その古い病院は、何年も使われずに放置されています。",[[26,35]],"A"],["above all","Above all, remember to enjoy your time here.","何よりも、ここでの時間を楽しむことを忘れないでください。",[[0,5],[6,9]],"A"],["absorb","I sat quietly, absorbed in what she was saying.","彼女の話に聞き入り、静かに座っていました。",[[15,23]],"A"],["absurd","Not all his suggestions are as absurd as that.","彼の提案がすべて、そんなにばかげているわけではありません。",[[31,37]],"A"],["abuse","Several workers complained of having been abused at work.","何人かの労働者が、職場で虐待されたと訴えました。",[[42,48]],"A"],["academic","Her academic work is being discussed at the conference.","彼女の学術研究について、会議で討議されています。",[[4,12]],"A"],["accent","Had I recognized his accent, I'd have spoken more slowly.","彼のなまりに気付いていたら、もっとゆっくり話したのに。",[[21,27]],"A"],["accept","If I'd known, I would have accepted the invitation.","知っていたら、その招待を受けていたのに。",[[27,35]],"A"],["accidentally","I might have accidentally deleted the message you sent.","送ってくれたメッセージを、うっかり削除したかもしれません。",[[13,25]],"A"],["accommodation","Our accommodation, which overlooks the bay, has been renovated.","湾を見渡す私たちの宿泊施設は、改装されました。",[[4,17]],"A"],["accompany","She resented being accompanied everywhere by a security guard.","彼女は、どこへ行くにも警備員が付き添うことを嫌がりました。",[[19,30]],"A"],["accomplish","We seem to have accomplished more than we'd expected.","予想していた以上のことを、成し遂げたようです。",[[16,28]],"A"],["according to ~","According to the map, we should be near the station.","地図によれば、私たちは駅の近くにいるはずです。",[[0,9],[10,12]],"A"],["accordingly","We had been warned, so we adjusted our plans accordingly.","警告を受けていたので、それに応じて計画を調整しました。",[[45,56]],"A"],["account","We closed the account, which had been inactive for years.","何年も使っていなかった、その口座を解約しました。",[[14,21]],"A"],["account for ~","These delays should have been accounted for in our schedule.","こうした遅れは、日程に織り込んでおくべきでした。",[[30,39],[40,43]],"A"],["accuracy","Not every task requires this level of accuracy.","すべての作業に、この水準の正確さが必要なわけではありません。",[[38,46]],"A"],["accurate","The measurements are being checked to ensure they're accurate.","正確かどうか確認するため、測定値を点検しています。",[[53,61]],"A"],["accuse","He denied having accused anyone of stealing the money.","彼は、そのお金を盗んだと誰かを責めたことを否定しました。",[[17,24]],"A"],["accuse A of B","She resented being accused of not doing her share.","自分の分担をしていないと責められて、彼女は不満でした。",[[19,26],[27,29]],"A"],["achieve","What do you hope to achieve this year?","今年は何を達成したいですか。",[[20,27]],"A"],["acquaintance","I made her acquaintance while working at the library.","図書館で働いていたときに、彼女と知り合いました。",[[11,23]],"A"],["acquire","She appears to have acquired a taste for jazz.","彼女は、ジャズを好むようになったようです。",[[20,28]],"A"],["activity","What's an activity you've always wanted to try?","ずっとやってみたかった活動は何ですか。",[[10,18]],"A"],["actually","Actually, we had already met before the wedding.","実は私たちは、その結婚式の前に会っていました。",[[0,8]],"A"],["adapt","Adapting to a new school isn't always easy.","新しい学校に慣れるのは、いつも簡単とは限りません。",[[0,8]],"A"],["add","By lunchtime, I'll have added everyone's name to the list.","昼までには、全員の名前を名簿に加えておきます。",[[24,29]],"A"],["add up to ~","These small savings will have added up to hundreds by December.","12月までには、この小さな節約も何百ドルかになるでしょう。",[[30,35],[36,38],[39,41]],"A"],["addition","The new addition, which faces south, needs larger windows.","南向きの新しい増築部分には、もっと大きな窓が必要です。",[[8,16]],"A"],["adequate","Without adequate sleep, I'd struggle to concentrate at work.","十分に眠れなければ、仕事に集中するのは難しいでしょう。",[[8,16]],"A"],["adjust","I stood with my eyes adjusting to the darkness.","目が暗さに慣れるまで、その場に立っていました。",[[21,30]],"A"],["admire","Rarely have I met someone I admire so much.","これほど尊敬できる人には、めったに会ったことがありません。",[[28,34]],"A"],["admit","He admitted taking the money from my bag.","彼は、私のかばんからお金を取ったことを認めました。",[[3,11]],"A"],["adopt","Our proposal has been adopted after months of discussion.","何か月も話し合った末に、私たちの提案が採用されました。",[[22,29]],"A"],["adore","She adored being surrounded by her grandchildren on Sundays.","彼女は、日曜日に孫たちに囲まれるのが大好きでした。",[[4,10]],"A"],["advance","The new treatment has been hailed as a major advance.","その新しい治療法は、大きな進歩として高く評価されています。",[[45,52]],"A"],["advantage","Living nearby would give you an advantage over other applicants.","近くに住んでいれば、ほかの応募者より有利になるでしょう。",[[32,41]],"A"],["advertise","Where should we advertise our new cooking classes?","新しい料理教室はどこで宣伝すればよいでしょうか。",[[16,25]],"A"],["advertisement","It was your advertisement that brought me to this shop.","この店に来るきっかけは、そちらの広告でした。",[[12,25]],"A"],["affair","The affair, which made headlines, had been kept secret.","大きく報道されたその事件は、秘密にされていました。",[[4,10]],"A"],["affect","Not everyone is affected by the heat equally.","誰もが同じように、暑さの影響を受けるわけではありません。",[[16,24]],"A"],["affectionate","He sat with his affectionate dog resting beside him.","彼は、人懐っこい犬を傍らで休ませ e","She seems to have amazed everyone with her performance.","彼女は、その演技でみんなを驚かせたようです。",[[18,24]],"A"],["ambitious","Not all ambitious plans turn out as expected.","意欲的な計画がすべて、期待どおりになるとは限りません。",[[8,17]],"A"],["amount","This recipe uses twice the amount of sugar I expected.","このレシピでは、予想した2倍の量の砂糖を使います。",[[27,33]],"A"],["amount to ~","The charges appear to have amounted to more than expected.","料金の合計は、予想以上になったようです。",[[27,35],[36,38]],"A"],["analyze","The samples are being analyzed in the laboratory.","その試料は、研究室で分析されています。",[[22,30]],"A"],["ancestor","I found the village where my ancestor had lived.","先祖が暮らしていた村を、見つけました。",[[29,37]],"A"],["ancient","I'd love to visit the ancient city someday.","いつかその古代都市を訪ねてみたいです。",[[22,29]],"A"],["and so forth [on]","We should have packed plates, cups, napkins, and so forth.","皿やカップ、ナプキンなどを、詰めておくべきでした。",[[45,48],[49,51],[52,57]],"A"],["angle","He waited with the camera held at an awkward angle.","彼は、カメラを不自然な角度に構えて待っていました。",[[45,50]],"A"],["animation","The animation, which took years to finish, looks wonderful.","完成まで何年もかかったそのアニメーションは、見事な出来です。",[[4,13]],"A"],["announce","They should have announced the cancellation much earlier.","中止の発表は、もっと早くするべきでした。",[[17,26]],"A"],["annoy","Having been interrupted repeatedly, she was beginning to feel annoyed.","何度も話を遮られて、彼女はいら立ち始めていました。",[[62,69]],"A"],["annual","Our annual picnic has been called off because of rain.","毎年恒例のピクニックは、雨のため中止になりました。",[[4,10]],"A"],["anticipate","We hadn't anticipated having to wait outside all afternoon.","午後ずっと外で待つことになるとは、予想していませんでした。",[[10,21]],"A"],["anxiety","Without your support, my anxiety would have been overwhelming.","あなたの支えがなければ、不安に押しつぶされていたでしょう。",[[25,32]],"A"],["anxious","She'd been feeling anxious before the results finally arrived.","結果がようやく届くまで、彼女は不安を感じ続けていました。",[[19,26]],"A"],["anything but ~","Having missed two trains, we felt anything but relaxed.","電車を2本逃して、私たちは全く落ち着けませんでした。",[[34,42],[43,46]],"A"],["apologize","I want to apologize for being late today.","今日は遅刻したことをおわびしたいです。",[[10,19]],"A"],["apparent","The damage wasn't apparent until the furniture had been moved.","家具を動かして初めて、その傷みに気付きました。",[[18,26]],"A"],["appeal","The charity's appeal seems to have reached thousands of people.","慈善団体の呼びかけは、何千人もの人に届いたようです。",[[14,20]],"A"],["appear","I saw a strange message appear on the screen.","画面に、見慣れないメッセージが出るのを見ました。",[[24,30]],"A"],["appetite","Having walked all morning, we'd worked up quite an appetite.","午前中ずっと歩いて、すっかりおなかがすいていました。",[[51,59]],"A"],["applause","Never had I heard such enthusiastic applause before.","それまで、あれほど熱烈な拍手を聞いたことはありませんでした。",[[36,44]],"A"],["apply","You should apply before the end of this month.","今月末までに、応募するとよいでしょう。",[[11,16]],"A"],["apply for ~","You should have applied for the job sooner.","その仕事には、もっと早く応募するべきでした。",[[16,23],[24,27]],"A"],["appointment","I'd like to make an appointment for Friday.","金曜日の予約を取りたいのですが。",[[20,31]],"A"],["appreciate","I'd appreciate having a little more time to decide.","決める時間をもう少しいただけると、ありがたいです。",[[4,14]],"A"],["approach","We should consider a less expensive approach to the problem.","その問題には、費用の少ない方法を検討すべきです。",[[36,44]],"A"],["appropriate","It was suggested that more appropriate clothing should be worn.","もっとふさわしい服装をすべきだと、提案されました。",[[27,38]],"A"],["approve","The new budget has been approved by the committee.","新しい予算は、委員会の承認を得ました。",[[24,32]],"A"],["architect","The architect, whose office is nearby, designed our house.","近所に事務所を構えるその建築家が、私たちの家を設計しました。",[[4,13]],"A"],["argue","I heard my neighbors argue about their parking space.","近所の人たちが、駐車場所について言い争うのを聞きました。",[[21,26]],"A"],["arise","Should any problems arise, please contact me directly.","何か問題が生じたら、直接私に連絡してください。",[[20,25]],"A"],["army","He had served in the army before becoming a teacher.","彼は教師になる前に、陸軍で勤務していました。",[[21,25]],"A"],["around the corner","The cafe around the corner is being renovated.","角を曲がった所にあるカフェは、改装中です。",[[9,15],[16,19],[20,26]],"A"],["arrange","I'll have my assistant arrange a taxi for you.","助手に頼んで、タクシーを手配します。",[[23,30]],"A"],["arrest","I saw the police arrest someone outside the station.","駅の外で、警察が誰かを逮捕するのを見ました。",[[17,23]],"A"],["article","I've been writing an article about our local school.","地元の学校についての記事を、ずっと書いています。",[[21,28]],"A"],["artificial","Not all artificial sweeteners taste the same to me.","私には、人工甘味料がすべて同じ味に感じられるわけではありません。",[[8,18]],"A"],["as [so] long as ...","I'd lend you my bike as long as you're careful.","気を付けてくれるなら、自転車を貸してもよいですよ。",[[21,23],[24,28],[29,31]],"A"],["as a matter of fact","As a matter of fact, I've been thinking about moving.","実は、引っ越そうかとずっと考えています。",[[0,2],[3,4],[5,11],[12,14],[15,19]],"A"],["as a result","The road had been blocked; as a result, we turned back.","道路がふさがれていたので、その結果引き返しました。",[[27,29],[30,31],[32,38]],"A"],["as a (general) rule","As a general rule, you should keep a copy.","原則として、控えを取っておくべきです。",[[0,2],[3,4],[13,17]],"A"],["as far as ...","As far as I remember, nobody had been informed.","私が覚えている限り、誰も知らされていませんでした。",[[0,2],[3,6],[7,9]],"A"],["as far as I know","As far as I know, she had already left.","私の知る限り、彼女はもう出発していました。",[[0,2],[3,6],[7,9],[10,11],[12,16]],"A"],["as follows","Our instructions were as follows: nobody should leave the room.","指示は次のとおりでした。誰も部屋を出てはいけません。",[[22,24],[25,32]],"A"],["as for me","As for me, I'd rather walk than wait here.","私なら、ここで待つより歩きたいです。",[[0,2],[3,6],[7,9]],"A"],["as for ~","As for the tickets, they should have arrived yesterday.","チケットについては、昨日届いているはずでした。",[[0,2],[3,6]],"A"],["as if [though] ...","He talks as if he were the manager.","彼は、まるで自分が責任者であるかのように話します。",[[9,11],[12,14]],"A"],["as is often the case with ~","As is often the case with him, he'd forgotten.","彼にはよくあることですが、忘れてしまっていました。",[[0,2],[3,5],[6,11],[12,15],[16,20],[21,25]],"A"],["as time goes by","As time goes by, you should find it easier.","時がたつにつれ、もっと楽に感じられるはずです。",[[0,2],[3,7],[8,12],[13,15]],"A"],["as to ~","I'm uncertain as to what we should do next.","次に何をすべきか、はっきり分かりません。",[[14,16],[17,19]],"A"],["aspect","This aspect of the plan is being reconsidered.","計画のこの点については、再検討が進んでいます。",[[5,11]],"A"],["assert","She asserted that she had never seen the document.","彼女は、その書類を一度も見たことがないと言い切りました。",[[4,12]],"A"],["assign","I've been assigned to a team whose members work remotely.","私は、在宅勤務の人たちで構成されるチームに配属されました。",[[10,18]],"A"],["assist","Had you asked, I would gladly have assisted you.","頼んでくれていたら、喜んで手伝ったのに。",[[35,43]],"A"],["associate","I dislike being associated with people who cheat others.","人をだます人たちと同類に見られるのは、嫌です。",[[16,26]],"A"],["assume","I had assumed that the tickets had already been booked.","チケットはすでに予約済みだと、思い込んでいました。",[[6,13]],"A"],["at a distance","We watched the horses gallop at a distance.","離れた所で馬が駆けるのを、見ていました。",[[29,31],[32,33],[34,42]],"A"],["at a time","You should carry only one box at a time.","箱は、一度に一つだけ運んだほうがいいです。",[[30,32],[33,34],[35,39]],"A"],["at any (all) cost","We should protect these records at any cost.","何としても、この記録を守るべきです。",[[32,34],[35,38],[39,43]],"A"],["at any rate","At any rate, we should have asked before leaving.","いずれにしても、出発前に尋ねておくべきでした。",[[0,2],[3,6],[7,11]],"A"],["(close [near]) at hand","With help close at hand, we felt less anxious.","すぐ近くに助けがあるので、不安は和らぎました。",[[16,18],[19,23]],"A"],["at large","The thief, who escaped yesterday, is still at large.","昨日逃げたその泥棒は、まだ捕まっていません。",[[43,45],[46,51]],"A"],["at least","You should have called at least once.","少なくとも一度は、電話をしてくれるべきでした。",[[23,25],[26,31]],"A"],["at one's earliest convenience","Would you please reply at your earliest convenience?","ご都合がつき次第、できるだけ早くお返事いただけますか。",[[23,25],[26,30],[31,39],[40,51]],"A"],["at random","The names have been selected at random by computer.","名前は、コンピューターで無作為に選ばれました。",[[29,31],[32,38]],"A"],["at the moment","The kitchen is being cleaned at the moment.","今、台所を掃除しているところです。",[[29,31],[32,35],[36,42]],"A"],["at times","At times, I wish I'd chosen a different career.","ときどき、別の仕事を選んでいたらと思います。",[[0,2],[3,8]],"A"],["atmosphere","The friendly atmosphere made me feel welcome immediately.","親しみやすい雰囲気のおかげで、すぐにくつろげました。",[[13,23]],"A"],["attach","The file appears to have been attached to the wrong email.","ファイルを、別のメールに添付してしまったようです。",[[30,38]],"A"],["attempt","He denied having attempted to open the locked drawer.","彼は、鍵のかかった引き出しを開けようとしたことを否定しました。",[[17,26]],"A"],["attend","I'd have attended if you had invited me.","招待してくれていたら、出席していたのに。",[[9,17]],"A"],["attitude","Your positive attitude makes everyone feel more confident.","あなたの前向きな姿勢は、みんなに自信を与えます。",[[14,22]],"A"],["attract","We watched the bright flowers attract several butterflies.","鮮やかな花に、チョウが何匹も集まるのを見ました。",[[30,37]],"A"],["audience","I heard the audience laugh before I reached the stage.","舞台に出る前に、観客が笑うのが聞こえました。",[[12,20]],"A"],["author","She's the author whose books helped me enjoy reading.","彼女は、私が読書を楽しむきっかけになった本の著者です。",[[10,16]],"A"],["authority","The local authority, which owns the building, approved the repairs.","建物を所有する自治体が、修理を承認しました。",[[10,19]],"A"],["automatically","The doors are being programmed to close automatically.","ドアは、自動的に閉まるよう設定作業が進んでいます。",[[40,53]],"A"],["available","You should take whichever room is available tonight.","今夜空いている部屋なら、どの部屋でも取るべきでしょう。",[[34,43]],"A"],["average","Our average bill is twice what it was last year.","平均の請求額は、去年の2倍です。",[[4,11]],"A"],["avoid","I wish we had left earlier to avoid traffic.","渋滞を避けるために、もっと早く出ればよかったです。",[[30,35]],"A"],["award","It was this award that encouraged her to continue.","彼女が続ける励みになったのは、この賞でした。",[[12,17]],"A"],["aware","Not everyone was aware that the meeting had been canceled.","会議が中止になったと、全員が知っていたわけではありません。",[[17,22]],"A"],["awful","I must have looked awful after that long flight.","あの長いフライトの後は、ひどい顔をしていたのでしょう。",[[19,24]],"A"],["back and forth","I watched him walk back and forth outside.","彼が外を行ったり来たり歩くのを、見ていました。",[[19,23],[24,27],[28,33]],"B"],["back up ~","The files should have been backed up before updating.","更新前に、ファイルのバックアップを取るべきでした。",[[27,33],[34,36]],"B"],["background","With music playing in the background, we finished cooking.","音楽を流しながら、私た ]],"B"],["be convinced of ~","We're convinced of his innocence, which the evidence supports.","私たちは彼の無実を確信しており、証拠もそれを裏付けています。",[[0,5],[6,15],[16,18]],"B"],["be cut out for ~","Not everyone is cut out for working alone.","誰もが、一人で働くことに向いているわけではありません。",[[13,15],[16,19],[20,23],[24,27]],"B"],["be devoted to ~","She's devoted to helping whoever needs support in our neighborhood.","彼女は、近所で支援が必要な人を誰でも助けようと尽力しています。",[[0,5],[6,13],[14,16]],"B"],["be eager to do","She seems to have been eager to tell us.","彼女は、私たちに話したくてたまらなかったようです。",[[18,22],[23,28],[29,31]],"B"],["be engaged in ~","He's engaged in work that should benefit the whole community.","彼は、地域全体の役に立つはずの仕事に携わっています。",[[0,4],[5,12],[13,15]],"B"],["be equivalent to ~","This amount should be equivalent to a week's rent.","この金額は、家賃1週間分に相当するはずです。",[[19,21],[22,32],[33,35]],"B"],["be familiar with ~","I'd be familiar with the area if I lived there.","そこに住んでいれば、その辺りに詳しいでしょう。",[[4,6],[7,15],[16,20]],"B"],["be fed up with ~","I'm fed up with being told to wait outside.","外で待てと言われるのには、うんざりです。",[[0,3],[4,7],[8,10],[11,15]],"B"],["be free of ~","The room should be free of dust after cleaning.","掃除の後は、部屋にほこりがないはずです。",[[16,18],[19,23],[24,26]],"B"],["be independent of ~","She wants to be independent of her parents.","彼女は、親から自立したいと思っています。",[[13,15],[16,27],[28,30]],"B"],["be indifferent to ~","She isn't indifferent to what other people are experiencing.","彼女は、ほかの人の経験していることに無関心ではありません。",[[4,9],[10,21],[22,24]],"B"],["be indispensable for ~","A reliable map would be indispensable for exploring this area.","この地域を探検するなら、信頼できる地図が不可欠でしょう。",[[21,23],[24,37],[38,41]],"B"],["be involved in ~","I'd be involved in planning if I had time.","時間があれば、私も企画に関わるのですが。",[[4,6],[7,15],[16,18]],"B"],["be liable to do","This shelf is liable to collapse, so we should replace it.","この棚は崩れかねないので、交換するべきです。",[[11,13],[14,20],[21,23]],"B"],["be likely to do","The train would be likely to stop in heavy snow.","大雪なら、電車は止まる可能性が高いでしょう。",[[16,18],[19,25],[26,28]],"B"] ertain","You should be certain before you accuse someone.","人を責める前には、確信を持つべきです。",[[14,21]],"C"],["certificate","My certificate, which arrived yesterday, had the wrong name.","昨日届いた証明書には、名前が間違って記載されていました。",[[3,14]],"C"],["championship","Never had our team won a championship before.","それまで、私たちのチームは一度も優勝したことがありませんでした。",[[25,37]],"C"],["change one's mind","I'd change my mind if the price were lower.","値段がもっと安ければ、考えを変えるのですが。",[[4,10],[11,13],[14,18]],"C"],["characteristic","Not everyone shares this characteristic, even within the family.","家族の中でも、全員にこの特徴があるわけではありません。",[[25,39]],"C"],["charge","They shouldn't have charged us extra for the bag.","そのかばんに、追加料金を取るべきではありませんでした。",[[20,27]],"C"],["charity","I'd donate more to charity if I earned more.","収入がもっとあれば、慈善団体にもっと寄付するのですが。",[[19,26]],"C"],["chase","I saw your dog chase a cat across the garden.","あなたの犬が、庭で猫を追いかけるのを見ました。",[[15,20]],"C"],["check","I should have checked the address before leaving.","出発前に、住所を確認するべきでした。",[[14,21]],"C"],["check in","Would you let us check in a little earlier?","少し早く、チェックインさせていただけますか。",[[17,22],[23,25]],"C"],["check out","We need to check out before eleven tomorrow.","明日は、11時前にチェックアウトする必要があります。",[[11,16],[17,20]],"C"],["checkup","I should have booked a checkup before my trip.","旅行の前に、健康診断を予約しておくべきでした。",[[23,30]],"C"],["chemical","These chemicals are being stored in a locked cupboard.","これらの化学薬品は、鍵のかかる戸棚で保管されています。",[[6,15]],"C"],["chief","The chief insisted that everyone should follow the same rules.","責任者は、全員が同じ規則に従うよう強く求めました。",[[4,9]],"C"],["childhood","This song reminds me of my childhood.","この歌を聞くと、子どもの頃を思い出します。",[[27,36]],"C"],["chilly","With a chilly wind blowing, we decided to go inside.","冷たい風が吹いていたので、中へ入ることにしました。",[[7,13]],"C"],["chore","Not every household chore needs to be done daily.","家事のすべてを、毎日する必要はありません。",[[20,25]],"C"],["circumstance","Under different circumstances, I would gladly have accepted.","状況が違っていたら、喜んで引き受けていたでしょう。",[[16,29]],"C"],["citizen","I met a Canadian citizen whose passport had been stolen.","パスポートを盗まれたカナダ人に、会いました。",[[17,24]],"C"],["civil","The civil ceremony, which lasted twenty minutes, was lovely.","20分間のその人前結婚式は、すてきでした。",[[4,9]],"C"],["classical","She prefers listening to classical music while she works.","彼女は、仕事中にはクラシック音楽を聴くほうが好きです。",[[25,34]],"C"],["classification","The classification of these documents is being reviewed.","これらの書類の分類を、見直しています。",[[4,18]],"C"],["claw","The cat sat with its claws caught in the curtain.","猫は、カーテンに爪を引っかけたまま座っていました。",[[21,26]],"C"],["client","Our client, who lives abroad, has requested another meeting.","海外在住のその依頼人から、再度の打ち合わせを求められました。",[[4,10]],"C"],["clinic","This is the clinic where my mother used to work.","ここは、母が以前勤めていた診療所です。",[[12,18]],"C"],["closely","The results appear to have been examined closely.","結果は、詳しく調べられたようです。",[[41,48]],"C"],["clothes","I found my clothes folded neatly on the bed.","服が、ベッドの上にきちんと畳まれていました。",[[11,18]],"C"],["clothing","Some clothing has been set aside for the charity sale.","一部の衣類は、慈善バザー用に取り分けてあります。",[[5,13]],"C"],["clue","Had we noticed that clue, we'd have found her sooner.","その手掛かりに気付いていたら、もっと早く彼女を見つけられたでしょう。",[[20,24]],"C"],["coincidence","It can't have been a coincidence that we met again.","私たちがまた会ったのは、偶然だったはずがありません。",[[21,32]],"C"],["collapse","The roof is believed to have collapsed during the storm.","屋根は、嵐の最中に崩れ落ちたと考えられています。",[[29,38]],"C"],["colleague","My colleague, whose desk is opposite mine, speaks Italian.","私の向かいに机がある同僚は、イタリア語を話します。",[[3,12]],"C"],["combine","Combining our plans would make the trip less expensive.","計画を一緒にすれば、旅行の費用が安くなるでしょう。",[[0,9]],"C"],["come about","Nobody could have predicted how these changes would come about.","こうした変化がどう生じるか、誰も予測できなかったでしょう。",[[52,56],[57,62]],"C"],["come across ~","I didn't expect to come across this old photo.","この古い写真が見つかるとは、思っていませんでした。",[[19,23],[24,30]],"C"],["come around","Had you come around earlier, we'd have had coffee.","もっと早く立ち寄ってくれたら、コーヒーを一緒に飲めたのに。",[[8,12],[13,19]],"C"],["come by ~","These tickets, which are difficult to come by, were expensive.","入手しにくいこのチケットは、高価でした。",[[38,42],[43,45]],"C"],["come down","Prices seem to have come down since last spring.","昨春から、物価が下がったようです。",[[20,24],[25,29]],"C"],["come out","The new book should have come out by now.","新しい本は、もう出版されているはずです。",[[25,29],[30,33]],"C"],["come to light","The truth might have come to light much sooner.","真実は、もっと早く明らかになっていたかもしれません。",[[21,25],[26,28],[29,34]],"C"],["come up with ~","You should share whatever ideas you come up with.","思い付いた案は、何でも話してみるとよいでしょう。",[[36,40],[41,43],[44,48]],"C"],["command","The officer commanded that the gates should be closed.","将校は、門を閉じるよう命じました。",[[12,21]],"C"],["comment","She regretted having made that comment during the meeting.","彼女は、会議中にその発言をしたことを後悔しました。",[[31,38]],"C"],["commercial","It was that commercial that made me visit the shop.","その店へ行くきっかけになったのは、あの広告でした。",[[12,22]],"C"],["commit","He denied having committed any crime that night.","彼は、その夜に犯罪を犯したことを否定しました。",[[17,26]],"C"],["committee","Not all committee members agreed with the final decision.","委員全員が、最終決定に賛成したわけではありません。",[[8,17]],"C"],["common","This is becoming a more and more common mistake.","これは、ますますよく見られる間違いになっています。",[[33,39]],"C"],["communicate","I've been learning to communicate more clearly with customers.","お客様に分かりやすく伝える方法を、学び続けています。",[[22,33]],"C"],["community","This is the community where my grandparents grew up.","ここは、祖父母が育った地域です。",[[12,21]],"C"],["companion","My traveling companion, whom I'd met online, loved hiking.","ネットで知り合った旅の同行者は、ハイキングが大好きでした。",[[13,22]],"C"],["compare","You should compare prices before choosing a hotel.","ホテルを選ぶ前に、料金を比較するとよいでしょう。",[[11,18]],"C"],["compete","She hopes to compete in the next tournament.","彼女は次の大会に出場して競いたいと思っています。",[[13,20]],"C"],["complain","I'd like to complain about the noise upstairs.","上の階の騒音について、苦情を言いたいのですが。",[[12,20]],"C"],["complete","The repairs should have been completed before we arrived.","修理は、私たちが着く前に終わっているべきでした。",[[29,38]],"C"],["complex","The 4]],"C"],["connect","I'll have someone connect the printer for you.","誰かに頼んで、プリンターをつないでもらいます。",[[18,25]],"C"],["conquer","Having conquered her fear, she finally stepped onto the stage.","恐怖を乗り越えて、彼女はついに舞台に上がりました。",[[7,16]],"C"],["conscious","He lay with his eyes open, conscious of every sound.","彼は目を開けたまま、すべての音を意識して横たわっていました。",[[27,36]],"C"],["conservation","The conservation project has been supported by local schools.","その自然保護事業は、地元の学校から支援を受けてきました。",[[4,16]],"C"],["consider","Please consider staying with us for another night.","もう1泊していくことを、考えてみてください。",[[7,15]],"C"],["consist","Our presentation should consist of three short sections.","私たちの発表は、三つの短い部分で構成するとよいでしょう。",[[24,31]],"C"],["consist of ~","The group, which consists of local residents, meets every Friday.","地元住民で構成されるそのグループは、毎週金曜日に集まります。",[[17,25],[26,28]],"C"],["constantly","She'd been constantly checking her phone before the interview.","面接前、彼女は絶えず携帯電話を確認し続けていました。",[[11,21]],"C"],["construct","A new footbridge is being constructed over the river.","川に、新しい歩道橋を建設しています。",[[26,37]],"C"],["consume","Not all the energy we consume comes from electricity.","私たちが使うエネルギーのすべてが、電気から得られるわけではありません。",[[22,29]],"C"],["contact","Had you contacted me, I could have explained everything.","連絡してくれていたら、すべて説明できたのに。",[[8,17]],"C"],["contain","This sauce shouldn't contain nuts, but I'll check.","このソースにナッツは入っていないはずですが、確認します。",[[21,28]],"C"],["container","The container, which arrived damaged, has been sent back.","破損した状態で届いたその容器は、返送されました。",[[4,13]],"C"],["content","The content of the report is being reviewed.","その報告書の内容を、見直しています。",[[4,11]],"C"],["continue","We've decided to continue the meeting after lunch.","昼食の後で会議を続けることにしました。",[[17,25]],"C"],["contract","The contract is being looked over by our lawyer.","その契約書は、弁護士に確認してもらっています。",[[4,12]],"C"],["contrary to ~","Contrary to what we'd expected, the roads were quiet.","予想とは違い、道路は空いていました。",[[0,8],[9,11]],"C"],["contribute","He admitted having contributed nothing to the final report.","彼は、最終報告書に何も貢献しなかったことを認めました。",[[19,30]],"C"],["control","I'll let you control the camera during filming.","撮影中は、あなたにカメラを操作してもらいます。",[[13,20]],"C"],["convenient","Would Saturday morning be convenient for you?","土曜日の午前中は、ご都合がよろしいですか。",[[26,36]],"C"],["convert","The old mill has been converted into apartments.","その古い製粉所は、集合住宅に改装されました。",[[22,31]],"C"],["convince","I seem to have convinced him to stay another night.","彼を説得して、もう一晩泊まってもらえたようです。",[[15,24]],"C"],["cooperate","Had everyone cooperated, we would have finished much earlier.","みんなが協力していたら、ずっと早く終わっていたでしょう。",[[13,23]],"C"],["cope with ~","Without your support, I couldn't have coped with everything.","あなたの支えがなければ、すべてに対処できなかったでしょう。",[[38,43],[44,48]],"C"],["corporation","She joined a corporation whose offices are near our school.","彼女は、私たちの学校の近くに事務所がある企業に入りました。",[[13,24]],"C"],["correct","You should have checked that the address was correct.","住所が正しいか、確認するべきでした。",[[45,52]],"C"],["correspond with ~","The results should correspond with what we observed yesterday.","結果は、昨日観察したことと一致するはずです。",[[19,29],[30,34]],"C"],["cost","This would cost less than repairing our old one.","これなら、古いものを修理するより安く済むでしょう。",[[11,15]],"C"],["council","The council recommended that the road should be widened.","議会は、その道路を拡幅するよう勧告しました。",[[4,11]],"C"],["count","By noon, we'll have counted all the tickets.","正午までには、チケットをすべて数え終えているでしょう。",[[20,27]],"C"],["count on [upon] ~","You should be able to count on your friends.","友達は、頼れる存在であるはずです。",[[22,27],[28,30]],"C"],["courage","It was her courage that made me speak up.","私が声を上げるきっかけは、彼女の勇気でした。",[[11,18]],"C"],["court","The court, which hears local cases, is closed today.","地元の事件を扱うその裁判所は、今日は閉まっています。",[[4,9]],"C"],["cover","The table was covered with papers when I arrived.","私が着いたとき、テーブルは書類で覆われていました。",[[14,21]],"C"],["crash","I heard something crash in the kitchen.","台所で、何かが大きな音を立てて落ちるのが聞こえました。",[[18,23]],"C"],["create","We want to create a welcoming space for everyone.","誰もが気軽に来られる場所を作りたいです。",[[11,17]],"C"],["creature","The creature appears to have escaped through this hole.","その生き物は、この穴から逃げたようです。",[[4,12]],"C"],["credit","I'd pay by credit card if I were you.","私があなたなら、クレジットカードで払います。",[[11,17]],"C"],["crime","The crime had happened before anyone noticed the broken window.","割れた窓に誰かが気付く前に、犯罪は起きていました。",[[4,9]],"C"],["critic","Not every critic enjoyed the film as much as you.","どの批評家も、あなたほど映画を楽しんだわけではありません。",[[10,16]],"C"],["critical","The critical decision had been made before I joined.","その重大な決定は、私が加わる前に下されていました。",[[4,12]],"C"],["criticize","Nobody enjoys being criticized in front of their colleagues.","同僚の前で批判されて、喜ぶ人はいません。",[[20,30]],"C"],["crop","Heavy rain had damaged the crop before the harvest.","収穫前に、大雨で作物が傷んでいました。",[[27,31]],"C"],["cruel","He regretted having been cruel to his younger brother.","彼は、弟にひどいことをしたのを後悔しました。",[[25,30]],"C"],["cuisine","The restaurant, which serves local cuisine, is always busy.","郷土料理を出すそのレストランは、いつも繁盛しています。",[[35,42]],"C"],["cure","They're trying to find a cure for the disease.","彼らは、その病気の治療法を見つけようとしています。",[[25,29]],"C"],["curious","My curious son, who's only five, asks endless questions.","まだ5歳の好奇心旺盛な息子は、ひっきりなしに質問します。",[[3,10]],"C"],["currency","The currency is being exchanged at the agreed rate.","その通貨は、合意したレートで両替されています。",[[4,12]],"C"],["current","Not everyone is satisfied with the current arrangements.","現在の取り決めに、全員が満足しているわけではありません。",[[35,42]],"C"],["curve","Had I slowed down, I'd have handled the curve better.","速度を落としていたら、もっと上手にカーブを曲がれたでしょう。",[[40,45]],"C"],["custom","You should respect local customs wherever you travel.","どこへ旅行しても、地元の習慣を尊重するとよいでしょう。",[[25,32]],"C"],["customer","We should listen to whatever the customer says.","お客様のお話には、何であれ耳を傾けるべきです。",[[33,41]],"C"],["cut down on ~","I've been cutting down on coffee since last month.","先月から、コーヒーを飲む量を減らしています。",[[10,17],[18,22],[23,25]],"C"],["cut off ~","Our electricity appears to have been cut off accidentally.","電気は、誤って止められてしまったようです。",[[37,40],[41,44]],"C"],["damage","They'll have
