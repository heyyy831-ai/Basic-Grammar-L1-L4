<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>単語帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;0,700;1,400&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#F4F1EA; --paper:#FFFFFF; --soft:#F8F5EE; --ink:#1E2A3A; --ink-2:#4A5568; --ink-3:#8A93A3;
  --rule:#E2DCCF; --navy:#2B3F5C; --orange:#C8693E; --orange-soft:#F7E6DC; --green:#3E8A6A; --green-soft:#E3F1EA;
  --violet:#6B5BA8; --violet-soft:#ECE8F6; --hl:#FFF0B8; --hl-line:#E9C46A;
  --en:"Crimson Pro","Georgia","Times New Roman",serif;
  --jp:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#13171E; --paper:#1B212B; --soft:#202733; --ink:#E9EDF3; --ink-2:#B8C1CF; --ink-3:#7F8A9C;
    --rule:#2F3846; --navy:#9CB8E0; --orange:#E89A72; --orange-soft:#3A2A22; --green:#6CC49E; --green-soft:#1C3229;
    --violet:#B3A6E8; --violet-soft:#2A2540; --hl:#4A3F17; --hl-line:#C9A443;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#13171E; --paper:#1B212B; --soft:#202733; --ink:#E9EDF3; --ink-2:#B8C1CF; --ink-3:#7F8A9C;
  --rule:#2F3846; --navy:#9CB8E0; --orange:#E89A72; --orange-soft:#3A2A22; --green:#6CC49E; --green-soft:#1C3229;
  --violet:#B3A6E8; --violet-soft:#2A2540; --hl:#4A3F17; --hl-line:#C9A443;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--jp);font-size:15.5px;line-height:1.8;-webkit-font-smoothing:antialiased}
.wrap{max-width:900px;margin:0 auto;padding:0 16px 80px}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}

header{padding:28px 0 10px}
.kicker{display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:var(--ink-3);font-size:12.5px}
.badge{background:var(--navy);color:var(--paper);border-radius:6px;padding:5px 11px;line-height:1.15;font-weight:700;font-size:13px}
.theme{margin-left:auto;border:1px solid var(--rule);background:var(--paper);color:var(--ink-2);border-radius:99px;padding:4px 12px;font-size:12.5px}
h1{font-size:clamp(22px,5vw,30px);line-height:1.35;margin:12px 0 4px;letter-spacing:.01em}
.lead{color:var(--ink-2);margin:0;font-size:14px}

.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:16px 0 4px}
.search{flex:1 1 220px;min-width:0;border:1px solid var(--rule);background:var(--paper);border-radius:10px;padding:9px 12px;font:inherit;font-family:var(--en);font-size:17px;color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--rule);background:var(--paper);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:700;color:var(--ink-3)}
.chip[aria-pressed="true"]{color:var(--ink);border-color:var(--ink-3);background:var(--soft)}
.chip i{font-style:normal;display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}

.az{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--rule);margin:10px -16px 0;padding:8px 16px}
.az-in{display:grid;grid-template-columns:repeat(13,1fr);gap:4px;max-width:900px;margin:0 auto}
.az button{border:0;background:transparent;border-radius:8px;padding:5px 0;font-family:var(--en);font-weight:700;font-size:18px;color:var(--ink-2)}
.az button:hover{background:var(--soft)}
.az button.on{background:var(--navy);color:var(--paper)}
.az button:disabled{opacity:.3;cursor:default}

.lettertitle{display:flex;align-items:baseline;gap:12px;margin:22px 0 10px}
.lettertitle b{font-family:var(--en);font-size:44px;line-height:1;color:var(--navy)}
.lettertitle span{color:var(--ink-3);font-size:13px}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.w{display:flex;align-items:center;gap:8px;text-align:left;border:1px solid var(--rule);background:var(--paper);border-radius:10px;padding:7px 10px;min-width:0}
.w:hover{border-color:var(--ink-3)}
.w .hw{font-family:var(--en);font-size:18px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.w .n{font-size:11.5px;color:var(--ink-3)}
.lv{flex:none;font-size:10.5px;font-weight:700;border-radius:5px;padding:1px 6px;line-height:1.5;letter-spacing:.02em}
.lv.B1{background:var(--green-soft);color:var(--green)}
.lv.B2{background:var(--orange-soft);color:var(--orange)}
.lv.C1,.lv.C2,.lv.C1p{background:var(--violet-soft);color:var(--violet)}
.empty{color:var(--ink-3);padding:30px 0;text-align:center}

/* detail */
.back{border:1px solid var(--rule);background:var(--paper);border-radius:99px;padding:5px 14px;font-size:13px;font-weight:700;color:var(--ink-2);margin-top:20px}
.dhead{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin:14px 0 6px}
.dhead h2{font-family:var(--en);font-size:clamp(32px,8vw,44px);margin:0;line-height:1.1}
.dhead .lv{font-size:12px;padding:3px 9px}
.dsub{color:var(--ink-3);font-size:13px}
.bar{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 16px}
.btn{border:1px solid var(--rule);background:var(--paper);border-radius:8px;padding:6px 12px;font-size:13px;font-weight:700;color:var(--ink-2)}
.btn:hover{border-color:var(--ink-3);color:var(--ink)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:var(--paper)}
.btn[aria-pressed="true"]{background:var(--soft);color:var(--ink);border-color:var(--ink-3)}
.vsel{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--ink-2)}
.vsel select{max-width:220px;border:1px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 8px;font:inherit;font-weight:500}
.cards{display:flex;flex-direction:column;gap:10px}
.card{background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:12px 16px 12px}
.card.playing{border-color:var(--orange);box-shadow:0 0 0 2px var(--orange-soft)}
.loc{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--ink-3);font-weight:500}
.loc .tag{background:var(--soft);border:1px solid var(--rule);border-radius:5px;padding:0 7px}
.loc .adv{background:var(--orange-soft);color:var(--orange);border-radius:5px;padding:0 7px;font-weight:700}
.loc .src{background:var(--green-soft);color:var(--green);border-radius:5px;padding:0 7px;font-weight:700}
.w.ph .hw{font-style:italic;white-space:normal;overflow:visible;line-height:1.3}
.w.wide{grid-column:span 2}
.loc .app{background:var(--navy);color:var(--paper);border-radius:5px;padding:0 7px;font-weight:700}
.en{font-family:var(--en);font-size:21px;line-height:1.45;margin:6px 0 8px;overflow-wrap:anywhere}
.en mark{background:linear-gradient(transparent 58%,var(--hl) 58%);color:inherit;font-weight:700;padding:0 1px}
.ja{color:var(--ink-2);font-size:14.5px;border-left:3px solid var(--hl-line);padding:2px 0 2px 10px;margin:0 0 8px}
.ja[hidden]{display:none}
.acts{display:flex;gap:6px}
.embed header{padding-top:6px}
.embed .kicker{display:none}
.embed .az{position:static;backdrop-filter:none;background:transparent}
.foot{margin-top:48px;color:var(--ink-3);font-size:12px;line-height:1.7;border-top:1px solid var(--rule);padding-top:14px}
.foot a{color:var(--ink-2)}
@media (max-width:560px){
  .az-in{grid-template-columns:repeat(9,1fr)}
  .az button{font-size:16px}
  .words{grid-template-columns:repeat(auto-fill,minmax(135px,1fr))}
  .en{font-size:19.5px}
}

.vbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0 2px}.vbar .vnote{font-size:12px;color:var(--ink-3)}.vbar .vpick{max-width:280px}
.grades{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 4px}
.grade{border:2px solid var(--rule);background:var(--paper);border-radius:12px;padding:10px 22px;font-size:16px;font-weight:700;color:var(--ink-2)}
.grade:hover{border-color:var(--ink-3);color:var(--ink)}
.grade[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--paper)}
.grade small{display:block;font-size:11.5px;font-weight:500;opacity:.8}
.wnav{display:flex;justify-content:space-between;gap:8px;margin-top:16px}
.wnav .btn{max-width:48%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hint{color:var(--ink-3);font-size:14px;padding:26px 0;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kicker"><span class="badge">単語帳</span><span>英検レベル別 単語・熟語</span>
      <button class="theme" id="theme" type="button">表示切替</button></div>
    <h1>単語帳</h1>
    <div class="grades" id="grades">
      <button class="grade" type="button" data-g="5" aria-pressed="false">英検５級レベル<small id="n5"></small></button>
      <button class="grade" type="button" data-g="4" aria-pressed="false">英検４級レベル<small id="n4"></small></button>
    </div>
    <div class="vbar">
      <label class="vsel">声<select class="vpick" aria-label="読み上げの声"></select></label>
      <button class="btn" type="button" id="vtest">試聴</button>
      <span class="vnote">★ は自然な音声（Google・Microsoft Natural など）</span>
    </div>
    <div id="gtools" hidden>
      <p class="lead" id="lead"></p>
      <div class="tools">
        <input class="search" id="q" type="search" placeholder="語・句を検索（例：apple, get up）" autocomplete="off" autocapitalize="off" spellcheck="false">
        <div class="chips" id="tychips"></div>
      </div>
    </div>
  </header>
  <nav class="az" aria-label="アルファベット索引" id="aznav" hidden><div class="az-in" id="az"></div></nav>
  <main id="main"><p class="hint">上のボタンでレベルを選んでください。</p></main>
</div>

k now.","母は今、仕事中です。",[[13,15],[16,20]],"A"],["aunt","My aunt teaches English at a small school.","おばは小さな学校で英語を教えています。",[[3,7]],"A"],["Australia","My uncle lives in Australia and works at a hotel.","おじはオーストラリアに住み、ホテルで働いています。",[[18,27]],"A"],["away","My father is away on business this week.","父は今週、出張で留守にしています。",[[13,17]],"A"],["back","Please come back before we start cooking dinner.","夕食を作り始める前に、戻ってきてください。",[[12,16]],"B"],["bad","I have a bad cold, so I'm staying home.","ひどい風邪なので、家で休みます。",[[9,12]],"B"],["badminton","We play badminton after school twice a week.","週に2回、放課後にバドミントンをします。",[[8,17]],"B"],["band","My brother is in a band.","兄はバンドに入っています。",[[19,23]],"B"],["bank","Is there a bank near here?","この近くに銀行はありますか。",[[11,15]],"B"],["basketball","Can you play basketball, or do you prefer volleyball?","バスケはできますか、それともバレーのほうが好きですか。",[[13,23]],"B"],["bath","I take a bath every night.","私は毎晩お風呂に入ります。",[[9,13]],"B"],["bathroom","The bathroom is over there, next to the stairs.","トイレはあちらの階段の隣です。",[[4,12]],"B"],["be glad to do","I'm glad to see you again after so long.","久しぶりにまたお会いできて、うれしいです。",[[0,3],[4,8],[9,11]],"B"],["be good at ~","Are you good at cooking, or do you prefer baking?","料理は得意ですか、それともお菓子作りのほうが好きですか。",[[0,3],[8,12],[13,15]],"B"],["be happy to do","I'd be happy to help you with your homework.","喜んで宿題のお手伝いをします。",[[4,6],[7,12],[13,15]],"B"],["be kind to ~","Please be kind to animals, even when you're tired.","疲れているときでも、動物には優しくしてください。",[[7,9],[10,14],[15,17]],"B"],["be late for ~","Don't be late for school again tomorrow morning.","明日の朝は、また学校に遅れないようにしてください。",[[6,8],[9,13],[14,17]],"B"],["be ready for ~","Are you ready for the test?","テストの準備はできていますか。",[[0,3],[8,13],[14,17]],"B"],["be sick in bed","My brother is sick in bed with a cold.","弟は風邪で寝ています。",[[11,13],[14,18],[19,21],[22,25]],"B"],["beach","Let's go to the beach if it's sunny tomorrow.","明日晴れたら、海に行きましょう。",[[16,21]],"B"],["beautiful","Your garden looks beautiful with all these spring flowers.","春の花がいっぱいで、お庭がきれいで let grade = null, letter = 'A', query = '', cur = null;
let typ = {w:true,p:true};
try{const s=JSON.parse(store.get('tango-typ')||'null'); if(s) typ=Object.assign(typ,s);}catch(e){}
$('n5').textContent = G['5'].length + ' 項目'; $('n4').textContent = G['4'].length + ' 項目';

// theme
(function(){const t=store.get('kmv-theme'); if(t) document.documentElement.dataset.theme=t;
 $('theme').onclick=()=>{const c=document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
  const n=c==='dark'?'light':'dark'; document.documentElement.dataset.theme=n; store.set('kmv-theme',n);};})();

const W = () => G[grade] || [];
function visible(){ return W().filter(w=>w.ph?typ.p:typ.w); }
function renderGrades(){
  $('grades').querySelectorAll('.grade').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.g===grade)));
  $('gtools').hidden = $('aznav').hidden = !grade;
  if (!grade) return;
  const nw=W().filter(w=>!w.ph).length, np=W().length-nw;
  $('lead').textContent = `英検${grade==='5'?'５':'４'}級レベルの単語 ${nw} 語・熟語 ${np} 項目。クリックすると例文と日本語訳が出ます。`;
  const TY=[{k:'w',label:'単語',n:nw},{k:'p',label:'熟語',n:np}];
  $('tychips').innerHTML = TY.map(x=>`<button class="chip" type="button" data-t="${x.k}" aria-pressed="${typ[x.k]}">${x.label} <span style="font-weight:500">${x.n}</span></button>`).join('');
  $('tychips').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{typ[b.dataset.t]=!typ[b.dataset.t]; store.set('tango-typ',JSON.stringify(typ)); renderGrades(); route();});
}
$('grades').addEventListener('click',e=>{const b=e.target.closest('.grade'); if(!b) return; if(b.dataset.g===grade && !cur && !query) return; query=''; $('q').value=''; location.hash='#g'+b.dataset.g+'/A';});
function renderAZ(){
  const has=new Set(visible().map(w=>w.L));
  $('az').innerHTML = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map(L=>`<button type="button" data-l="${L}" class="${!query&&L===letter&&!cur?'on':''}" ${has.has(L)?'':'disabled'}>${L}</button>`).join('');
  $('az').querySelectorAll('button').forEach(b=>b.onclick=()=>{query=''; $('q').value=''; location.hash='#g'+grade+'/'+b.dataset.l;});
}
function wordBtn(w){
  return `<button class="w${w.ph?' ph':''}${w.ph&&w.h.length>22?' wide':''}" type="button" data-i="${w.i}"><span class="hw">${esc(w.h)}</span></button>`;
}
function listItems(){
  const v=visible();
  if(query){ const q=query.toLowerCase(); return v.filter(w=>w.h.toLowerCase().includes(q)).sort((a,b)=>(b.h.toLowerCase().startsWith(q))-(a.h.toLowerCase().startsWith(q))||a.i-b.i); }
  return v.filter(w=>w.L===letter);
}
function renderList(){
  const items=listItems();
  const title = query ? `<b style="font-size:26px">“${esc(query)}”</b>` : `<b>${letter}</b>`;
  $('main').innerHTML = `<div class="lettertitle">${title}<span>${items.length} 項目</span></div>` +
    (items.length?`<div class="words">${items.map(wordBtn).join('')}</div>`:`<div class="empty">該当する語がありません</div>`);
  $('main').querySelectorAll('.w').forEach(b=>b.onclick=()=>{location.hash='#g'+grade+'/w='+b.dataset.i;});
}
function highlight(en, spans){
  const sp=[...spans].sort((a,b)=>a[0]-b[0]), merged=[];
  for(const [a,b] of sp){ const last=merged[merged.length-1];
    if(last && a>=last[1] && /^\s*$/.test(en.slice(last[1],a))) last[1]=Math.max(last[1],b);
    else if(!last || a>=last[1]) merged.push([a,b]); }
  let out='', pos=0;
  for(const [a,b] of merged){ out+=esc(en.slice(pos,a))+'<mark>'+esc(en.slice(a,b))+'</mark>'; pos=b; }
  return out+esc(en.slice(pos));
}
let jaOpen=false;
function renderDetail(w){
  const seq=listItems(), k=seq.indexOf(w), prev=k>0?seq[k-1]:null, next=k>=0&&k<seq.length-1?seq[k+1]:null;
  $('main').innerHTML = `
    <button class="back" type="button" id="back">← ${query?'検索結果':letter+' の一覧'}へ</button>
    <div class="dhead"><h2>${esc(w.h)}</h2><span class="dsub">英検${grade==='5'?'５':'４'}級レベル・${w.ph?'熟語':'単語'}</span></div>
    <div class="bar">
      <button class="btn" type="button" id="rate" aria-pressed="false">ゆっくり</button>
      <label class="vsel">声<select class="vpick" aria-label="読み上げの声"></select></label>
    </div>
    <div class="card" id="card">
      <div class="en" lang="en">${highlight(w.en, w.spans)}</div>
      <div class="ja"${jaOpen?'':' hidden'}>${esc(w.ja)}</div>
      <div class="acts"><button class="btn tj" type="button" aria-pressed="${jaOpen}">${jaOpen?'訳を隠す':'日本語訳'}</button><button class="btn say" type="button">🔊 読み上げ</button></div>
    </div>
    <div class="wnav">
      ${prev?`<button class="btn" type="button" data-i="${prev.i}">◀ ${esc(prev.h)}</button>`:'<span></span>'}
      ${next?`<button class="btn" type="button" data-i="${next.i}">${esc(next.h)} ▶</button>`:'<span></span>'}
    </div>`;
  const c=$('card'), tj=c.querySelector('.tj'), ja=c.querySelector('.ja');
  $('back').onclick=()=>{location.hash='#g'+grade+'/'+(query?'q='+encodeURIComponent(query):letter);};
  tj.onclick=()=>{jaOpen=ja.hidden; ja.hidden=!jaOpen; tj.setAttribute('aria-pressed',jaOpen); tj.textContent=jaOpen?'訳を隠す':'日本語訳';};
  c.querySelector('.say').onclick=()=>{stop(); speak(w.en,c);};
  $('main').querySelectorAll('.wnav .btn').forEach(b=>b.onclick=()=>{location.hash='#g'+grade+'/w='+b.dataset.i;});
  fillVoices();
  $('rate').setAttribute('aria-pressed',slow); $('rate').onclick=e=>{slow=!slow; e.currentTarget.setAttribute('aria-pressed',slow);};
  toTop();
}
// speech
let slow=false, voice=null, enVoices=[];
// 自然な音声（Edge の Natural/Online、Chrome の Google、Apple の Premium/Enhanced）を優先
const NOVELTY=/\b(Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Good News|Jester|Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox|Fred|Junior|Ralph|Kathy|Grandma|Grandpa|Eddy|Flo|Reed|Rocko|Sandy|Shelley)\b/;
function vRank(v){
  const n=v.name, us=/^en[-_]US/i.test(v.lang)?0:0.5;
  if(NOVELTY.test(n)) return 9;
  if(/Natural|Online/i.test(n)) return 0+us;
  if(/^Google/i.test(n)) return (/US English/i.test(n)?1:1.2)+us;
  if(/Premium|Enhanced|Siri/i.test(n)) return 2+us;
  if(/Samantha|Ava|Allison|Aria|Jenny|Alex|Daniel|Karen|Moira/i.test(n)) return 3+us;
  return 5+us;
}
const isNatural=v=>vRank(v)<3;
function pickVoice(){
  enVoices=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang)).sort((a,b)=>vRank(a)-vRank(b)||a.name.localeCompare(b.name));
  const chosen=store.get('goi-voice');
  voice=(chosen&&enVoices.find(v=>v.voiceURI===chosen))||enVoices[0]||null;
  fillVoices();
}
function fillVoices(){
  const chosen=store.get('goi-voice')||'';
  const nat=enVoices.filter(isNatural), rest=enVoices.filter(v=>!isNatural(v));
  const opt=(v,star)=>`<option value="${esc(v.voiceURI)}">${star?'★ ':''}${esc(v.name+' ('+v.lang+')')}</option>`;
  const html='<option value="">（自動：'+esc(voice?voice.name:'既定')+'）</option>'+
    (nat.length?'<optgroup label="自然な音声">'+nat.map(v=>opt(v,1)).join('')+'</optgroup>':'')+
    (rest.length?'<optgroup label="その他の音声">'+rest.map(v=>opt(v,0)).join('')+'</optgroup>':'');
  document.querySelectorAll('select.vpick').forEach(sel=>{
    sel.innerHTML=html;
    sel.value=enVoices.some(v=>v.voiceURI===chosen)?chosen:'';
    sel.onchange=()=>{store.set('goi-voice',sel.value); pickVoice(); stop(); speak('Hello. This is my voice.');};
  });
}
if('speechSynthesis' in window){pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; setTimeout(pickVoice,500); setTimeout(pickVoice,1500);}
$('vtest').onclick=()=>{stop(); speak('Hello. Nice to meet you.');};
function speak(text,card,done){
  if(!('speechSynthesis' in window)){alert('このブラウザは読み上げに対応していません');return;}
  document.querySelectorAll('.card.playing').forEach(c=>c.classList.remove('playing'));
  const u=new SpeechSynthesisUtterance(text.replace(/[’‘]/g,"'").replace(/[“”]/g,'"'));
  u.lang='en-US'; if(voice) u.voice=voice; u.rate=slow?0.7:0.95;
  card&&card.classList.add('playing');
  u.onend=u.onerror=()=>{card&&card.classList.remove('playing'); done&&done();};
  speechSynthesis.speak(u);
}
function stop(){ if('speechSynthesis' in window) speechSynthesis.cancel(); document.querySelectorAll('.card.playing').forEach(c=>c.classList.remove('playing')); }
// routing: #g5/A  #g5/w=12  #g5/q=xxx
function route(){
  stop();
  const h=decodeURIComponent(location.hash.slice(1));
  const m=h.match(/^g([45])(?:\/(.*))?$/);
  cur=null;
  if(!m){ grade=null; renderGrades(); $('main').innerHTML='<p class="hint">上のボタンでレベルを選んでください。</p>'; store.set('tango-pos',''); return; }
  grade=m[1]; const rest=m[2]||'A';
  store.set('tango-pos', h);
  if(rest.startsWith('w=')){ const w=W()[Number(rest.slice(2))]; if(w){ cur=w; if(!query) letter=w.L; renderGrades(); renderAZ(); renderDetail(w); return; } }
  else if(rest.startsWith('q=')){ query=rest.slice(2); $('q').value=query; }
  else if(/^[A-Z]$/.test(rest)){ letter=rest; query=''; $('q').value=''; }
  renderGrades(); renderAZ(); renderList();
}
let qt;
$('q').addEventListener('input',e=>{clearTimeout(qt); qt=setTimeout(()=>{query=e.target.value.trim(); history.replaceState(null,'','#g'+grade+'/'+(query?'q='+encodeURIComponent(query):letter)); route();},150);});
window.addEventListener('hashchange',route);
function toTop(){ if (EMBED) parent.postMessage({ sub: true, t: "top" }, "*"); else window.scrollTo(0,0); }
if (EMBED) {
  const post = () => parent.postMessage({ sub: true, t: "h", h: Math.ceil(document.documentElement.getBoundingClientRect().height) }, "*");
  new ResizeObserver(post).observe(document.body); window.addEventListener("load", post);
  window.addEventListener("message", e => {
    const d = e.data || {};
    if (d.t === "theme") document.documentElement.dataset.theme = d.dark ? "dark" : "light";
    if (d.t === "stop") { try { stop(); } catch (er) {} }
  });
}
if (!location.hash) { const p=store.get('tango-pos'); if (p) history.replaceState(null,'','#'+p); }
route();
if (EMBED) parent.postMessage({ sub: true, t: "ready" }, "*");
</script>
</body>
</html>
