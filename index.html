<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>英会話のための基本英文法完全マスター｜グラマーチェック＋入れ替えドリル＋瞬間英作</title>
<style>
  :root{color-scheme:light;--bg:#F2F5FA;--panel:#FFFFFF;--ink:#1A2233;--ink-2:#4B5872;--ink-3:#7D8AA4;--rule:#D2DAE7;--red:#BE3527;--on-red:#FFFFFF}
  :root.dark{color-scheme:dark;--bg:#0F151E;--panel:#18212F;--ink:#E8EDF5;--ink-2:#AFBCD1;--ink-3:#7E8DA6;--rule:#2C3A4D;--red:#F0897B;--on-red:#170D0B}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif}
  body{display:flex;flex-direction:column}
  .bar{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px 14px;flex-wrap:wrap;
    padding:10px max(16px,env(safe-area-inset-left)) 10px max(16px,env(safe-area-inset-right));
    background:var(--panel);border-bottom:1px solid var(--rule)}
  .brand{font-weight:700;font-size:14px;letter-spacing:.06em;color:var(--ink-2)}
  .switch{display:inline-flex;padding:3px;border:1px solid var(--rule);border-radius:99px;background:var(--bg);max-width:100%;overflow-x:auto}
  .switch button{border:0;background:transparent;color:var(--ink-2);font:inherit;font-size:14px;font-weight:700;
    padding:7px 16px;border-radius:99px;cursor:pointer;white-space:nowrap;transition:background .15s,color .15s}
  .switch button:hover{color:var(--ink)}
  .switch button[aria-selected="true"]{background:var(--red);color:var(--on-red)}
  .switch button:focus-visible{outline:2px solid var(--red);outline-offset:2px}
  .stage{flex:1;position:relative;min-height:0}
  .stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
  .stage iframe[hidden]{display:none}
  .loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink-3);font-size:14px;letter-spacing:.08em}
  .loading[hidden]{display:none}
  @media (max-width:720px){.brand{display:none}.bar{justify-content:center}.switch button{padding:7px 11px;font-size:12.5px}}
</style>
</head>
<body>
<div class="bar">
  <span class="brand">英会話のための基本英文法完全マスター</span>
  <div class="switch" role="tablist" aria-label="モード切り替え">
    <button type="button" role="tab" id="tab-check" aria-selected="true" aria-controls="app-check">グラマーチェック</button>
    <button type="button" role="tab" id="tab-drill" aria-selected="false" aria-controls="app-drill">入れ替えドリル</button>
    <button type="button" role="tab" id="tab-speak" aria-selected="false" aria-controls="app-speak">瞬間英作</button>
  </div>
</div>
<div class="stage">
  <div class="loading" id="loading" hidden>読み込み中…</div>
  <iframe id="app-check" title="グラマーチェック"></iframe>
  <iframe id="app-drill" title="入れ替えドリル" hidden allow="autoplay"></iframe>
  <iframe id="app-speak" title="瞬間英作" hidden allow="autoplay"></iframe>
</div>
<script>
const APPS = {
  check: "check.html",
  drill: "drill.html",
  speak: "speak.html"
};
// 各アプリのダークモードの見分け方と切り替えボタン
const THEME = {
  check: { el: d => d.documentElement, dark: d => d.documentElement.getAttribute("data-app-theme") === "dark", btn: "#themeToggle", attrs: ["data-app-theme"] },
  drill: { el: d => d.body, dark: d => d.body.classList.contains("dark-mode"), btn: "#theme-toggle", attrs: ["class"] },
  speak: { el: d => d.documentElement, dark: d => d.documentElement.classList.contains("dark"), btn: "#theme-toggle", attrs: ["class"] }
};
const NAMES = Object.keys(APPS);
const frames = {}, tabs = {};
NAMES.forEach(n => { frames[n] = document.getElementById("app-" + n); tabs[n] = document.getElementById("tab-" + n); });
const loadingEl = document.getElementById("loading");
const loaded = {}, ready = {};
let current = null;
let wantDark = null;

function doc(n){ try { return frames[n].contentDocument; } catch (e) { return null; } }
function win(n){ try { return frames[n].contentWindow; } catch (e) { return null; } }

function load(n){
  if (loaded[n]) return;
  loaded[n] = true;
  loadingEl.hidden = false;
  frames[n].addEventListener("load", () => {
    ready[n] = true;
    if (current === n) loadingEl.hidden = true;
    setTimeout(() => watchTheme(n), 300);
  }, { once: true });
  frames[n].src = APPS[n];
}

function isDark(n){ const d = doc(n); if (!d || !d.body) return null; try { return THEME[n].dark(d); } catch (e) { return null; } }
function applyTheme(n){
  if (wantDark === null || !ready[n]) return;
  const d = isDark(n);
  if (d !== null && d !== wantDark) { const b = doc(n).querySelector(THEME[n].btn); if (b) b.click(); }
}
function watchTheme(n){
  const d = doc(n); if (!d) return;
  applyTheme(n);
  try {
    new MutationObserver(() => {
      const v = isDark(n);
      if (v === null || v === wantDark) return;
      wantDark = v;
      document.documentElement.classList.toggle("dark", v);
      NAMES.forEach(m => { if (m !== n) applyTheme(m); });
    }).observe(THEME[n].el(d), { attributes: true, attributeFilter: THEME[n].attrs });
  } catch (e) {}
}

// 非表示にするアプリの音声・自動再生を止める
function silence(n){
  if (!ready[n]) return;
  const w = win(n), d = doc(n);
  try {
    if (n === "drill") {
      const icon = d.getElementById("stop-icon");
      if (icon && !icon.classList.contains("hidden")) d.getElementById("play-pause-btn").click();
    }
    if (n === "speak") {
      const sb = d.getElementById("stop-btn");
      if (sb && !sb.disabled) sb.click();
    }
    w.__appMuted = true;
    w.__appPauseAll && w.__appPauseAll();
  } catch (e) {}
}

function show(n){
  if (n === current) return;
  if (current) silence(current);
  current = n;
  load(n);
  loadingEl.hidden = !!ready[n];
  try { const w = win(n); if (w) w.__appMuted = false; } catch (e) {}
  NAMES.forEach(m => {
    frames[m].hidden = m !== n;
    tabs[m].setAttribute("aria-selected", String(m === n));
  });
  try { history.replaceState(null, "", "#" + n); } catch (e) {}
}

NAMES.forEach(n => tabs[n].addEventListener("click", () => show(n)));
document.querySelector(".switch").addEventListener("keydown", e => {
  if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
  const i = NAMES.indexOf(current);
  const next = NAMES[(i + (e.key === "ArrowRight" ? 1 : NAMES.length - 1)) % NAMES.length];
  show(next); tabs[next].focus();
});

let start = "check";
try { const h = location.hash.replace("#", ""); if (APPS[h]) start = h; } catch (e) {}
show(start);
</script>
</body>
</html>
