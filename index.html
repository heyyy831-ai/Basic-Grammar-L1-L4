                    { ja: "あなたのルームメートは忙しそうだね、とルイーズが言った。(彼女には)たくさんの宿題があるんだと答えなさい。", en: "She has a lot of homework." },

                    { ja: "トムは授業料の高額な某私立大学に行くつもりだ、と友人が言った。(彼は)お金をたくさん持っているのか聞きなさい。", en: "Does he have much money?" },
                    { ja: "ホセがあなたに、新たに同じクラスになった生徒たちはどんな感じか聞いてきた。このクラスの全ての生徒は頭が良いよと答えなさい。", en: "Every student in this class is smart." },

                    { ja: "友人がしゃれたズボンを履いていた。そのズボン、いいねとコメントしなさい。", en: "Those pants are nice!" }

            {
                title: "Lesson 1-8",
                data: [
                    { ja: "友人があなたに、ミックはマーガレットを知っているかと聞いた。彼は彼女の友人だと答えなさい。", en: "He is friends with her." },
                    { ja: "ジュンが、ジェフはアリソンには何でもしてあげるようだね、と言った。ジェフはアリソンに恋しているからねと答えなさい。", en: "Jeff is in love with Allison." },
                    { ja: "ガラスのコップを床に落として割ってしまった。近くに来た友人に、それに気をつけるように言いなさい。", en: "Be careful with those." },
                    { ja: "友人があなたに、あなたのルームメートのヨシが今日学校に来なかったが、どうしたのか、と聞いた。彼は風邪をひいて寝ていると答えなさい。", en: "He is in bed with a cold." },
                    { ja: "昨日のパーティーはとても面白かった、とジョージが言った。それについて話してとジョージに言いなさい。", en: "Tell me about it." },
                    { ja: "クラスで問題が起こった。それについて話しましょうとクラスの皆に言いなさい。", en: "Let's talk about it." },
                    { ja: "ジュンがあなたに、あなたの友人のマシューは何歳ぐらいだろうか、と聞いた。彼は私と同じくらいの年齢だと答えなさい。", en: "He is about my age." },
                    { ja: "友人とアパレルショップに行った。気に入ったジャケットがあったので、その友人にこのジャケットをどう思うか聞きなさい。", en: "How about this jacket?" },
                    { ja: "友人があなたに、ジャネットは授業が終わってからいつもどこに行っているのか、と聞いた。彼女は放課後には図書館に行っていると言いなさい。", en: "She goes to the library after school." },
                    { ja: "今日ボウリングに行こう、とキムが誘ってきた。5時以降なら時間が空くと言いなさい。", en: "I'm free after 5:00." },
                    { ja: "ソンが、あなたの夫が何時ごろに家に帰ってくるか聞いた。(彼は)いつも8時前に帰ってくると言いなさい。", en: "Usually, he comes home before 8:00." },
                    { ja: "客が店員のあなたに、向こうに飾られているTシャツはいくらか、と聞いた。あれは100ドルを超えると答えなさい。", en: "That costs over $100." },
                    { ja: "ナタリーが、あなたの両親はどこに住んでいるのか、と聞いた。(彼らは)ファーストストリートの230番地に住んでいると答えなさい。", en: "They live at 230 First Street." },
                    { ja: "リズが、あなたはどこに住んでいるのか、と聞いた。明治通り沿いに住んでいると答えなさい。", en: "I live on Meiji Street." },
                    { ja: "マリアがあなたに、毎年、夏はどんなふうに過ごすのか、と聞いた。夏には海や山によく行くんだと答えなさい。", en: "I often go to the sea and the mountains in summer." },
                    { ja: "ヨンがあなたに、このドイツ製の高価なペンは、あなたのか、あなたのルームメートのトムのか、と聞いた。このペンは彼のだよと答えなさい。", en: "This pen is his." },
                    { ja: "ルームメートが、自分の今学期の成績がオールAだった、と言った。わー、それは素晴らしい! と言いなさい。", en: "Wow, it's great!" },
                    { ja: "金づちを使いながら、誤って指をたたいてしまった。痛い!と言いなさい。", en: "Ouch!" },
                    { ja: "カフェテリアで肘が他の生徒の体に当たった。あ、ごめん!と言いなさい。", en: "Oops, I'm sorry!" },
                    { ja: "ロナルドが断りもなくあなたのスマホを使っている。おい、俺のスマホを使うなよと言いなさい。", en: "Hey! Don't use my smartphone." },
                    { ja: "サリーがあなたに、果物を食べるか聞いた。どんな果物があるか聞きなさい。", en: "What fruit do you have?" },
                    { ja: "久しぶりにパンケーキを作ろうと、材料を買ってきた。ルームメートのジョンに、パンケーキが好きか聞きなさい。", en: "Do you like pancakes?" },
                    { ja: "新しいルームメートは、芸術については何でも知っているようだ。君は芸術に対して良い目を持っているんだねと言いなさい。", en: "You have a good eye for art." },
                    { ja: "春になり、キャンパス内にたくさんの花が咲いている。目の前に何とも美しい花が咲き誇っている。この花はとてもきれいだねとコメントしなさい。", en: "These flowers are very beautiful." },
                    { ja: "友人があなたに、何点取れば成績にAが付くか聞いた。80点以上がAだと答えなさい。", en: "Eighty points or over is A." },
                    { ja: "サリーに一人っ子の雰囲気を感じた。たぶん、きょうだいはいないだろうと予想しつつ、彼女のクラスメートに(彼女に)きょうだいがいるか聞きなさい。", en: "Does she have any brothers or sisters?" },
                    { ja: "トムがあなたに、調子が悪そうだね、と声をかけてきた。腹痛と熱があるんだと答えなさい。", en: "I have a stomachache and a fever." },
                    { ja: "ジャネットがあなたに、自宅ではどんな服装か聞いた。自宅では、いつもTシャツとジーンズを着ていると答えなさい。", en: "I usually wear a T-shirt and jeans at home." },
                    { ja: "ポールがあなたに、良いズボンをはいているね、と言った。このズボンはとても(値段が)高いんだよと言いなさい。", en: "These pants are very expensive." }
                ]
            },
            {
                title: "Lesson 1-9",
                data: [
                    { ja: "友人があなたに、あなたの弟は大学に通っているのか、と聞いた。弟は高校生だと言いなさい。", en: "My brother is a high school student." },
                    { ja: "ヨンが、ヨンのお姉さんは東京で仕事をしている、と言った。お姉さんは仕事は何をしているのか聞きなさい。", en: "What does your sister do?" },
                    { ja: "フランシスが、あなたのおじいさんとおばあさんは犬好きだねと言った。祖父母は犬を5匹飼っていると言いなさい。", en: "My grandparents have five dogs." },
                    { ja: "最近、カフェテリアで朝食を食べているジョンを見かけない。クラスでジョンに会ったとき、君は朝食は食べているの、と聞きなさい。", en: "Do you have breakfast?" },
                    { ja: "メイの犬好きは有名だね、と友人が言った。彼女は自分の犬を(複数)とてもかわいがっているよと言いなさい。", en: "She loves her dogs very much." },
                    { ja: "友人があなたに、いつもいつ宿題をやるのか聞いた。いつも夕食前に宿題をやると答えなさい。", en: "I do my homework before dinner." },
                    { ja: "あなたは、大学に進学したアンナに、久しぶりに会った。大学生活を楽しんでいるか聞きなさい。", en: "Do you enjoy college life?" },
                    { ja: "サリーが、自分は料理が好きだと言った。どのくらいの頻度で家で料理をするのか聞きなさい。", en: "How often do you cook at home?" },
                    { ja: "友人が、金曜日は履修科目が多く、前夜に行う予習が大変だと言った。金曜日には何クラス履修しているか聞きなさい。", en: "How many classes do you take on Friday?" },
                    { ja: "友人が、今日ジョージに会うと言った。なぜ、彼に会うのか聞きなさい。", en: "Why do you meet him?" },
                    { ja: "友人が、ボーイフレンドの英語が最近ずいぶん上達したと思う、と言った。(彼は)英語を猛勉強しているのかと聞きなさい。", en: "Does he study English very hard?" },
                    { ja: "あなたは、マリアが去年パリに行ったことを思い出した。マリアの友人に、彼女が今もパリに住んでいるのか聞きなさい。", en: "Is she living in Paris now?" },
                    { ja: "マリアは今、パリには住んでいないのだという。では、彼女は今どこに住んでいるのか聞きなさい。", en: "Where is she living now?" },
                    { ja: "トムがあなたに、マリーはまだ来ていないのかと聞いた。(彼女は)今まさに来るところだと答えなさい。", en: "She is coming right now." },
                    { ja: "リッチがあなたに、マギーは今どこにいるのかと聞いた。(彼女は)自分の部屋で音楽を聞いているよと答えなさい。", en: "She is listening to music in her room." },
                    { ja: "映画に誘おうと思い、ポールに電話をしたら、今忙しいという返事だった。君は今勉強しているの? と彼に聞きなさい。", en: "Are you studying now?" },
                    { ja: "パトリシアと出かけるために、ドアを出たところで彼女が来るのを待っていた。なかなか来ないので、彼女は何をもたもたしているのだろうか、と自分自身につぶやきなさい。", en: "What is taking her so long?" },
                    { ja: "郵便局への道が分からなくなった。近くを歩いていた人に、すみません、郵便局を探しているんですがと言いなさい。", en: "Excuse me. I'm looking for the post office." },
                    { ja: "あなたは自分の自転車を使いたかった。しかし、またあなたの妹が勝手にあなたの自転車で買い物に行ってしまった。友人に、彼女はいつも私の自転車を使うんだよねと、不満顔で言いなさい。", en: "She is always using my bike." },
                    { ja: "ルームメートのミンからの電話で、今どこにいるかあなたに聞いてきた。今、家に帰るところだと答えなさい。", en: "I'm on my way home." },
                    { ja: "チェリーが、珍しくあなたに親切にしてくれている。友人に、今日、彼女は(どういうわけか)親切なんだよねと言いなさい。", en: "She is being kind today." },
                    { ja: "友人があなたに、キムの病気はどんな具合か聞いた。(彼女は)今日は気分が良いよと答えなさい。", en: "She is feeling good today." },
                    { ja: "友人があなたに、ボブは寮から引っ越して一人で住んでいるのか、と聞いた。(彼は)今、彼の祖父母と住んでいるよ、と答えなさい。", en: "He is living with his grandparents now." },
                    { ja: "サリーが夕飯の準備ができたよ、と言った。すぐにそちらへ行くよと答えなさい。", en: "I'm coming!" },
                    { ja: "ペンを使いたいのに、自分のペンが見当たらない。メアリーのペンがテーブルの上に置いてある。メアリーにあなたのペンを使うよと言いなさい。", en: "I'm using your pen!" },
                    { ja: "サリーに道で会った。今あなたはどこに行くところ?と聞かれた。今、仕事に行くところだと答えなさい。", en: "I'm going to work now." },
                    { ja: "どうやって通勤しているのか、とジンに聞かれた。歩いて通勤しているよと答えなさい。", en: "I go to work on foot." }
                ]
            },
            {
                title: "Lesson 1-10",
                data: [
                    { ja: "友人があなたに、あなたのお母さんは英語が上手だねと言った。母は英語の先生だったんだよと言いなさい。", en: "My mother was an English teacher." },
                    { ja: "昨日なぜラマはパーティーに来なかったのか、と友人が言った。彼は昨日、仕事がとても忙しかったと言いなさい。", en: "He was very busy at work yesterday." },
                    { ja: "友人が、シェリーはとてもバスケットボールが上手だと言った。彼女はそのバスケットボールのチームに属していたのか聞きなさい。", en: "Was she on the basketball team?" },
                    { ja: "友人が物価が高くなったね〜と言った。うなずいて、去年はあまり高くなかったと言いなさい。", en: "Those weren't very expensive last year." },
                    { ja: "キムが先週末に初めて東京に行って来た、とあなたに言った。東京への旅行は楽しかったか聞きなさい。", en: "Was your trip to Tokyo fun?" },
                    { ja: "トムは珍しく宿題をしていない、と教室にいるあなたに言った。トムに昨日は忙しかったのか聞きなさい。", en: "Were you busy yesterday?" },
                    { ja: "友人が、高校では理科の授業が面白かったと言った。高校では誰が理科の先生だったか聞きなさい。", en: "Who was your science teacher in high school?" },
                    { ja: "友人が、高校ではよく勉強したと言った。その友人に高校ではどの授業が好きだったか聞きなさい。", en: "Which class was your favorite in high school?" },
                    { ja: "ルームメートのトムが早朝に帰ってきた。昨夜はどこにいたのか聞きなさい。", en: "Where were you last night?" },
                    { ja: "友人があなたに、自分の犬を見なかったかと聞いた。裏庭にいたことを伝えなさい。", en: "It was in the backyard." },
                    { ja: "電話であなたの友人が、大阪で行われる予定の野球の試合が中止になった、と言った。友人に大阪は昨日は雨だったのか聞きなさい。", en: "Was it rainy in Osaka yesterday?" },
                    { ja: "ソンの家に夜遅くまで滞在したあと、帰ろうと思って外に出たら、月明かりもなく真っ暗だった。なんて暗いんだと友人に言いなさい。", en: "How dark it is!" },
                    { ja: "起きて学校に行く準備をしなければならない時刻なのに、ルームメートがベッドに寝そべったままグズグズしている。外は明るいよ、目を覚ませと言いなさい。", en: "It is light outside. Wake up!" },
                    { ja: "友人の新居を訪ねている。その友人に、ここから大学までどのくらい時間がかかるか聞きなさい。", en: "How long does it take from here to your college?" },
                    { ja: "田舎に引っ越してからの生活はどんな具合?とリンゴが電話であなたに聞いた。自然が好きなあなたは、ここ、気に入っているよと答えなさい。", en: "I like it here." },
                    { ja: "友人があなたに、あなたの両親と祖父母はどこに住んでいるか聞いた。彼らはみな、京都に住んでいると答えなさい。", en: "They all are living in Kyoto." },
                    { ja: "あなたはギア氏に弟を紹介しようとしている。こちらはショウで、弟ですと紹介しなさい。", en: "This is Sho, my brother." },
                    { ja: "ナンシーがあなたに、あなたの妹は大学でうまくやっているか、と聞いた。彼女はとてもうまくやっているよと答えなさい。", en: "She is doing very well." },
                    { ja: "ルームメートが、あなたがどこで何をしているか電話で聞いてきた。今、カフェで勉強していると伝えなさい。", en: "I'm studying at the café right now." },
                    { ja: "トムがあなたに、ある情報がウェブサイトのどこにあるのか聞いた。スマホの画面にウェブサイトを表示して見せながら、そのサイトの、まさにここにあると答えなさい。", en: "It is right here on the website." },
                    { ja: "知り合いがあなたに、大阪の郊外に住んでいるのかと聞いた。大阪のど真ん中に住んでいると答えなさい。", en: "I live right in the center of Osaka." },
                    { ja: "体育館に入ったら寒くて震えるほどだ。ここはかなり寒いねと言いなさい。", en: "It is pretty cold here." },
                    { ja: "友人が、あなたのルームメートのキョウコは就寝が早いね、と言った。彼女は朝起きるのが早いんだよと言いなさい。", en: "She gets up early in the morning." },
                    { ja: "友人があなたに何時に夕食を食べているかと聞いた。あなたは毎晩7時に夕食を食べていると答えなさい。", en: "I eat dinner at seven every evening." },
                    { ja: "チェンが、あなたに会いたいと言ってきた。明日の午前に私のオフィスに来てと言いなさい。", en: "Come to my office tomorrow morning." },
                    { ja: "知人が、体の調子が悪いので医者に診てもらわなければ、と言った。君は酒を飲み過ぎるんだよと言いなさい。", en: "You drink too much." },
                    { ja: "ミックが、あのパソコンがとても安いので買おうかな、と言った。あれは安すぎるよとコメントしなさい。", en: "That is too cheap." },
                    { ja: "友人が、あなたの顔色が悪いと言った。あまり気分が良くないと言いなさい。", en: "I don't feel too well." }
                ]
            },
            {
                title: "Lesson 1-11",
                data: [
                    { ja: "友人の獣医師に、ペットを飼った経験があるか聞かれた。以前、犬を2匹飼っていたと答えなさい。", en: "I had two dogs before." },
                    { ja: "友人があなたに、おなかが空いているようだね、と言った。今朝、朝食を食べなかったと言いなさい。", en: "I didn't have breakfast this morning." },
                    { ja: "同僚があなたに、見かけない男性が働いているねと言った。彼は昨年は在宅勤務だったと答えなさい。", en: "He worked from home last year." },
                    { ja: "中国語が流暢な女子学生がいて、大学で学んだにしては中国語が上手だね、と友人が言った。彼女は去年、中国で中国語を勉強したんだよと答えなさい。", en: "She studied Chinese in China last year." },
                    { ja: "あなたは高校時代、バス通学だったの? と友人に聞かれた。高校には自転車で行っていたと伝えなさい。", en: "I went to high school by bike." },
                    { ja: "友人が、ジュンの英語はとても流暢だね、と言った。彼女は高校で英語を一生懸命に勉強したからねと言いなさい。", en: "She didn't study English hard at high school." },
                    { ja: "新たに男性社員が入社してきた。同僚があなたに、彼の以前の仕事は何だったのか、と聞いた。彼は学校で数学を5年間教えていたんだと言いなさい。", en: "He taught math for five years at a school." },
                    { ja: "あなたの友人が、先週神戸に行ったと言った。電車で神戸に行ったのか聞きなさい。", en: "Did you go to Kobe by train?" },
                    { ja: "友人が、ゆうべはオリンピックの試合を午前4時に見終わり、それから寝た、と言った。今朝は何時に起きたのか聞きなさい。", en: "What time did you get up this morning?" },
                    { ja: "友人が、あなたとルームメートのミックは昨日のパーティーに行ったか、と聞いた。彼は昨夜のパーティーには行っていないと答えなさい。", en: "He didn't go to school by bike in rainy days." },
                    { ja: "友人が、ロサンゼルスに行ってきた、と言った。どうやってロサンゼルスに行ったのか聞きなさい。", en: "How did you go to Los Angeles?" },
                    { ja: "ルームメートが早朝に帰ってきた。昨夜どこに行っていたのか聞きなさい。", en: "Where did you go yesterday?" },
                    { ja: "友人があなたに、週末どこに行ったのか聞いた。金沢に行ったと答えなさい。", en: "-I went to Kanazawa." },
                    { ja: "日曜日に自宅の庭でバーベキューパーティーを行う予定だ。知り合いのトムに、日曜日にここに来られるか聞きなさい。", en: "Can you come here on Sunday?" },
                    { ja: "あなたの隣の田中さんのところにオーストラリアから女子高生がホームステイに来た。彼女は日本語がしゃべれるか聞きなさい。", en: "Does she speak Japanese?" },
                    { ja: "友だちが自分の母親に電話したいが、自宅にスマホを忘れてしまったという。あなたのスマホを使っていいと言いなさい。", en: "You can use my smartphone." },
                    { ja: "インターナショナルスクールの教員のあなたは、子供たちが廊下を走っているのを見た。ここで走っちゃだめだよと言いなさい。", en: "You can't run here." },
                    { ja: "この地域は夏に暑いのか、と聞かれた。このエリアは夏はとても暑くなる可能性があるよと言いなさい。", en: "Summer can be very hot in this area." },
                    { ja: "あなたは医者として患者さんとその人の病気について話している。その患者さんに一般的にこの病気はシリアスになる(重症化する)可能性があると言いなさい。", en: "This illness can be serious." },
                    { ja: "あなたと友人は、ジェイソンが出場するアメリカンフットボールの試合を見に行った。その友人が、あれがジェイソン? と聞いた。ジェイソンはもっと小柄なので、ジェイソンであるはずはないよと答えなさい。", en: "That can't be Jason." },
                    { ja: "友人に相談があり、その友人に今夜会えるか、丁寧に聞きなさい。", en: "Could I see you tonight?" },
                    { ja: "あなたには、明日はたくさん買い物をする必要がある。車を持っている友人に、明日お店に一緒に行ってくれる? と丁寧に聞きなさい。", en: "Could you come with me to the store tomorrow?" },
                    { ja: "友人があなたに、午後にジムに行ったのかと聞いた。午後にそこに行くことはできなかったと答えなさい。", en: "I couldn't go there this afternoon." },
                    { ja: "友人から、あなたの祖父はお金持ちなんだってね、と言われた。祖父の家は大きくてプールがあると言いなさい。", en: "My grandpa's house is large and has a pool." },
                    { ja: "ルームメートのマリアが、あなたの机の上にある時計を指でさして、誰の時計?と聞いた。これは弟の時計だと答えなさい。", en: "This is my brother's watch." },
                    { ja: "友人に道でばったり会い、今どこに行くところか聞かれた。歯医者に行くところだと言いなさい。", en: "I'm going to the dentist's." },
                    { ja: "知り合いに、こちらは友人のジェイソンですと紹介しなさい。", en: "This is my friend, Jason." },
                    { ja: "友人があなたに、ジェリーと知り合いなのかと聞いた。ジェリーは知っているよ。(彼は)友人の一人だよと答えなさい。", en: "I know Jerry. He is a friend of mine." },
                    { ja: "ジュリアが怪我をしたと聞いたけど、とあなたの友人が言った。彼女は父親の車で事故を起こしてしまったと答えなさい。", en: "She had an accident with her father's car." }
                ]
            },
            {
                title: "Lesson 2-1",
                data: [
                    { ja: "友人があなたの家を訪ねてきて、車をどこに止めればいいかと聞いてきた。車庫の前に止めていいよと答えなさい。", en: "You may park in front of the garage." },
                    { ja: "あなたは担当教授のオフィスの、開いたドアの前にいる。入ってよろしいですかと聞きなさい", en: "May I come in?" },
                    { ja: "あなたは寮に住む友人を訪ね、彼の部屋の開いたドアの前にいる。入っていいかと聞きなさい。", en: "Can I come in?" },
                    { ja: "急に雨が降り出した。ソンさんに、あの傘をお借りしてもいいですかと聞きなさい。", en: "May I borrow that umbrella?" },
                    { ja: "スミス家でのクリスマスパーティーに招かれた。スミス家の人に、お手洗いをお借りできますかと聞きなさい。", en: "May I use your bathroom, please?" },
                    { ja: "あなたのスタディーグループが、図書館に集まることになっている。ジョンは来るのか、とメンバーの一人に聞かれた。ジョンは遅れるかもしれないと答えなさい。", en: "John may be late." },
                    { ja: "友人があなたに、あなたのルームメートのサリーは今日学校に来るのか、と聞いた。(彼女は)今日はたぶん来ないだろうと答えなさい。", en: "She may not come today." },
                    { ja: "最近、急に寒くなってきた。ルームメートに(ひょっとすると)今夜は雪が降るかもしれないとコメントしなさい。", en: "It might snow tonight." },
                    { ja: "ルームメートが、チェンが自分から教科書を借りたまま、まだ返してくれていない、と言った彼は(ひょっとすると返却しに)明日来るかもしれないと言いなさい。", en: "He might come tomorrow." },
                    { ja: "ルームメートが、夜に図書館に行くけれど傘を持って行ったほうがいいかな、とあなたに聞いた。うなずいて今夜は雪が降るよと言いなさい。", en: "It will snow tonight." },
                    { ja: "ルームメートがあなたに、図書館に行くけれど、夜には雪が降るかなと聞いた。いや、今夜雪は降らないよと答えなさい。", en: "No, it won't snow tonight." },
                    { ja: "友人があなたに、仕事で車で遠出する予定だが、明日は雪が降るかなと聞いた。明日、雪は降らないかもしれないと答えなさい。", en: "It may not snow tomorrow." },
                    { ja: "ルームメートが、部屋をなるべく清潔にしておこうよ、と言ってきた。分かった、そうするよと答えなさい。", en: "OK. I will do so." },
                    { ja: "初めて行ったレストランで、サービスが悪くて嫌な思いをした。一緒に行った友人に、あのレストランには二度と行かないと言いなさい。", en: "I won't go to that restaurant again." },
                    { ja: "あなたはルームメートのナタリーと一緒に、寮の部屋に帰ってきた。ところが、どうしても部屋のドアが開かない。このドアの鍵どうしても開かないよ!とナタリーに言いなさい。", en: "This door won't unlock!" },
                    { ja: "家具を動かすのに助けが必要になった。ルームメートに、来て私を手伝ってくれと頼みなさい。", en: "Will you come and help me?" },
                    { ja: "友人が、あなたの飛行機は何時に出発するのか聞いた。飛行機は今夜9時発だと答えなさい。", en: "My plane leaves at nine tonight." },
                    { ja: "ルームメートがあなたに、明日は何コマ授業があるのか聞いた。明日は授業が6コマあると答えなさい。", en: "I have six classes tomorrow." },
                    { ja: "友人があなたに、ヨンは彼女といつ結婚するんだろうと聞いた。彼は彼女と来月に結婚するつもりだと言いなさい。", en: "He is going to marry her next month." },
                    { ja: "マリアがあなたに、来月のミーティングについて、いつカルロスに連絡するのか聞いた。昼食の後に彼に電話するつもりだと答えなさい。", en: "I'm going to call him after lunch." },
                    { ja: "急に黒い雲が出てきて、遠くで雷が鳴り出した。一緒にいる友人に、雨になりそうだねと言いなさい。", en: "It's going to rain." },
                    { ja: "ヨンがあなたに、マリーの赤ちゃんはいつ生まれるのか聞いた。彼女の赤ちゃんは今週にも生まれそうだねと答えなさい。", en: "She is going to have a baby this week." },
                    { ja: "マイケルがあなたに、今夜はどんな予定なのか聞いた。今夜は友人たちと一緒にお酒を飲む予定だと言いなさい。", en: "I'm drinking with my friends tonight." },
                    { ja: "朝は出かけるつもりだと、あなたのルームメートが言った。今朝のいつごろ出かける予定なのか聞きなさい。", en: "When are you going out this morning?" },
                    { ja: "あなたはホテルのフロントにいる。担当者に、チェックアウトをお願いしますと言いなさい。", en: "I'm checking out." },
                    { ja: "友人に、あなたのお父さんは若そうに見えるが何歳なのか、と聞かれた。父は来月60歳になると答えなさい。", en: "My father will be sixty next month." },
                    { ja: "ルームメートのビルとあなたは、共通の知人から明日のバーベキューパーティーに誘われた。(ひょっとすると)私と彼は明日ボストンに行くかもしれない、とその誘いを断りなさい。", en: "He and I might go to Boston tomorrow." },
                    { ja: "レストランでウェートレスに、ご注文は何にするか、と聞かれた。パスタにします、と答えなさい。", en: "I will have pasta." },
                    { ja: "ルームメートのカレンがサッカーで足を捻挫した。友人のビルが心配してカレンの様子を聞いてきた。彼女は大丈夫だと言いなさい。", en: "She will be OK." },
                    { ja: "あなたのルームメートは悲観主義者で、いつも俺はだめだと言っている。自分のことをそんなふうに言うものではないよと言いなさい。", en: "Don't talk about yourself like that." },
                    { ja: "大きなプロジェクトをやり終えた。友人に、誰と組んでやったのか聞かれた。自分一人でやったと答えなさい。", en: "I did it by myself." },
                    { ja: "友人が遠くからあなたを訪ねてやって来た。くつろいでくれと言いなさい。", en: "Please make yourself at home." }
                ]
            },
            {
                title: "Lesson 2-2",
                data: [
                    { ja: "勝手に私の自転車を使わないで、と友人に言ってあったのに、その友人がまた自転車を無断で使った。それについて言ってなかったっけ?と言いなさい。", en: "Didn't I tell you about it?" },
                    { ja: "あなたは今日、ルームメートと外で昼食を取るつもりでいた。しかし、昼時になってもルームメートは出かける素ぶりを見せない。(私たちは)昼食に出かけるんじゃないの?と聞きなさい。", en: "Aren't we going out for lunch?" },
                    { ja: "友人に新しく日本から来たリサを紹介したい。その友人に、あなたはリサを知らないよね? と確かめなさい。", en: "You don't know Lisa, do you?" },
                    { ja: "部屋のベッドを動かしたい。ジョゼフに来て手伝ってくれる?と頼みなさい。", en: "Come and help me, won't you?" },
                    { ja: "友人が最近、非常に忙しそうにしている。テストがあるの? 違う? と聞きなさい。", en: "You have a test, no?" },
                    { ja: "大学で上映される映画を見に行く予定にしている。ルームメートのジェニーも一緒に行ってほしいが、どうも彼女は映画が好きでないようだ。ジェニーに一応、あなたは行く予定ではないよね、正しい? と聞きなさい。", en: "You aren't going, right?" },
                    { ja: "お客さんに飲み物を出したい。コーヒーがいいか紅茶がいいか聞きなさい。", en: "Would you like coffee or tea?" },
                    { ja: "暑い日に、お客さんに冷たい飲み物を出したい。どれがいいですか? 炭酸飲料、ジュース、それとも水がいいですか? と聞きなさい。", en: "Which would you like, soda, juice, or water?" },
                    { ja: "パーティーに参加し、だいぶ遅くなってきた。あなたと一緒に来ていたマリアに、行きましょうか、と帰宅をうながしなさい。", en: "Shall we go?" },
                    { ja: "部屋にたくさんの人が入ってきて、息苦しく感じられ始めた。窓を開けましょうかと提案しなさい。", en: "Shall I open the window?" },
                    { ja: "次の日曜日に買い物に行きたいと思っている。ルームメートのメグに、ショッピングセンターに行かないかと誘いなさい。", en: "Let's go to the mall, shall we?" },
                    { ja: "あなたは財布をなくしてしまった。友人に財布をなくした! どうしよう? と言いなさい。", en: "I lost my wallet! What shall I do?" },
                    { ja: "ルームメートの机の上に返却期限を過ぎた図書館の本があった。その本を、大学の図書館に返すべきだよと言いなさい。", en: "You should return the book to the college's library." },
                    { ja: "図書館で静かに勉強していたら、2人の生徒が大きな声で話しながら入ってきた。そんなに大声で話さないほうがいいよと言いなさい。", en: "You shouldn't speak so loudly." },
                    { ja: "ホセとジェイミーを、友人と待っている。なかなか来ないね、と友人が言った。彼らは5時までには来るはずだと答えなさい。", en: "They should come by five." },
                    { ja: "トムはしょっちゅう、あなたたち夫妻に何かを頼んでくる。しかし、あなたたちが彼に何かを頼むと、いつも断られる。今日、また彼があなたたちに頼み事を持ってきた。どうして私たちがあなたを手伝わなければならないのよと言いなさい。", en: "Why should we help you?" },
                    { ja: "キムがあなたに、マイクって良い人だと思うけど、どう?と聞いた。まあ、そう思うと答えなさい。", en: "I should think so." },
                    { ja: "ポールはよく学校の規則を破って先生にしかられている。彼はそのルールを守るべきだと言いなさい。", en: "He must follow the rule." },
                    { ja: "あなたはテレビで天気予報を見ている。明日以降冷え込むという予想が出ている。あなたのルームメートのマリオに、明日は雪かもしれないと言いなさい。", en: "It may snow tomorrow." },
                    { ja: "ロザンナがあなたに、日本では何歳から運転免許が取れるの? 16歳から? と聞いた。運転免許は18歳以上でないと取れないと答えなさい。", en: "You must be eighteen or over for this license." },
                    { ja: "トムが、マリーと婚約したと言った。うそでしょう! と言って驚きを伝えなさい。", en: "You must be joking!" },
                    { ja: "メリルが、ケンとあなたはなかなか英語が上手だ、と褒めてくれた。私たちは中学と高校で英語を猛勉強しなければならなかったと答えなさい。", en: "We had to study English very hard in junior high school and high school." },
                    { ja: "トムがあるテストを受けるつもりだ、とスザンナが言った。彼はいつそのテストを受けなければならないのか聞きなさい。", en: "When does he have to take the test?" },
                    { ja: "リサがあなたに、あなたのおばあさんが昨日あなたのアパートに来たんだってね、と聞いた。うなずいて、祖母は私に誕生日のプレゼントをくれたんだと言いなさい。", en: "My grandmother gave me a birthday present." },
                    { ja: "昨日どうしてジョーが来たのか、とマリーがあなたに聞いた。私の誕生日で、彼はお花を持って来てくれたんだと答えなさい。", en: "He brought me some flowers." },
                    { ja: "友人があなたに、スミスさんはあなたに写真を見せていたよね。何の写真だったの?と聞いた。スミスさんは娘さんの写真を見せてくれたと答えなさい。", en: "Mr. Smith showed me his daughter's picture." },
                    { ja: "あなたが、ある女性にあいさつした。後で、キムがあなたにあの人はどういう人なの、と聞いた。彼女は私に英語を教えてくれたと言いなさい。", en: "She taught me English." },
                    { ja: "友人が、自分はとても歌が得意で、中学ではコーラス部にいた、と言った。私たちに1曲歌って聞かせてと頼みなさい。", en: "Please sing us a song." }
                ]
            },
            {
                title: "Lesson 2-3",
                data: [
                    { ja: "医学部の学生は大学生活が長いね、と友人が言った。医者になるには長い時間がかかるんだよと言いなさい。", en: "To become a doctor takes a lot of time." },
                    { ja: "友人があなたに、来るべきプレゼンテーションの準備についての話し合いはいつがいいか、と聞いた。今夜それをやりたいと言いなさい。", en: "I want to do it tonight." },
                    { ja: "あなたの友人がロサンゼルスに行くことになり、どこを観光すればいいか聞いて来た。まず、ロサンゼルスには見所がたくさんあるよと言いなさい。", en: "There are a lot of things to see in Los Angeles." },
                    { ja: "友人が、リズはおっちょこちょいで、それでいつも失敗していると言った。彼女は立ち止まって考えることをしないからねと答えなさい。", en: "She never stops to think." },
                    { ja: "学校に待望のCALL 教室ができることになった。とても喜んだあなたは、それを聞いてとても幸せだ、とコメントしなさい。", en: "I'm very happy to hear that news." },
                    { ja: "キャンプに出かけ、あなたの友人が歩いて川を渡ろうとした。急に深くなる場所があることを知っているあなたは、その川を渡るのは危険だよと警告しなさい。", en: "The river is dangerous to cross." },
                    { ja: "ルームメートのジョゼフがあなたとあなたのガールフレンドに、出かける準備はできているか、と聞いた。私たちは出かける準備ができていると答えなさい。", en: "We are ready to go." },
                    { ja: "近所の女の子が先週、交通事故で足を怪我した。友人があなたに、もうその子は歩いて学校に行っているのか聞いた。その女の子はまだ歩けないよと言いなさい。", en: "The girl can't walk yet." },
                    { ja: "先週末あなたはコロラドに行く予定だったが大雪のために中止した。友人かあなたに、コロラド旅行はどうだったか聞いた。そこには行くことができなかったんだと答えなさい。", en: "I wasn't able to go there." },
                    { ja: "あなたは駅で友人と電車を待っている。ほどなく電車が近づいてきた。自分たちが乗ろうとしている電車らしい。あれは自分たちの電車に違いないと言いなさい。", en: "That must be our train." },
                    { ja: "チェリーが、お姉さん夫婦が子育てで大変だと言った。子供たちは気難しくなることがあるからねと言いなさい。", en: "Kids can be difficult." },
                    { ja: "女性が歩いている。リリアンが、あれはあなたのお母さんだよ、と言った。しかし、あなたのお母さんは今、この付近にはいないはずだ。私の母であるはずはないよと言いなさい。", en: "That can't be my mother." },
                    { ja: "天気予報によると雪が降るとのことで、ルームメートとあなたは傘を持って出た。空模様を見ると、降らないようにも思える。(ひょっとすると)雪は降らないかもしれないねと言いなさい。", en: "It might not snow." },
                    { ja: "先週あなたは、気分がすぐれず学校を休んだ。友人があなたを見て、元気になったか聞いてきた。気分はいいよと答えなさい。", en: "I feel good." },
                    { ja: "ロックコンサートに友人と行った。あるダンサーの踊りが素晴らしい。友人にあのダンサーはとても格好いいねと言いなさい。", en: "The dancer looks very cool." },
                    { ja: "ジェニファーに授業で会ったら、ニコニコしている。他のクラスメートに彼女は今日、幸せそうねと言いなさい。", en: "She looks happy today." },
                    { ja: "タイ料理のレストランで、友人の注文したスープが運ばれてきた。そのスープはおいしそうな匂いがするねとコメントしなさい。", en: "The soup smells delicious." },
                    { ja: "久しぶりに会ったトムが、元気のない声で話している。疲れているようだねとコメントしなさい。", en: "You sound tired." },
                    { ja: "ルームメートがあなたに、今朝はソワソワしているねと言った。テストの前は緊張するんだと言いなさい。", en: "I get nervous before tests." },
                    { ja: "ルームメートのヨンが、夜遅くなってからおなかが空いたと言い、何か食べるものはあるかなと冷蔵庫を見た。冷蔵庫にケーキがあるよと言いなさい。", en: "There's some cake in the fridge." },
                    { ja: "ホセと一緒に歩いていると、スーザンが歩いている姿が見えた。スーザンがあそこを歩いているよと言いなさい。", en: "There goes Susan!" },
                    { ja: "遠くに学校が見える。マリアは通う学校を決めたのだろうかと、とウェイが言った。彼女はたぶん、あの学校に行くよと答えなさい。", en: "Maybe she will go to that school." },
                    { ja: "サラは時間にルーズな生徒。キムがあなたに、サラが学校に来たか聞いた。彼女はいつものとおり、学校に遅れて来たよと答えなさい。", en: "As usual, she came to school late." },
                    { ja: "オーストラリアのスーパーマーケットで醤油が売られているのを見かけた。オーストラリアの友人に、あれ(醤油)は英語で何と呼ばれているのか聞きなさい。", en: "What do you call that in English?" },
                    { ja: "友人に、明日少し手伝ってほしいことがあると言ったのだが、明日はあまり時間がないとの返事。手間は取らせないからと言いなさい。", en: "I won't keep you long." },
                    { ja: "マリオがあなたに、来週どこかへ出かけようかと誘ってきた。来週はやることがたくさんあると答えなさい。", en: "I have many things to do next week." },
                    { ja: "マリーが、あなたは将来何になりたいか聞いた。私はエンジニアになりたいと答えなさい。", en: "I want to be an engineer." }
                ]
            },
            {
                title: "Lesson 2-4",
                data: [
                    { ja: "友人が遊びに来て、あなたが野球のカードを整理しているところを見た。野球のカードの収集は楽しいと言いなさい。", en: "Collecting baseball cards is fun." },
                    { ja: "トーマスが、庭の木が大きくなり過ぎたので、切り倒すつもりだと言った。素人が木を切るのはちょっと心配なので、木を切るのは危険だよとコメントしなさい。", en: "Cutting down trees is dangerous." },
                    { ja: "文化祭でミックのクラスはダンスを披露するということだった。友人があなたに、ミックはダンスがうまいのか、と聞いた。彼のダンスは素晴らしいと言いなさい。", en: "His dancing is great." },
                    { ja: "知り合いがあなたに、ルームメートのジョニーはどんな趣味を持っているか聞いた。彼の趣味の一つは読書だよと答えなさい。", en: "One of his hobbies is reading books." },
                    { ja: "あなたは健康そのもの。ホセがあなたに、健康を保つ秘訣は何だろうか、と聞いた。重要なことは健康的な食事と運動だよと答えなさい。", en: "The important thing is eating healthily and exercising." },
                    { ja: "ヨンが、あなたたちはよく外食しているね、と言った。私たちは家で食事をするのが好きではないんだと答えなさい。", en: "We don't like eating at home." },
                    { ja: "久しぶりにミンに会ったら、髪を伸ばし放題で、どこかむさ苦しい感じになっていた。隣にいたあなたの友人に、彼の髪は切る必要があるねと言いなさい。", en: "His hair needs cutting." },
                    { ja: "どうして、寒いのに窓を開けて外を見ていたの、とルームメートが聞いた。木で(1羽の)鳥が鳴いているのを聞いていたんだと言いなさい。", en: "I heard the singing of a bird in a tree." },
                    { ja: "はるばる友人が手伝いに来てくれた。今日は来て手伝ってくれてありがとうと言いなさい。", en: "Thank you for coming and helping me today." },
                    { ja: "ボブがある本の話をした。(私は)その本を買おうとしていることを思い出したと言いなさい。", en: "I remembered to buy the book." },
                    { ja: "あなたは大学院に入学後、あなたのアカデミックアドバイザーに初めて会った。初めましてと言いなさい。", en: "Nice to meet you." },
                    { ja: "大学院のあなたのアカデミックアドバイザーとの話が終わり、別れ際に、お会いできて良かったですと言いなさい。", en: "Nice meeting you." },
                    { ja: "久しぶりに友人から電話があった。あなたはその友人が懐かしくなって、また会いたいと言いなさい。", en: "I hope to see you again." },
                    { ja: "友人があなたに、向こうにいる男性を知っているか、と聞いた。以前、会ったことを覚えていると言いなさい。", en: "I remember seeing him before." },
                    { ja: "海外から日本へ来たお客さんが、箸を使って日本料理を食べている。日本料理を楽しんでいるか聞きなさい。", en: "Do you enjoy eating Japanese food?" },
                    { ja: "クラスメートのトムが、スミス教授のクラスのリサーチペーパーの進み具合はどう? と聞いた。それは昨日終わらせた、と言いなさい。", en: "I finished doing it yesterday." },
                    { ja: "友人があなたに、最近タナカ氏は顔色がいいねと言った。うなずいて、彼は禁煙したんだよと言いなさい。", en: "He gave up smoking." },
                    { ja: "授業中に、クラスメートの2人がおしゃべりをやめない。授業中にはおしゃべりをやめてと言いなさい。", en: "Stop talking in the class!" },
                    { ja: "キムがあなたに、トヨタ家の人たちは映画を見るのが好きみたいだね、と言った。うなずいて、トヨタさん一家は映画に行くのが好きなんだと答えなさい。", en: "The Toyotas love to go / going to the movies." },
                    { ja: "ナタリーと寮に帰ろうとして、外に出たら雪が降り始めた。雪が降り始めたよとナタリーに言いなさい。", en: "It started to snow / snowing." },
                    { ja: "友人があなたに、寮を出て今ホームステイしているんだって? ホストマザーとファーザーはどんな人?と聞いた。ご主人は(彼)は小学校の先生で奥さんもそうだよと答えなさい。", en: "He is an elementary school teacher, and his wife is too." },
                    { ja: "友人があなたに、あなたのお兄さんとお姉さんはどこに住んでいるのか、と聞いた。兄は神戸在住で、姉は奈良在住だと答えなさい。", en: "My brother lives in Kobe and my sister in Nara." },
                    { ja: "ジョージが、転校生のサラの印象を聞いてきた。彼女は良い人だね、もしくはそう見えるだけなのかと答えなさい。", en: "She is a nice person, or she seems to be." },
                    { ja: "ルームメートと映画館に出かけようとしているが、そのルームメートが支度に手間取っている。急いで、じゃないと(私たち)遅れるよと言いなさい。", en: "Hurry up, or we will be late." },
                    { ja: "今日ジェリーと彼女のアパートでクラスのグループワークについて話すんじゃなかったのかと友人が聞いてきた。彼女と話したかったんだけど、そこにいなかったんだと言いなさい。", en: "I wanted to talk to her, but she wasn't there." },
                    { ja: "友人があなたに、とうとう宿題が全部は終わらなかったのか、と聞いた。一生懸命やったけど、終えられなかったと言いなさい。", en: "I tried hard, but I couldn't finish it." },
                    { ja: "友人があなたに、その数学の宿題を終わらせないといけないよ、と言った。でも、多すぎるからと言いなさい。", en: "- But it's too much." },
                    { ja: "あなたはバス停を探しているが、なかなか見つからない。通りかかった親切そうな女性にすみませんが、バス停への道順を教えてくださいと頼みなさい。", en: "Excuse me, but could you tell me the way to the bus stop?" }
                ]
            },
            {
                title: "Lesson 2-5",
                data: [
                    { ja: "落胆した様子であなたは寮に帰った。あなたのルームメートがそれを見てどうしたのかとあなたに聞いた。図書館で誰かが私のコンピューターを盗んだんだ、と言いなさい。", en: "Someone stole my computer at the library." },
                    { ja: "落胆した様子であなたは寮に帰った。あなたのルームメートがそれを見てどうしたのかとあなたに聞いた。図書館で私のコンピューターが盗まれた、と言いなさい。", en: "My computer was stolen by someone at the library." },
                    { ja: "大入りの会議の場で、やっと1つ誰も座っていない椅子を見つけた。この席には誰か座るのかとその横に座っている人に聞きなさい。", en: "Is this seat taken?" },
                    { ja: "あなたの知り合いがあなたにこの国は留学生が多いね、と言った。この国では大学で英語が広く使われているんだよと答えなさい。", en: "English is widely used at colleges in this country." },
                    { ja: "友人があなたに、おじいさんは入学祝いに何かくれたのか、と聞いた。祖父はこの時計をくれたんだと答えなさい。", en: "My grandfather gave me the watch." },
                    { ja: "友人があなたに、おじいさんは入学祝いに何かくれたのか、と聞いた。私は祖父にこの時計をもらったんだと答えなさい。", en: "I was given the watch by my grandfather." },
                    { ja: "あなたの新しい時計を見た友人が、「その時計どうしたの? 買ったの?」と聞いてきた。この時計は祖父からもらったものだと答えなさい。", en: "The watch was given to me by my grandfather." },
                    { ja: "あなたの車のドアに少しへこみがある。それを見た友人が、どうしたのか、と聞いた。今朝、自転車に当てられちゃったと答えなさい。", en: "I got hit by a bike this morning." },
                    { ja: "あなたたちはローズをどう思うか、とトムが聞いてきた。私たちは彼女をとても親切だと思っていると答えなさい。", en: "We consider her very kind." },
                    { ja: "マリアがあなたに、彼女はクラブでどう思われているか聞いてきた。彼女はとても親切だと思われていると答えなさい。", en: "She is considered very kind." },
                    { ja: "あなたの会社の新製品の売れ行きはどう、と友人が聞いた。この製品はよく売れているよと答えなさい。", en: "This product is selling well." },
                    { ja: "友人があなたに、いつもそのタブレットを使っているね、と言った。このタブレットはとても役に立つからねと答えなさい。", en: "This tablet works well." },
                    { ja: "ビーチからジョンが帰ってきた。1日で彼の白い肌がかなり日焼けをしていた。友人に、彼の肌は日焼けしやすいねと言いなさい。", en: "His skin burns easily." },
                    { ja: "友人が、あなたが手に持っている薄いテキストブックを指差して、そのテキストを使うクラスは週に何回あるのか、と聞いた。このクラスは週に3回だよと答えなさい。", en: "This class meets three times a week." },
                    { ja: "メイが果物を買ってきた。早く食べたほうがいいよ、という意味で、この果物は長くは持たないよと言いなさい。", en: "This fruit won't keep long." },
                    { ja: "トムが、リンダは今どうしているか電話で聞いてきた。リンダは今図書館で勉強しているよと答えなさい。", en: "Linda is studying at the library now." },
                    { ja: "友人があなたに、リリーはロ下手だし人付き合いが悪いのに、どうしてあなたはリリーのことが好きなのか、と聞いた。(自分にとって)リリーはとても面白いと答えなさい。", en: "Lilly is very interesting to me." },
                    { ja: "友人があなたに、あなたのルームメートのサリーはどの学問に興味があるのか聞いた。サリーは数学に興味があると答えなさい。", en: "Sally is interested in math." },
                    { ja: "新しい女子生徒の印象をトムに聞かれた。私にはとてもチャーミングな女の子のように見えたと答えなさい。", en: "She seemed a very charming girl to me." },
                    { ja: "車の事故があった。原因は何だったのだろうかと友人が言った。あなたはニュースを見て事故原因を知っていた。車を運転していた女性は疲れていたんだよと言いなさい。", en: "The woman driving the car was tired." },
                    { ja: "不思議な話を友人から聞いた。それはとても興味深い話だとコメントしなさい。", en: "That is a very interesting story." },
                    { ja: "友人が、日本語を履修したいが、難しいだろうかと聞いてきた。書き言葉としての日本語は難しいよと答えなさい。", en: "Written Japanese is difficult." },
                    { ja: "新しい映画を見た翌日、どうだった? と友人が聞いてきた。その映画はちょっとつまらないよと答えなさい。", en: "The movie is a little boring." },
                    { ja: "あなたは、知り合いが若くして急に亡くなったという知らせを聞いた。友人に、それには本当に驚いたと言いなさい。", en: "That was really surprising to me." },
                    { ja: "彼女のおしゃべりは度を越している。友人に彼女には疲れると言いなさい。", en: "She is tiring." },
                    { ja: "ローリーは夏休みを終え、別人のようになっていた。以前はフレンドリーだったのに、今朝会った彼女は陰鬱な雰囲気だった。彼女の変化はショックだったと言いなさい。", en: "The change in her was shocking." },
                    { ja: "あなたは初めてボクシングの試合を観戦している。この試合はとっても興奮するねと言いなさい。", en: "The match is very exciting." },
                    { ja: "友人があなたに、どうして図書館で勉強しないのか聞いた。図書館は今日、閉館していると答えなさい。", en: "The library is closed today." },
                    { ja: "友人があなたに、そのデパートは昨日は何時に閉まったか聞いた。そのデパートは5時に閉まったと答えなさい。", en: "The department store closed at five." }
                ]
            },
            {
                title: "Lesson 2-6",
                data: [
                    { ja: "ジョージが入院した。そのことを知らなかったの? と友人に聞かれた。彼が病気であることは知っていたよと答えなさい。", en: "I knew that he was sick." },
                    { ja: "日本人会のミーティングがキャンセルになった。帰りに会ったサヤカのルームメートのリズに、サヤカが帰ってきたら、それについてサヤカに言っておいてと頼みなさい。", en: "Tell Sayaka about it when she comes back." },
                    { ja: "友人が、シェリーは今日、機嫌が悪いと言った。昨夜遅くまで彼女が勉強していたことを知っているあなたは、その友人に、彼女はとても疲れていると思うと言いなさい。", en: "I think (that) she is very tired." },
                    { ja: "学園祭で日本人留学生組が出し物をすることになった。あなたはメイに忍者役を頼んだ。友人があなたに、どうだった? と聞いた。彼女はそれは(どうしても)やらないと言ったと答えなさい。", en: "She said that she wouldn't do that." },
                    { ja: "友人があなたに、今日はケンが来ないね。パーティーの準備を手伝ってくれると思っていたのに、と言った。彼は来るつもりだと思ったと言いなさい。", en: "I thought that he was going to come." },
                    { ja: "リッチが難しい資格試験を受験した。リッチの友人に、彼はそのテストに受かると思うか聞きなさい。", en: "Do you think that he will pass the test?" },
                    { ja: "友人があなたに、「家族に問題があるんだって? どんな問題?」と聞いた。問題は母が病気で寝ていることだと言いなさい。", en: "The trouble is that my mother is sick in bed." },
                    { ja: "タイ人の留学生のアパートに行ったら、台所に見慣れないソースがある。一緒に行った中国人の友人に、あれが何か知っているか聞きなさい。", en: "Do you know what that is?" },
                    { ja: "ルームメイトがあなたに、今朝、お兄さんがあなたに会いに来たよ、と言った。いつ兄が会いにきたのか教えてと聞きなさい。", en: "Can you tell me when my brother came to see me?" },
                    { ja: "クラスメートが、グループリサーチのやり方が分からないと言った。あなたもよく分からない。そのグループリサーチをどうやるべきか、私がジョンに聞くよと言いなさい。", en: "I will ask John how we should do our group research." },
                    { ja: "ローズが何かマシューに失礼なことを言ったらしい。そんなことを言う人ではないのに、と思いながら、彼女がそんなことを言うのは変だねとコメントしなさい。", en: "It's strange that she says so." },
                    { ja: "あなたのほうがお父さんより少し背が高いようだね、と友人が言った。父は私と同じくらい背が高いよと言いなさい。", en: "Dad is as tall as me." },
                    { ja: "タローは英語が流ちょうだね、とキムが言った。彼はできるだけ頑張って勉強していたからねと答えなさい。", en: "He studied as hard as he could." },
                    { ja: "友人があなたに、寮の隣室のセーラはどんな人?と聞いた。知っている限りでは彼女は良い人だよと答えなさい。", en: "She is a nice person as far as I know." },
                    { ja: "友人があなたに、あなたのルームメートのリズは持ち物が多いねと言った。(彼女は)必要以上に物を買っていると答えなさい。", en: "She buys more things than she needs." },
                    { ja: "友人があなたに、フランス語を履修する学生数と中国語を履修する学生数の、どちらが多いかを聞いた。中国語を履修する学生のほうがフランス語のそれより多いと答えなさい。", en: "There are more students in the Chinese class than in the French class." },
                    { ja: "ジェーンは非常に背が高い。あなたは、ジェーンのお姉さんも背が高いことを知っている。あなたはお姉さんより背が高いの? とジェーンに聞きなさい。", en: "Are you taller than your big sister?" },
                    { ja: "友人に頭がいいね、と言われて恐縮した。その友人のほうが自分よりも頭がいいと思っていたので、あなたのほうが私より頭がいいと思うよと言いなさい。", en: "I think you're smarter than me." },
                    { ja: "ハナはだんなさんと同い年くらいかな、と友人があなたに聞いた。(彼女は) だんなさんより 2歳年下だよ、と答えなさい。", en: "She is two years younger than her husband." },
                    { ja: "友人は最近よくお酒を飲む。もっと酒量を減らすべきだとアドバイスしなさい。", en: "You should drink less." },
                    { ja: "友人が、中国とアメリカは国土面積で世界のベスト4に入ると言った。どちらが大きいの? 中国? アメリカ? と聞きなさい。", en: "Which is larger, China or America?" },
                    { ja: "友人があなたに、日本で一番高い山は何か聞いた。日本では富士山が最も高い山だと答えなさい。", en: "Mt. Fuji is the highest mountain in Japan." },
                    { ja: "友人とトミーの3人で買い物に行く約束をしているが、トミーは時間にルーズだ。友人に、(彼は)かなりの確率で遅れて来るよと言いなさい。", en: "Most likely he will come late." },
                    { ja: "友人が、あなたのクラスのヨウコはみんなから頼りにされているみたいだね、と言った。ヨウコはクラスで最も頭のいい生徒だよと言いなさい。", en: "Yoko is the smartest student in her class." },
                    { ja: "ソラは背が低いね、と友人が言った。ソラは学校の全ての男の子たちの中で最も背が低いよと言いなさい。", en: "Sora is the shortest of all the boys in his school." },
                    { ja: "あなたの中間テストの結果があまり良くなかったので、ルームメートがなぐさめてくれた。次はもっとうまくやるよと言いなさい。", en: "I will do better next time." },
                    { ja: "秋に、グループで美しい山にハイキングに行った。空気が澄んでいて気分が良い。ここは秋に来るには最高の場所だねと言いなさい。", en: "This is the best place to visit in autumn." }
                ]
            },
            {
                title: "Lesson 2-7",
                data: [
                    { ja: "ジェリーが後で電話すると言っていた。ルームメートが、ジェリーはいつ電話してくれるんだろう、とあなたに聞いた。彼が(今日の)いつ電話を折り返しかけてくるか知らないと言いなさい。", en: "I don't know when he will call me back today." },
                    { ja: "ジェームズが、あなたがボストンに旅行すると知って、MITには行ってみるべきだと勧めた。ボストンに行ったらそこに行くつもりでいると言いなさい。", en: "I'm going to go there when I go to Boston." },
                    { ja: "友人があなたに、キムがあなたに電話すると言っていた、と教えてくれた。夕食を食べているときに彼女が電話をくれたとその友人に言いなさい。", en: "When I was eating dinner, she gave me a call." },
                    { ja: "あなたの友人が、「夏休み中にニュージーランドでホームステイするんだって?」と聞いてきた。うなずいて、ニュージーランドに行く前に英語を一生懸命勉強したいと言いなさい。", en: "I want to study English very hard before I go to New Zealand." },
                    { ja: "ルームメートのキムが疲れている様子だ。今日の皿洗いはキムの担当だけれど、食べ終わったら私が皿洗いをすると言いなさい。", en: "I will do the dishes after we eat." },
                    { ja: "あなたはシェアハウスに住んでいる。同じシェアハウスの友人がリズはいつ帰ってくるんだろうね、と聞いてきた。(ひょっとすると)彼女は6時前に家に帰ってくるかもしれないと言いなさい", en: "She might come home before six." },
                    { ja: "ジェイミーがあなたに、いつ就寝するのか聞いた。いつも11時以降に寝ると言いなさい。", en: "I usually go to bed after eleven." },
                    { ja: "あなたの家にベンがやって来た。料理の最中なのでリビングで待ってもらうことにした。彼に、料理をしている間そのビデオを見ていていいよと言いなさい。", en: "You can watch the video while I'm cooking." },
                    { ja: "マリアがあなたに、昨日どこかに出かけたのか聞いた。雨が降っていたので昨日は出かけなかったと答えなさい。", en: "I didn't go out yesterday because it was raining." },
                    { ja: "ジェニファーは、フランス語の他に韓国語も勉強していると言った。彼女に、どうして韓国語を勉強しているのか聞きなさい。", en: "Why are you learning Korean?" },
                    { ja: "友人が、あなたがなぜ韓国語を勉強しているのか聞いた。それはいつか韓国に行ってみたいからだと答えなさい。", en: "-It is because I want to go to Korea someday." },
                    { ja: "ジェリーがあなたに、サッカーの試合に行くつもりかどうか聞いてきた。もう一人のあなたの友人ベンが行くかどうかは分からない。彼が行くなら私も行くよと言いなさい。", en: "If he goes, I will go." },
                    { ja: "あなたは、アルバイトの関係で友人との約束の時間に遅れるかもしれない。もし遅れるなら電話するよとその友人に言いなさい。", en: "If I'm late, I'll call you." },
                    { ja: "友人が、あなたはよく散歩してるよね、と言った。あまり忙しくないときは約30分散歩していると言いなさい。", en: "I take a walk of about 30 minutes if I'm not too busy." },
                    { ja: "持ち寄りパーティーを催すことになった。友人に、(君が)もし飲み物を持っていくなら、私はスナックを持っていくと言いなさい。", en: "If you bring drinks, I will bring snacks." },
                    { ja: "あなたは、友人を明日のコンサートに誘った。そこに行くことができるかどうか教えてと言いなさい。", en: "Let me know if / whether you can go there." },
                    { ja: "午後にショッピングセンターには行けないかもしれない、とスージーが言った。たとえ彼が行かなくても私は行くと言いなさい。", en: "I'll go even if he doesn't." },
                    { ja: "友人が、あなた方ご夫妻はスパイシーな食べ物が好きか、と聞いた。彼はそうではないけど私は好きです、と答えなさい。", en: "I like it even though he doesn't." },
                    { ja: "友人があなたに、キムとあなたは週末にどこに行くのか聞いた。キムと私は日曜日にスキーに行く予定だと答えなさい。", en: "Kim and I are going skiing on Sunday." },
                    { ja: "ジャネットが、日本に行くつもりだ、とあなたに言った。いつ日本に到着するのか聞きなさい。", en: "What day will you arrive in Japan?" },
                    { ja: "キムとカフェで会う約束をしていた。カフェに行ったらキムが先に来ていた。いつここに着いたのか聞きなさい。", en: "When did you arrive here?" },
                    { ja: "ソンがあなたに、学校には徒歩で来ているのかと聞いた。ここには毎日自転車で来ていると答えなさい。", en: "I come here by bike every day." },
                    { ja: "トムがあなたに、いつディズニーワールドに行くのか聞いた。そこには明日行きたいんだと答えなさい。", en: "I want to go there tomorrow." },
                    { ja: "友人があなたに、昨日、風邪をひいていたそうだね。学校には行けたの? と聞いた。一日中自宅にいたと答えなさい。", en: "I stayed at home all day." },
                    { ja: "友人が、夜7時からの映画に行かないか、と誘ってきた。夜は外には出たくないと答えなさい。", en: "I don't want to go out in the evening." },
                    { ja: "友人が、最近とても忙しくて眠る暇もないくらいだ、と言った。夜、何時に寝ているのか聞きなさい。", en: "At what time do you go to sleep at night?" }
                ]
            },
            {
                title: "Lesson 3-1",
                data: [
                    { ja: "ジョンがあなたに、ヨーロッパに行ったことがあるか聞いた。ヨーロッパには一度行ったことがあると答えなさい。", en: "I have been to Europe once." },
                    { ja: "友人があなたのアパートに来た。あなたのバスケットボールシューズを見て、意外そうな顔をした。以前バスケットボールをしていたんだと言いなさい。", en: "I have played basketball before." },
                    { ja: "ルームメートのジョージが帰ってきて、ソファーでテレビを見てくつろいでいるあなたを見た。あなたは明日提出の宿題をやっているとばかり思っていた、とジョージはけげんそうな顔をした。宿題は終わったよと彼に言いなさい。", en: "I have finished my homework." },
                    { ja: "ミンがインターネットでメキシコの風景を見ている。彼にメキシコに行ったことがあるか聞きなさい。", en: "Have you ever been to Mexico?" },
                    { ja: "友人がスティーブとは長い付き合いだ、と言った。どのくらいの期間、スティープを知っているか聞きなさい。", en: "How long have you known Steve?" },
                    { ja: "友人があなたに、去年、海外旅行をしたの? と聞いた。昨秋にタイに行ったんだと答えなさい。", en: "I went to Thailand last fall." },
                    { ja: "友人が、ジョギングを続けているか? と聞いてきた。うなずいて、今朝、公園の周りを走ってきたと言いなさい。", en: "I ran around the park this morning." },
                    { ja: "サリーが電話をかけてきて、今何をしているのか聞いた。ちょうど夕食を終えたところだと答えなさい。", en: "I've just finished my dinner." },
                    { ja: "新聞をルームメートが読んでいる。その新聞もう来たの? と言いなさい。", en: "Has the newspaper come already?" },
                    { ja: "朝起きて居間に行くと妻が先に起きていた。新聞はもう来ているか聞きなさい。", en: "Has the newspaper come yet?" },
                    { ja: "あなたはシェアハウスに住んでいて、朝起きて居間に行ったらスティーブがテレビを見ていた。もう朝食を食べたか聞きなさい。", en: "Have you finished eating breakfast yet?" },
                    { ja: "キムがあなたに、イギリス住まいがずいぶん長いんだね、と言った。イギリスには15年住んでいると言いなさい。", en: "I have lived in England for fifteen years." },
                    { ja: "メグがあなたの友人のデイブと話していた。後で彼女に聞いたところ、デイブのことをよく知っている、という。彼をどのくらい前から知っているのか聞きなさい。", en: "How long have you known him?" },
                    { ja: "遠くに住んでいる友人から電話があった。こちらの天候を聞かれたので、日曜日以来とても暑いんだと答えなさい。", en: "It's been very hot since Sunday." },
                    { ja: "トムがトルストイの『戦争と平和』を読んでいた。以前その小説を読んだことがあるよと言いなさい。", en: "I've read the novel before." },
                    { ja: "友人と歩いていて、授業があるのでそろそろ学内に戻ろうかと時計を見たら止まっていた。あつ、(自分の)時計が止まっていると言いなさい。", en: "Oh, my watch has stopped!" },
                    { ja: "友人が、あなたのルームメートのトムはまだ家にいるか聞いた。ニュージーランドに行ったよ、と答えなさい。", en: "He has gone to New Zealand." },
                    { ja: "友人があなたに、ケイコはまだ受けるべきテストが残っているのかと聞いた。ケイコのテストは終わったよと答えなさい。", en: "Keiko has finished her tests." },
                    { ja: "友人があなたに、ケイコはまだ受けるべきテストが残っているのかと聞いた。ケイコはテストが終わっているよと答えなさい。", en: "Keiko is finished with her tests." },
                    { ja: "友人が机上のパソコンを見て、あなたが買ったのか、それともあなたのルームメートのヨシコが買ったのか、と聞いた。これは彼女が昨日買ったパソコンだよと答えなさい。", en: "This is the PC that she bought yesterday." },
                    { ja: "あなたの従姉妹たち、バイオリンが上手だね、と友人が言った。私にはバイオリンのとても上手なおばがいると言いなさい。", en: "I have an aunt who plays the violin very well." },
                    { ja: "今夜はすしを食べたい気分。友人に、おいしいすしを食べられる店を知っているか聞きなさい。", en: "Do you know anywhere that I can get nice sushi?" },
                    { ja: "あなたは友人に昔の写真を見せている。その中に古い家の写真が出てきた。これはかつて住んでいた家だよと友人に言いなさい。", en: "This is the house that I once lived in." },
                    { ja: "友人があなたに、なぜ田中さんにスペイン人のマリアを紹介したのか、と聞いた。彼にはスペイン語を話す人が必要なんだよと答えなさい。", en: "He needs a person who speaks Spanish." },
                    { ja: "ボールがあなたに、日本は年功序列社会だったそうだね、と言った。うなずいて、よく働く人はもっとお金をもらうべきだよねと言いなさい。", en: "Those who work hard should be paid more." },
                    { ja: "メアリーがあなたに、日本では何歳から中学校に通わなければならないのか、と聞いた。12歳から子供はみな中学に行かなければならないと答えなさい。", en: "Any child who is 12 or older has to go to junior high school." },
                    { ja: "友人があなたに、お兄さんは動物が好きなようだねと言った。(彼は)野生の動物を見るのが好きだと言いなさい。", en: "He likes to see animals which are in the wild." },
                    { ja: "ルームメートのシンシアが、何かを探している。あなたが図書館から借りたCDはテーブルの上にあるよと言いなさい。", en: "The CD which you borrowed from the library is on the table." },
                    { ja: "友人があなたに、君のお兄さんの部屋にはずいぶん物が多いね、と言った。彼は捨てたくない古い物をたくさん持っているからねと答えなさい。", en: "He has a lot of old things that he doesn't want to throw away." },
                    { ja: "ルームメートがあなたに、皿を洗ってくれないかと聞いた。前回洗ったのはあなたなので、あなたは少し腹を立ててそれをすべきなのは君だよと言いなさい。", en: "It's you that should do it." }
                ]
            },
            {
                title: "Lesson 3-2",
                data: [
                    { ja: "あなたはフレッドが早めに帰っていくのを怪訝に思っている。彼の同僚に、なぜフレッドはいつも早く帰っていくのか聞きなさい。", en: "Why does Fred always leave early?" },
                    { ja: "メルは今日、早めに帰ろうとしている。同僚に、なぜ彼は早めに帰ろうとしているのか聞きなさい。", en: "Why is he leaving early?" },
                    { ja: "クラスメートに、(いつも)クリスマスイブには何をしているのか聞きなさい。", en: "What do you do on Christmas Eve?" },
                    { ja: "冬休み前。クラスメートに、クリスマスイブに何をする予定か聞きなさい。", en: "What are you doing on Christmas Eve?" },
                    { ja: "友人が、あなたのお兄さんはどうして自分の会社をたたんでしまったのか聞いた。(彼は)自分のビジネスへの興味を失ったんだと答えなさい。", en: "He lost interest in his business." },
                    { ja: "あなたはメルを最近、見ていない。メルの友人に、彼は最近ここに来ているか聞きなさい。", en: "Has he been here lately?" },
                    { ja: "あなたのクラスのアグネスは、成績が飛び抜けて良い。他のクラスメートに、彼女ほど頭の良い人に会ったことがないと言いなさい。", en: "I have never met any person as smart as her." },
                    { ja: "友人が、あなたのお兄さんは海外で働いていたんだって? と聞いた。(彼は) ドイツで5年間働いたと答えなさい。", en: "He worked in Germany for five years." },
                    { ja: "友人が、あなたのお兄さんは海外で働いているんだって? と聞いた。(彼は)ドイツで5年間働いていると答えなさい。", en: "He has worked in Germany for five years." },
                    { ja: "友人があなたに、キムはまだ学校に通っているのか聞いた。彼女は学校生活を終えたよと答えなさい。", en: "She finished school." },
                    { ja: "友人が、先週のパーティーではあなたを見かけなかった、と言った。(私は)その夜7時に出たんだと言いなさい。", en: "I left at seven that night." },
                    { ja: "あなたは、ルームメートのリチャードにどうしても電話をかけなければならない。しかし、彼の電話番号が思い出せない。友人に彼の電話番号を忘れてしまったと言いなさい。", en: "I forget his phone number." },
                    { ja: "クラスメートのロナルドがあなたに、来週のテストの内容について聞いてきた。10分ほどかけて説明したが、彼が理解したようには見えない。分かった?と聞きなさい。", en: "Do you understand?" },
                    { ja: "クラスメートのカルロスが、あなたに来週のテストの内容について詳しく説明してくれた。彼が、理解できたか聞いてきたので、うん、分かったと答えなさい。", en: "Yes, I understand." },
                    { ja: "みながミーティング室に集まった。あなたは司会者役を務める。ミーティングを始めますと言いなさい。", en: "We start our meeting." },
                    { ja: "あなたはスーザンに、クリスマスパーティーに誘われた。スーザンの手料理が振る舞われるとのこと。彼女は料理が上手だと聞いていると友人に言いなさい。", en: "I hear she is good at cooking." },
                    { ja: "友人があなたに、どうしてジムはあんなに科学が得意なんだろう、と言った。おじいさんが科学の先生だったと彼が言っていたよと答えなさい。", en: "He says his grandfather was a science teacher." },
                    { ja: "あなたの友人が帰ろうとしていて、友人のルームメートのシェリーを見なかったかあなたは聞かれた。彼女は向こうに座っているよと答えなさい。", en: "She is sitting over there." },
                    { ja: "ナンシーは今日とても良いイヤリングを着けている。彼女に今日はきれいなイヤリングを着けているねと言いなさい。", en: "You are wearing pretty earrings today." },
                    { ja: "あなたはランチを食べなかった。ルームメートが何も欲しくないのか、とあなたに聞いた。うん、それほどおなかが空いてないからと答えなさい。", en: "No, I'm not so hungry." },
                    { ja: "ルームメートのトムに、今日は学校に行かなかったんだね、と聞かれた。うん、腹痛だったからねと答えなさい。", en: "No. I had a stomachache." },
                    { ja: "友人があなたに、最近ジムとジェニファーは、よく一緒にいるね、と言った。彼は彼女と付き合っているんだと答えなさい。", en: "He is going out with her." },
                    { ja: "あなたは今夜、仕事でお客さんとお酒を飲むことになっている。アシスタントのキムに、今夜、車を運転できないか聞きなさい。", en: "Can't you drive tonight?" },
                    { ja: "ビリーは、早く大学の課程を終わろうとしている。そのビリーに、夏休み中にもクラスを履修しているよね、違う?と聞きなさい。", en: "You have some classes during the summer vacation, no?" },
                    { ja: "スーザンがあなたに、マイケルは引っ越しを手伝ってくれるだろうか、と聞いてきた。どうかなと答えなさい。", en: "I doubt it." },
                    { ja: "あなたの部屋に遊びに来ていたマギーが、のどがかわいたと言った。ああ、そう? 冷蔵庫に炭酸飲料があるよと言いなさい。", en: "Are you? I have soda in the fridge." },
                    { ja: "新しい製品をプロモートするにあたり、営業の皆で良い方法を考えているが、なかなかいいアイディアが浮かばない。それをどうやるのかは難しい問題だねと言いなさい。", en: "How to do it is a difficult question." },
                    { ja: "トムがあなたに、お酒を飲みたくないのに友だちに飲み会に誘われるんだ、と言った。あなたは、問題はそれをどう避けるかだねと言いなさい。", en: "The problem is how to avoid it." }
                ]
            },
            {
                title: "Lesson 3-3",
                data: [
                    { ja: "外は雨。この辺ではよく雨が降るのか、とマイケルが聞いた。この季節には雨はあまり降らないよと答えなさい。", en: "We don't get much rain during this season." },
                    { ja: "友人があなたに、ウィリアムは口だけは達者だけど何もしないね、と言った。一番よくしゃべる人が一番何もしないものだよと答えなさい。", en: "They do least who talk most." },
                    { ja: "友人があなたに、コロンビアではどんな農産物が生産されるんだろう、と聞いた。コロンビアではコーヒーが栽培されていると答えなさい。", en: "They grow coffee in Colombia." },
                    { ja: "スーザンがあなたに、イギリスと日本は同じくらいの面積か、と聞いた。日本の面積はイギリスのそれより大きいと答えなさい。", en: "The size of Japan is larger than that of the UK." },
                    { ja: "友人があなたに、来年はまたインフルエンザがはやるだろうね、と言った。そうは思わないと答えなさい。", en: "I don't think so." },
                    { ja: "カレンがあなたに、今年こそ物価が安定すればいいけど、と言った。そう望むよと答えなさい。", en: "I hope so." },
                    { ja: "大教室での授業に初めて出たら、中学生くらいの年の男の子がいた。一緒にいた友人に、あの大学生は13歳かそこらにちがいないねと言いなさい。", en: "The college student must be thirteen or so." },
                    { ja: "ネットショッピング中、あなたのルームメートが、そのサイトでの買い物は危ないよ、と言った。どういうふうに(危ないの)? と聞きなさい", en: "How so?" },
                    { ja: "久しぶりにミンに会った。そこで、あなたは「どう? 元気?」と聞かれた。今のところは順調だよと答えなさい。", en: "So far, so good." },
                    { ja: "友人があなたに、あなたの露出は多すぎるよ。男性たちがジロジロ見るよ、と言った。それがどうしたっていうの? と答えなさい。", en: "So what?" },
                    { ja: "あなたとルームメートがレストランに行った。ルームメートはスパゲッティを頼み、ウェーターがあなたに、何になさいますか?と聞いた。同じものにしますと答えなさい。", en: "I'll have the same." },
                    { ja: "リズがあなたに、あの国の大統領は森林破壊を奨励するような発言をしてひどい、と言った。私も妻もあなたと同じように感じると答えなさい。", en: "My wife and I feel the same as you." },
                    { ja: "夜道で、あなたは自宅に帰ろうとしている友人に会った。良い夜を!と言いなさい。", en: "Have a good night!" },
                    { ja: "金曜日の夜、別れ際に友人から「良い週末を!」と言われた。あなたもねと返事をしなさい。", en: "-The same to you!" },
                    { ja: "友人があなたに、ナタリーには双子の姉がいるんだってね、と言った。うなずいて、どちらがどちらか見分けがつかないよと言いなさい。", en: "It is difficult to tell one from the other." },
                    { ja: "あなたは長年同じブランドの車に乗り続けている。あなたの友人が前の車も同じ車種だったね、とあなたに聞いた。私は他のどのブランドよりこのブランドが好きだ、と答えなさい。", en: "I prefer this brand to any other." },
                    { ja: "友人があなたに、マイケルは背が高いね、と言った。彼はクラスではどの男の子よりも背が高いよと言いなさい。", en: "He is taller than any other male student in the class." },
                    { ja: "友人があなたに、料理をしているか聞いた。1日おきに料理をしているよと答えなさい。", en: "I cook every other day." },
                    { ja: "あなたの同僚が、ある問題についてのミーティングを開きたい、と言った。あなたは忙しいので、いつかそれについて議論しましょうと言いなさい。", en: "Let's discuss it some other day." },
                    { ja: "友人があなたに、女子高の元クラスメートと仲がいいね、と言った。女子生徒たちはみな助け合っていたからねと答えなさい。", en: "All female students helped each other." },
                    { ja: "あなたは、ロブにケーキをごちそうした。彼のアイスティーのグラスが空になっている。もう一杯どうぞ、と言いなさい。", en: "Have another cup." },
                    { ja: "転校生の女の子はどんな人?と友人があなたに聞いてきた。彼女はすごい人だと思うと答えなさい。", en: "I think she's somebody." },
                    { ja: "彼女との初デートどうだった? 親切にしてくれた?とあなたの友人が聞いた。あなたはデート相手が気が利かなくて、腹立たしく思っている。彼女は大したことないよと答えなさい。", en: "She is nothing." },
                    { ja: "友人があなたに、あなたの妹さんはとてもおしゃべりだね、と言った。うちの妹のおしゃべり好きは今に始まったことではないからねと答えなさい。", en: "My sister's love of chatting is nothing new." },
                    { ja: "友人が、家へ帰る途中であなたのアパートに立ち寄っている。用事で10分ほど出かけなければならない。コーヒーか何か飲んでおいて、いい? と言いなさい。", en: "Drink coffee or something, OK?" },
                    { ja: "あなたの友人があなたのアパートに来た。飲み物か何かいる? と聞きなさい。", en: "Do you want a drink or something?" },
                    { ja: "あなたが寮に帰ったら、ルームメートが毛布にくるまっていた。寒いか何かなの? と聞きなさい。", en: "Do you feel cold or something?" }
                ]
            },
            {
                title: "Lesson 3-4",
                data: [
                    { ja: "友人があなたに、アキラとあなたはよく海外に行くのか?と聞いた。彼はたくさんの国に行っているけれど、私はたくさんは行っていないと答えなさい。", en: "He has visited a lot of countries, but I haven't been to many." },
                    { ja: "友人が、1月の北海道はとても寒かった、と言った。1月にそこにたくさん雪が降ったか聞きなさい。", en: "Was there much snow in January?" },
                    { ja: "あなたは風邪をひいて外に出られず、友人が夕食を買って持ってきてくれた。本当にありがとうと言いなさい。", en: "Thank you so much." },
                    { ja: "友人があなたに、あなたの実家の近くにあるビーチは人気があるのか、と聞いた。夏になると、そのビーチには人が多過ぎるくらいいると答えなさい。", en: "There are too many people on the beach in summer." },
                    { ja: "リッチが科学のある問題につまずいていて、どうも科学の才能がないみたい、と言った。このパズルはわずかな人しか解けないよと言いなさい。", en: "Few people can solve this puzzle." },
                    { ja: "友人があなたに、来年ドジャースに優勝の可能性はあるか聞いた。来年は彼らに少しは希望があるねと言いなさい。", en: "There is a little hope for them next year." },
                    { ja: "メイがあなたに、あなたのお姉さんの病気の具合はどうか、と聞いた。彼女は今、少し気分は良いと答えなさい。", en: "She feels a little better now." },
                    { ja: "友人があなたに、昨日あなたが行ったパーティーはどうだった、と聞いた。そのパーティーには人がたくさんいたよと答えなさい。", en: "There were quite a few people at the party." },
                    { ja: "友人があなたに、UFOなんてあるはずないよね、と言った。UFOを見たって言っている人はいるけどねと答えなさい。", en: "Some say they have seen UFOs." },
                    { ja: "ジャンが、気分がすぐれず学校を休んだ。彼のルームメートに、彼の具合がいくらかよくなっているか聞きなさい。", en: "Is he feeling any better?" },
                    { ja: "あなたは料理をしようとしている。砂糖がなくなっているのに気がついた。砂糖ある?とルームメートに聞きなさい。", en: "Is there any sugar?" },
                    { ja: "友人があなたに、眠そうだけれど、どうしたの?と聞いた。遅くまで隣家でパーティーをやっていて、昨夜はなかなか寝つけなかったと答えなさい。", en: "It was very difficult to get any sleep last night." },
                    { ja: "友人があなたの庭の植物を見て、栽培するのは難しいか、と聞いた。それらの植物は問題なくすぐに成長するよと答えなさい。", en: "Those plants grow quickly without any problems." },
                    { ja: "あなたは、新入生のメンター(相談者)役を引き受けることになった。その新入生に、どんな質問でもあれば、電話してと言いなさい。", en: "If you have any questions, please call me." },
                    { ja: "あなたのお父さんの友人のハインズさんがあなたの家に来てお父さんと談笑している。紅茶はいかがですか?と聞きなさい。", en: "Would you like some tea?" },
                    { ja: "友人があなたに、あれだけフランスの小説が好きなのにフランスに行ったことがないのか、と言った。いつかフランスに行きたいと言いなさい。", en: "I want to go to France someday." },
                    { ja: "友人があなたに、ユウタさんは娘さんの中学受験の準備にずいぶん出費しているね、と言った。彼はどんな犠牲を払ってでも成功したいんだよと言いなさい。", en: "He wants to succeed at any cost." },
                    { ja: "ポールがあなたに、日本は地震大国なんだってね、と言った。大地震は今すぐにでも起こるかもしれないと言いなさい。", en: "A big earthquake may occur at any moment." },
                    { ja: "ある国にショートステイした友人が、スーパーマーケットに豚肉がほとんど売っていなかった、と言った。あの国の人々は豚肉をあまり食べないよと言いなさい。", en: "People in that country don't eat much pork." },
                    { ja: "久しぶりにジェニスに会ったら、性格も外見もずいぶん変わっていた。友人に、彼女の変化にはとても驚かされると言いなさい。", en: "The change in her is very surprising." },
                    { ja: "友人があなたにヨーコは去年ボランティアで難民の子供たちに日本語を教えたらしいね、と聞いた。うなずいて、彼女の親切はすごく感謝されたよと言いなさい。", en: "Her kindness was much appreciated." },
                    { ja: "友人があなたに、外国人一家が隣に引っ越してきたんだってね、と言った。新しい隣人のジョンソン一家はカナダの出身だよと言いなさい。", en: "The Johnsons, our new neighbors, are from Canada." },
                    { ja: "サラがあなたに、弟が遊びに来ているんだってね、と言った。あそこに立っている男の子が(私の)弟だと言いなさい。", en: "The boy standing over there is my brother." },
                    { ja: "友人があなたに、どうしてボーイフレンドと別れたのか、と聞いた。私にはその理由を説明するのはとても難しいと言いなさい。", en: "The reason is very difficult for me to explain." },
                    { ja: "毎日ジョージはお酒を飲んでいるけど、やめないと学校が続かないよ、と友人があなたに言った。彼が禁酒するのは難しいよと言いなさい。", en: "It will be difficult for him to stop drinking." },
                    { ja: "友人があなたに、タカが起業するのは難しくないか、と聞いてきた。彼が自分のビジネスを始めるのは簡単かもしれないと言いなさい。", en: "It may be easy for him to start his own business." },
                    { ja: "タケシがサリーにひどいことをした。サリーに、彼がそれをしたのは間違っていたと言いなさい。", en: "It was wrong of him to do it." },
                    { ja: "友人があなたを自宅まで車で送ってくれることになった。その友人に、家まで車で送ってくれるなんて親切だねと言いなさい。", en: "It is kind of you to drive me home." }
                ]
            },
            {
                title: "Lesson 3-5",
                data: [
                    { ja: "あなたは大きなピアノをリビングに移動させたい。友人のヨンに、このピアノを動かすのを手伝ってと頼みなさい。", en: "Will you help me (to) move this piano?" },
                    { ja: "ジェイミーがあなたに、あなたのお父さんが料理することはあるのか、と聞いた。父はときどき料理で母を手伝うことがあると言いなさい。", en: "Dad sometimes helps Mom (to) do the cooking." },
                    { ja: "ミンとメイがあなたの家に遊びに来ている。あなたは2人のための昼食を作り終えた。昼食の準備ができたよ。来て食べてと言いなさい。", en: "Your lunch is ready. Come eat." },
                    { ja: "同僚のサリーがあなたをランチに誘ってきた。顧客の一人に会いに行かなきゃならないと言って断りなさい。", en: "I have to go see my client." },
                    { ja: "あなたはルームメートのトムと出かけようとしている。彼の服装はTシャツ一枚だ。外は寒いよ。ジャケットを取りに行ったほうがいいよと言いなさい。", en: "It's cold outside. You should go get your jacket." },
                    { ja: "ルームメートのマシューが、図書館から借りた返却期限切れの本をテーブルに置いたままにしている。それは図書館に返すべきだよと言いなさい。", en: "You'd better return it to the library." },
                    { ja: "メイがロンドン旅行から戻ってきた。イギリスで英語が通じた?と聞きなさい。", en: "Could you make yourself understood in English in England?" },
                    { ja: "ジョディーは中間試験があるのに、今夜も出かけて行った。成績が悪いので、このままでは退学の可能性がある。彼女のルームメートのメイにもっと彼女に(強制的に)勉強させなさいと言いなさい。", en: "Make her study harder!" },
                    { ja: "友人があなたに、前より英語が上達しているね、と言った。オーストラリア人の学生がホームステイしているんだと答えなさい。", en: "We have an Australian student staying with us." },
                    { ja: "あなたの知り合いに、ヨウコという美容師がいる。ジャネットがあなたに、誰に髪の毛を切ってもらったのか聞いた。ヨウコに切ってもらったと言いなさい。", en: "I had Yoko cut my hair." },
                    { ja: "ある大事な事業を進めるのに、あなたの部下のヤンは本来午後の出勤だけど、彼女に早く来てもらわないといけない状況。彼女に(指示して)早く来てもらって、とあなたの秘書に言いなさい。", en: "Have her come early." },
                    { ja: "友人があなたに、盗まれたスマホはどうなったのかと聞いた。(私は)後でそれを取り戻したと言いなさい。", en: "I got it back later." },
                    { ja: "友人が、マリー娘はダイエットに夢中で朝食を食べないらしいと言った。彼女はやっと娘に(説得して)朝食を食べさせたと言いなさい。", en: "Finally, she got her daughter to eat breakfast." },
                    { ja: "あなたの友人が芝刈りをサボっている。この地域では芝生を伸ばしっぱなしにしていると近所からクレームが来る。芝生を伸ばしっぱなしにしてはいけないと言いなさい。", en: "Don't let the grass grow too long." },
                    { ja: "友人があなたに、トムはとても社交的な人だね、と言った。私は彼が1人でいるところを見たことがないと言いなさい。", en: "I've never seen him alone." },
                    { ja: "友人があなたに、泥棒がすぐに捕まってよかったが、警察はどうやって犯人を突き止めたのだろう、と言った。ジェニスが、その男が部屋に入る瞬間を見たんだと言いなさい。", en: "Jennice saw the man entering the room." },
                    { ja: "友人があなたに、泥棒がすぐに捕まってよかったが、警察はどうやって犯人を突き止めたのだろう、と言った。ジェニスが、その男が部屋に入る一部始終を見たんだと答えなさい。", en: "Jennice saw the man enter the room." },
                    { ja: "友人があなたに、チェン先生(女性)の講義はどう、と聞いた。(彼女の)講義は分かりやすいよと答えなさい。", en: "Her lectures are easy to understand." },
                    { ja: "あなたはルームメートと一緒に夕食に出かけるつもりでいる。ルームメートに、出かける準備ができたか聞きなさい。", en: "Are you ready to go?" },
                    { ja: "サリーは業務についてよく知っており、あなたはいろいろなことを学んだ。友人に彼女と一緒に働けてとても幸運だったと言いなさい。", en: "I was very fortunate to work / in working with her." },
                    { ja: "友人があなたに、ロナルドは本当に外国語の勉強が好きだね、と言った。彼は言語の習得が速いんだと言いなさい。", en: "He is quick to learn / at learning languages." },
                    { ja: "ジミーがあなたに、マリアに貸したお金がなかなか返ってこない、とこぼした。彼女はいつも私にお金を返すのが遅いからねと言いなさい。", en: "She is always slow to pay / at paying back my money." },
                    { ja: "空港に出かける準備が整い、頼んでおいたタクシーも来た。モタモタしているキムに、タクシーに乗ってと言いなさい。", en: "Get in the taxi!" },
                    { ja: "タクシーの中で、キムがあなたに、搭乗までに時間があるか聞いた。飛行機に乗るまでたくさん時間はあるよと答えなさい。", en: "We have a lot of time before we get on the plane." },
                    { ja: "友人があなたに、どこでバスを降りたのかと聞いた。駅の前でバスを降りたと言いなさい。", en: "I got off the bus in front of the train station." },
                    { ja: "友人があなたに、どうしてそのドアの向こうが立入禁止だと分かるのか、と聞いた。それ(入ってはいけないこと)は掲示板に書いてあるよと言いなさい。", en: "It's on the sign." },
                    { ja: "あなたは友人の家のバルコニーにある植物を見ている。枯れているようにも見える。この木は枯れているのかいないのか聞きなさい。", en: "Is this tree alive or dead?" },
                    { ja: "サリーがあなたに、今着ている服はウールなのか? とあなたに聞いた。このドレスは綿製だよと答えなさい。", en: "This dress is made of cotton." },
                    { ja: "メリッサがあなたに、日本酒は何から作られるのか聞いた。日本酒はコメから作られるよと言いなさい。", en: "Sake is made from rice." }
                ]
            },
            {
                title: "Lesson 3-6",
                data: [
                    { ja: "友人が、あなたとボーイフレンドとの付き合いはもう5年も続いているのか、と言った。うなずいて、彼と初めて会った場所のことを覚えているよと言いなさい。", en: "I remember the place where I met him for the first time." },
                    { ja: "ジェイミーとジョンと3人で、クラスの共同プロジェクトに携わることになっている。ジェイミーに、ジョンは私たちがどこで会う予定なのか知っているのか、と聞きなさい。", en: "Does John know the place where we are meeting?" },
                    { ja: "ヨンがあなたに、何曜日が忙しいか聞いてきた。私は月曜日が一番忙しいと答えなさい。", en: "Monday is when I'm busiest." },
                    { ja: "ポールがあなたに、ジャネットが誰かに引っ越しを手伝ってもらいたがっている、と言った。だから私がここに来たんだと言いなさい。", en: "That's why I came here." },
                    { ja: "ベイプがまた授業を欠席した。クラスメートに、なぜ彼が授業を欠席し続けるのか分からないと言いなさい。", en: "I don't understand why he keeps skipping his classes." },
                    { ja: "友人があなたに、ジェリーははっきりものを言うね、と言った。それが彼のしゃべり方だよと言いなさい。", en: "That's how he talks." },
                    { ja: "友人があなたに、ジャネットは自分たち3人がスミスさんに会う時刻を知っているかな、と聞いた。ジャネットは私たちがスミスさんに会わなければならない時刻を知っているよと言いなさい。", en: "Janet knows the time when we should meet Mr. Smith." },
                    { ja: "友人があなたに、マイケルはなぜ自分たち3人が会おうとしているのか知っているのかな、と聞いた。マイケルは僕らが会おうとしている理由を知らないよと答えなさい。", en: "Michael doesn't know why we're meeting." },
                    { ja: "友人があなたに、ビビアンは誰かにアパートを借りているんだって、と言った。彼女がアパートを借りている女性は教師だよと言いなさい。", en: "The woman whose apartment she rents is a teacher." },
                    { ja: "友人があなたに、学校のフットボールの試合は雨天決行なのかな、と聞いた。もし雨が降れば、その試合は中止だよと答えなさい。", en: "If it rains, the game will be cancelled." },
                    { ja: "友人があなたに、ナオミに明日手伝ってもらいたい、と言った。もし彼女に十分な時間があれば、彼女は私を手伝うだろうけどね(可能性はなさそうだ)と言いなさい。", en: "If she had enough time, she would help me." },
                    { ja: "友人があなたに、ミナはアメリカに行くつもりなのかと聞いた。彼女にもし十分にお金があれば、彼女はアメリカに留学するよと言いなさい。", en: "If she has enough money, she will go to America to study." },
                    { ja: "友人があなたに、ミナはアメリカに行くつもりなのかと聞いた。もし彼女に十分にお金があれば、アメリカに留学するだろうけど(その可能性はあまりなさそうだ)と言いなさい。", en: "If she had money, she would go to America to study." },
                    { ja: "友人があなたに、あの学校に行くべきだろうか、と聞いてきた。もし私があなたなら行くだろうけど、と言いなさい。", en: "If I were you, I would go." }
                ]
            },
            {
                title: "Lesson 4-0",
                data: [
                    { ja: "トムはロンドンに住んでいます", en: "Tom lives in London." },
                    { ja: "彼はロンドンに住んでいます", en: "He lives in London." },
                    { ja: "きれいな水は健康のために必要です", en: "Clean water is necessary for our health." },
                    { ja: "この湖の水はとてもきれいです", en: "The water in this lake is very clean." },
                    { ja: "私は犬を(一匹) 飼っています。その犬はとても人懐こいです", en: "I have a dog. The dog is very friendly." },
                    { ja: "彼は、東京に住むもう一方の祖父母を訪問した", en: "He visited his other grandparents in Tokyo." },

                    { ja: "彼の成績はとてもいいです", en: "His grades are very good" },

                    { ja: "手伝える?", en: "Can you help me?" },
                    { ja: "私は昨夜疲れていたが、眠ることができなかった", en: "I was tired last night, but I couldn't sleep." },

                    { ja: "どうかお座りになってください", en: "Would you sit down, please?" },
                    { ja: "もし今お金があれば、これを買うんだけど", en: "If I had any money now, I'd buy this." },

                    { ja: "口語の日本語は文語の日本語と違う", en: "Spoken Japanese is different from written Japanese." },
                    { ja: "彼はディナーのために正装することにした", en: "He decided to dress up for dinner." },
                    { ja: "ここは見るべきものがたくさんあります", en: "There are a lot to see here." },
                    { ja: "何歳になっても学べる", en: "No man is too old to learn." },
                    { ja: "私たちは海岸でのドライブを楽しみました", en: "We enjoyed driving along the coast." },
                    { ja: "できるだけ急ぎましょう", en: "Let's hurry as much as possible." },
                    { ja: "彼女はかつてない程エネルギッシュだ", en: "She's more energetic now than ever." },
                    { ja: "経験は最良の師", en: "Experience is the best teacher." },
                    { ja: "誰がこの花瓶を割ったの?", en: "Who broke this flower vase?" },

                ]

            {
                title: "Lesson 4-1",
                data: [
                    { ja: "彼に最初に出会った夜を覚えています", en: "I remember the night when I met him for the first time." },
                    { ja: "ここが私たちがよく野球をした場所です", en: "This is the place where we played baseball often." },
                    { ja: "彼女は私たちが会う場所を知っていますか?", en: "Does she know the place where we are meeting?" },
                    { ja: "私は金曜日が一番忙しいです", en: "Friday is when I'm busiest." },

                            'Google US English', 'Google UK English Female', 
                            'Samantha', 'Victoria', 'Karen', 'Tessa', // Mac, iOS
                            'Microsoft Zira', 'Microsoft Hazel' // Windows
                        ];
                        
                        let defaultVoice = null;
                        for (const name of preferredNames) {
                            defaultVoice = englishVoices.find(v => v.name.includes(name));
                            if (defaultVoice) break;
                        }
                        
                        // 見つからなければ最初の英語音声を設定
                        if (!defaultVoice) defaultVoice = englishVoices[0];
                        
                        setSelectedVoiceURI(defaultVoice.voiceURI);
                    }
                };

                updateVoices();
                if (speechSynthesis.onvoiceschanged !== undefined) {
                    speechSynthesis.onvoiceschanged = updateVoices;
                }
            }, [selectedVoiceURI]);

                utterance.lang = 'en-US';
                utterance.rate = playbackRate;

                    const selectedVoice = voices.find(v => v.voiceURI === selectedVoiceURI);
                    if (selectedVoice) {
                        utterance.voice = selectedVoice;
                    }
                }

                window.speechSynthesis.speak(utterance);

                        playAudio(currentSentence.en, () => {

                            nextTimer = setTimeout(() => {

                            }, 1500);
                        });
                    }, autoDelay * 1000);

                return () => {
                    clearTimeout(showTimer);
                    clearTimeout(nextTimer);
                    window.speechSynthesis.cancel();
                };

                                        type="range" 
                                        min="0.5" 
                                        max="1.0" 
                                        step="0.1" 
                                        value={playbackRate}
                                        onChange={(e) => setPlaybackRate(Number(e.target.value))}
                                        className="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-blue-600 mt-2"
                                    />
                                    <div className="flex justify-between text-xs text-slate-500 mt-1">
                                        <span>0.5倍</span>
                                        <span>等倍(1.0)</span>
                                    </div>
                                </div>

                                <div>
                                    <label className="block text-sm font-semibold text-slate-700 mb-1">音声モデル (女性の声推奨)</label>
                                    <select 
                                        className="w-full bg-white border border-slate-300 text-slate-700 rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5 outline-none shadow-sm text-sm"
                                        value={selectedVoiceURI}
                                        onChange={(e) => setSelectedVoiceURI(e.target.value)}
                                        disabled={voices.length === 0}
                                    >
                                        {voices.length === 0 ? (
                                            <option value="">音声を読み込み中...</option>
                                        ) : (
                                            voices.map(voice => (
                                                <option key={voice.voiceURI} value={voice.voiceURI}>
                                                    {voice.name} ({voice.lang})
                                                </option>
                                            ))
                                        )}
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>

                    {}
                    <div className="glass-panel rounded-2xl p-6 md:p-10 mb-6 flex-grow flex flex-col justify-center relative shadow-lg">
                        <div className="absolute top-4 right-4 text-sm font-bold text-slate-400 bg-slate-100 px-3 py-1 rounded-full">
                            {currentSentenceIndex + 1} / {currentLesson.data.length}
                        </div>
                        
                        <div className="mb-8">
                            <span className="inline-block text-xs font-bold text-blue-600 uppercase tracking-wider mb-2 bg-blue-100 px-2 py-1 rounded">Japanese</span>
                            <h3 className="text-xl md:text-3xl font-bold leading-snug text-slate-800">
                                {currentSentence.ja}
                            </h3>
                        </div>

                        <div className="min-h-[120px] flex flex-col justify-center border-t border-slate-200 pt-8 mt-2 relative">
                            <span className="absolute top-4 left-0 inline-block text-xs font-bold text-emerald-600 uppercase tracking-wider mb-2 bg-emerald-100 px-2 py-1 rounded">English</span>
                            
                            {isEnglishVisible ? (
                                <div className="fade-in">
                                    <h3 className="text-2xl md:text-4xl font-bold text-emerald-700 leading-snug mb-4">
                                        {currentSentence.en}
                                    </h3>
                                </div>
                            ) : (
                                mode === 'manual' && (
                                    <div className="flex justify-center items-center h-full">
                                        <button 
                                            onClick={() => {
                                                setIsEnglishVisible(true);
                                                playAudio(currentSentence.en);
                                            }}
                                            className="px-6 py-3 bg-emerald-100 text-emerald-700 font-bold rounded-xl hover:bg-emerald-200 transition-colors flex items-center gap-2 shadow-sm"
                                        >
                                            <svg className="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path fillRule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clipRule="evenodd"></path></svg>
                                            英語を表示＆再生
                                        </button>
                                    </div>
                                )
                            )}
                            
                            {/* Replay button for manual mode when visible */}
                            {isEnglishVisible && mode === 'manual' && (
                                <button 
                                    onClick={() => playAudio(currentSentence.en)}
                                    className="absolute bottom-0 right-0 text-emerald-600 hover:text-emerald-800 p-2 rounded-full hover:bg-emerald-50 transition-colors"
                                    title="もう一度聞く"
                                >
                                    <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path></svg>
                                </button>
                            )}
                        </div>
                    </div>

                    {}
                    <div className="flex justify-between items-center pb-8">
                        <button 
                            onClick={handlePrev}
                            disabled={currentLessonIndex === 0 && currentSentenceIndex === 0 || mode === 'auto'}
                            className="px-6 py-3 bg-white text-slate-700 font-bold rounded-xl shadow-sm border border-slate-200 hover:bg-slate-50 disabled:opacity-40 disabled:cursor-not-allowed transition-all flex items-center gap-2"
                        >
                            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 19l-7-7 7-7"></path></svg>
                            戻る
                        </button>

                        <button 
                            onClick={handleNext}
                            disabled={mode === 'auto'}
                            className="px-8 py-3 bg-slate-800 text-white font-bold rounded-xl shadow-md hover:bg-slate-900 disabled:opacity-40 disabled:cursor-not-allowed transition-all flex items-center gap-2"
                        >
                            次へ
                            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5l7 7-7 7"></path></svg>
                        </button>
                    </div>

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
