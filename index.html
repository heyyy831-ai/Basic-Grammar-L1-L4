<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>瞬間英作4-0〜4-9</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom font for better readability */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap');
        
        body {
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
            background-color: #f0f4f8; /* Soft blue-gray background matching the design */
            color: #334155; /* Slate 700 */
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
        }

        /* Styling for select dropdowns to match design */
        select {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 1rem center;
            background-size: 1em;
        }
        
        /* Custom range slider styling */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #2563eb; /* Blue 600 */
            cursor: pointer;
            margin-top: -6px; /* Centers thumb on the track */
            box-shadow: 0 0 2px rgba(0,0,0,0.5);
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #e2e8f0; /* Slate 200 */
            border-radius: 2px;
        }

        input[type=range]:focus {
            outline: none;
        }

        /* Hide element class */
        .hidden {
            display: none !important;
        }

        /* Button hover effects */
        .btn-hover {
            transition: all 0.2s ease-in-out;
        }
        .btn-hover:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        .btn-hover:active {
            transform: translateY(1px);
        }
    </style>
</head>
<body>

    <header class="text-center mb-8 w-full max-w-4xl">
        <h1 class="text-3xl md:text-4xl font-bold text-gray-800 mb-2">英会話のための基本英文法完全マスター</h1>
        <h2 class="text-xl md:text-2xl font-semibold text-blue-600 mb-2">瞬間英作練習アプリ</h2>
    </header>

    <section class="bg-white rounded-2xl shadow-sm p-6 w-full max-w-4xl mb-6 flex flex-col md:flex-row gap-6">
        
        <!-- Left Column: Lesson & Mode -->
        <div class="flex-1 flex flex-col gap-4">
            <!-- Lesson Selection -->

                <label for="lesson-select" class="block text-sm font-bold text-gray-700 mb-1">レッスン選択</label>

                    <!-- Options populated by JS -->
                </select>
            </div>

            <!-- Playback Mode -->
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">再生モード</label>
                <div class="flex bg-gray-200/80 p-1.5 rounded-lg w-full shadow-inner">

                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="10" y1="15" x2="10" y2="9"></line><line x1="14" y1="15" x2="14" y2="9"></line></svg>
                        手動
                    </button>
                    <button id="mode-auto-btn" class="flex-1 text-gray-500 hover:text-gray-700 font-semibold py-2.5 px-2 rounded-md flex items-center justify-center gap-1.5 transition-all text-sm">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                        自動継続
                    </button>
                </div>
            </div>
        </div>

        <!-- Right Column: Delay, Rate, Voice -->
        <div class="flex-1 flex flex-col gap-4">
            <!-- Display Delay -->
            <div>
                <label for="delay-select" class="block text-sm font-bold text-gray-400 mb-1" id="delay-label">表示待機時間 (自動継続時)</label>
                <select id="delay-select" class="w-full border border-gray-200 rounded-lg p-3 text-gray-400 bg-gray-50 focus:outline-none cursor-not-allowed" disabled>
                    <option value="3000">3秒</option>
                    <option value="4000">4秒</option>
                    <option value="5000" selected>5秒</option>
                    <option value="6000">6秒</option>
                    <option value="7000">7秒</option>
                    <option value="8000">8秒</option>
                    <option value="9000">9秒</option>
                    <option value="10000">10秒</option>
                </select>
            </div>

            <!-- Speech Rate -->
            <div>
                <div class="flex justify-between items-center mb-1">
                    <label for="rate-slider" class="block text-sm font-bold text-gray-700">英語読み上げ速度</label>
                    <span id="rate-display" class="font-bold text-blue-600">1.0x</span>

                <div class="relative pt-2 pb-2">

                </div>

        </div>
    </section>

    <!-- Controls Area (Moved here between sections) -->
    <div class="flex flex-wrap justify-center items-center w-full max-w-4xl mb-6 gap-2 md:gap-4">

            <span class="hidden sm:inline">戻る</span>

                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"></polyline><polyline points="23 20 23 14 17 14"></polyline><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"></path></svg>
                もう一度

            <button id="stop-btn" class="bg-red-500 hover:bg-red-600 text-white font-bold py-3 px-4 md:px-6 rounded-full flex items-center gap-1 md:gap-2 btn-hover transition-colors shadow-md text-sm md:text-base">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" stroke="none"><rect x="6" y="6" width="12" height="12"></rect></svg>
                停止

        </div>

        <!-- 次へボタン -->
        <button id="next-btn" class="bg-slate-800 hover:bg-slate-700 text-white font-bold py-3 px-4 md:px-5 rounded-full flex items-center gap-1 md:gap-2 btn-hover transition-colors shadow-md text-sm md:text-base">

        </button>
    </div>

    <main class="bg-white rounded-3xl shadow-sm pt-0 pb-6 px-6 md:pb-10 md:px-10 w-full max-w-4xl relative min-h-[300px] flex flex-col justify-start overflow-hidden">
        
        <!-- プログレスバー (白と青の境目) -->

        </div>

        <!-- カウンター表示 -->

            <div class="text-gray-400 font-bold text-sm tracking-wide">

            </div>
        </div>

        <div class="flex-col flex justify-center pt-2 pb-4 w-full">
            <!-- Japanese Section -->

            </div>

                    <!-- English text appears here -->
                </p>
            </div>
        </div>
    </main>

                { jp: "友人の家に遊びに行ったら、棚の上に最新型のカメラが置いてあった。あれは誰のものか聞きなさい。", en: "Whose is that?" },

                { jp: "ヨーコは頼まれると断れないタイプ。ルームメートのリリーはそのヨーコによく頼み事をする。リリーにあまりに多くのことを彼女に頼まないでと言いなさい。", en: "Don't ask a lot of things of her." },
                { jp: "友人が、ある島がどこにあるのかと聞いた。(それは)インドネシアの北の方にあると言いなさい。", en: "It's to the north of Indonesia." },
                { jp: "あなたは、どんな食べ物が好きかを聞かれた。すしが好きな食べ物だと答えなさい。", en: "Sushi is one of my favorite foods." },
                { jp: "イギリスにいる友人が、日本の酒が好きだと言った。どんな酒が好きか聞きなさい。", en: "What kind of sake do you like?" },
                { jp: "ルームメートがカップ麺を1個買って来た。その食べ物は健康に良くないよと言いなさい。", en: "That food isn't good for your health." },
                { jp: "春先なのに外は暑く感じられた。今日は春にしては暑いねとコメントしなさい。", en: "Today is hot for spring." },
                { jp: "あなたの落とし物が見つかった、とメールで友人が知らせてくれた。eメールをありがとうとお礼を言いなさい。", en: "Thank you for your email." },
                { jp: "ジョージのお父さんが亡くなったと聞いた。彼が気の毒ですと言いなさい。", en: "I'm sorry for him." },
                { jp: "いつ会おうか、とナンシーが聞いてきた。金曜日に私と会って、と言いなさい。", en: "Meet me on Friday." },
                { jp: "知り合いが、ジェニーは東京に行くことがあるかと聞いてきた。彼女はときどき仕事で東京に行っているよと答えなさい。", en: "She sometimes goes to Tokyo on business." },
                { jp: "パットがカフェテリアでランチを少ししか食べないのを見た友人が、彼女は気分でも悪いのか、とあなたに聞いた。彼女はダイエット中なんだよと答えなさい。", en: "She is on a diet." },
                { jp: "ルームメートのジョンは車で学校に行っているのか、とあなたは友人に聞かれた。彼は歩いて学校に行っていると答えなさい。", en: "He goes to school on foot." },
                { jp: "キムの両親は引っ越して、キムと離れて暮らしている。彼女の両親が今どこにいるのか、ミックが聞いてきた。彼女の両親はカナダに住んでいると答えなさい。", en: "Her parents live in Canada." },
                { jp: "メイが見当たらないんだけど、とトムがあなたに言った。メイは車の中にいるよと答えなさい。", en: "Mei is in the car." },
                { jp: "マリオがあなたのルームメートのサリーが病気だと聞き、サリーは病院にいるのか、と聞いた。彼女はベッドにいると答えなさい。", en: "She is in bed." },
                { jp: "テストを受けようとしている生徒が、ボールペンで答案を書いてもいいか、と教員のあなたに聞いた。鉛筆で書いてと言いなさい。", en: "Write in pencil." },
                { jp: "トンプソンさんにコーヒーを入れてあげた。コーヒーに砂糖を入れるか聞きなさい。", en: "Do you take sugar in your coffee?" },
                { jp: "トムが、その歌手をあなたが知っているのは意外だと言った。彼はアジアではとても有名だと言いなさい。", en: "He is very famous in Asia." },
                { jp: "あなたは、リズが眼鏡をかけているのを初めて見た。あなたと一緒にいる友人に、彼女は眼鏡が似合うねとコメントしなさい。", en: "She looks nice in glasses." },
                { jp: "ホセが、あなたの両親は今、外出中なのかと聞いた。母と父は今、家にいるよと言いなさい。", en: "Mom and Dad are at home now." },
                { jp: "ミンがあなたの家に遊びに来ている。夕食の支度ができたので、リビングにいるミンに、どうぞ来て食べてくださいと言いなさい。", en: "Please come and eat." },
                { jp: "リチャードの部屋に入ったら快適だった。あなた(リチャード)の部屋は心地よくて暖かいねとコメントしなさい。", en: "Your room is nice and warm." },
                { jp: "中国から来た留学生のリンさんと、入浴の話になった。あなた(リン)はお風呂とシャワーのどちらを使うの?と聞きなさい。", en: "Which do you take, a bath or a shower?" }
            ],
            "Lesson 1-7": [
                { jp: "サリーから電話がかかってきた。今どこにいるか聞きなさい。", en: "Where are you now?" },
                { jp: "リーは、自分のお兄さんが遠くから大学に通って来ていると言った。(彼は)どこに住んでいるのか聞きなさい。", en: "Where does he live?" },
                { jp: "ジェイソンが近くに図書館がオープンしたとあなたに言った。彼に、その図書館は何時に開館するのか聞きなさい。", en: "When does the library open?" },
                { jp: "通学中、交通渋滞で乗っているバスがなかなか進まなくなった。授業に間に合うか心配になり、隣に座って時計を見ている友人に、今、何時か聞きなさい。", en: "What time is it now?" },
                { jp: "今、何時か、と友人に聞かれた。10時だと答えなさい。", en: "-It's ten o'clock." },
                { jp: "普段はよく話すナオミが今日はおとなしくしている。ナオミのルームメートになぜ今日、彼女はとても静かなのか聞きなさい。", en: "Why is she so quiet today?" },
                { jp: "トムは最近、図書館で過ごす時間が長い。彼のルームメートに、なぜ彼がよく図書館に行っているのか聞きなさい。", en: "Why does he go to the library often?" },
                { jp: "友人たちと話していると、トムが離れたところにポツンと一人でいるのに気がついた。こっちに来なよと言いなさい。", en: "Why don't you come here?" },
                { jp: "マリアは、自分のお父さんにとても遠慮している感じで、お母さんにばかり聞いている。お父さんに聞いてみたらと言いなさい。", en: "Why don't you ask your father?" },
                { jp: "陽が傾いて寒くなってきた。家の外にいるメイに、入って紅茶を飲んだらと言いなさい。", en: "Why don't you come in and have some tea?" },
                { jp: "ポールが先週けがをして病院に行った、と聞いた。ポールの友人に、彼は今どんな様子か聞きなさい。", en: "How's he now?" },
                { jp: "あなたの友人のルームメート(女性)が替わった。その友だちに、彼女がどんな感じか(どんな感じで気に入っているか)聞きなさい。", en: "How do you like her?" },
                { jp: "あなたのルームメートが、気分が悪くなってしばらくベッドに横になっている。今どんな気分か聞きなさい。", en: "How do you feel now?" },
                { jp: "リサがあなたに、自分の妹は頭が良く、飛び級で大学に入ったと言った。彼女が何歳か聞きなさい。", en: "How old is she?" },
                { jp: "クラスメートが、数学の問題の答えを教えてくれ、と頼んできた。しかし、難しくて解けそうもない。これは自分には難しいようだと言いなさい。", en: "This seems difficult to me." },
                { jp: "朝食の支度ができたので、ルームメートに座って朝食を食べましょうと言いなさい。", en: "Let's sit down to breakfast." },
                { jp: "少しなまりのある英語を話す生徒がいて、友人に彼はどこの出身か聞かれた。ドイツの出身だと答えなさい。", en: "He is from Germany." },
                { jp: "メグの家を訪ねたとき、家の周囲の景色が美しいと思った。友人に、彼女の家から見た景色はきれいだと言いなさい。", en: "The view from her house is beautiful." },
                { jp: "ヨンにジェイソンは今どこにいるのか、と聞かれた。ジェイソンはドアのところにいるよと答えなさい。", en: "Jason is at the door." },
                { jp: "友人に、ボブの新しい住所を聞かれた。彼はサードストリートの200番地に住んでいると答えなさい。", en: "He lives at 200 Third St." },
                { jp: "友人に、電車の乗り換えなしで学校に来ているのか聞かれた。渋谷で電車を乗り換えていると答えなさい。", en: "I change trains at Shibuya." },
                { jp: "リーに、学校は何時に終わるのか聞かれた。(私の)学校は5時に終わると答えなさい。", en: "School is over at 5:00." },
                { jp: "子犬が飼い主に連れられて公園を散歩していて、あなたの目の前を通り過ぎた。一緒にいるナタリーに、あのかかわいい犬を見てと言いなさい。", en: "Look at that cute dog!" },
                { jp: "トムとマリーは今、何をしているのか、と友人に聞かれた。彼らは夕食の最中だよと答えなさい。", en: "They are at dinner." },
                { jp: "友人が、自分はいつも遅くまで起きている、と言った。何時に寝るのか聞きなさい。", en: "What time do you go to bed?" },
                { jp: "学校が終わった。チャールズを、川のほとりのレストランに行こうと誘いなさい。", en: "Let's go to the restaurant by the river." },
                { jp: "ジーンと道ですれ違った。彼女の家族が元気にしているか聞きなさい。", en: "How is your family?" },
                { jp: "ヤンに、あなたの家族は元気にしているかと聞かれた。私の家族はみなとても元気だと答えなさい。", en: "My family are all very well." },
                { jp: "昼食が終わりかけた。一緒に食事をしているベネットを、昼食の後に果物を食べようと誘いなさい。", en: "Let's eat fruit after lunch." }
            ],
            "Lesson 1-8": [
                { jp: "友人があなたに、ミックはマーガレットを知っているかと聞いた。彼は彼女の友人だと答えなさい。", en: "He is friends with her." },
                { jp: "ジュンが、ジェフはアリソンには何でもしてあげるようだね、と言った。ジェフはアリソンに恋しているからねと答えなさい。", en: "Jeff is in love with Allison." },
                { jp: "ガラスのコップを床に落として割ってしまった。近くに来た友人に、それに気をつけるように言いなさい。", en: "Be careful with those." },
                { jp: "友人があなたに、あなたのルームメートのヨシが今日学校に来なかったが、どうしたのか、と聞いた。彼は風邪をひいて寝ていると答えなさい。", en: "He is in bed with a cold." },
                { jp: "昨日のパーティーはとても面白かった、とジョージが言った。それについて話してとジョージに言いなさい。", en: "Tell me about it." },
                { jp: "クラスで問題が起こった。それについて話しましょうとクラスの皆に言いなさい。", en: "Let's talk about it" },
                { jp: "ジュンがあなたに、あなたの友人のマシューは何歳ぐらいだろうか、と聞いた。彼は私と同じくらいの年齢だと答えなさい。", en: "He is about my age." },
                { jp: "友人とアパレルショップに行った。気に入ったジャケットがあったので、その友人にこのジャケットをどう思うか聞きなさい。", en: "How about this jacket?" },
                { jp: "友人があなたに、ジャネットは授業が終わってからいつもどこに行っているのか、と聞いた。彼女は放課後には図書館に行っていると言いなさい。", en: "She goes to the library after school." },
                { jp: "今日ボウリングに行こう、とキムが誘ってきた。5時以降なら時間が空くと言いなさい。", en: "I'm free after 5:00." },
                { jp: "ソンが、あなたの夫が何時ごろに家に帰ってくるか聞いた。(彼は)いつも8時前に帰ってくると言いなさい。", en: "Usually, he comes home before 8:00." },
                { jp: "客が店員のあなたに、向こうに飾られているTシャツはいくらか、と聞いた。あれは100ドルを超えると答えなさい。", en: "That costs over $100." },
                { jp: "ナタリーが、あなたの両親はどこに住んでいるのか、と聞いた。(彼らは)ファーストストリートの230番地に住んでいると答えなさい。", en: "They live at 230 First Street." },
                { jp: "リズが、あなたはどこに住んでいるのか、と聞いた。明治通り沿いに住んでいると答えなさい。", en: "I live on Meiji Street." },
                { jp: "マリアがあなたに、毎年、夏はどんなふうに過ごすのか、と聞いた。夏には海や山によく行くんだと答えなさい。", en: "I often go to the sea and the mountains in summer." },
                { jp: "ヨンがあなたに、このドイツ製の高価なペンは、あなたのか、あなたのルームメートのトムのか、と聞いた。このペンは彼のだよと答えなさい。", en: "This pen is his." },
                { jp: "ルームメートが、自分の今学期の成績がオールAだった、と言った。わー、それは素晴らしい! と言いなさい。", en: "Wow, it's great!" },
                { jp: "金づちを使いながら、誤って指をたたいてしまった。痛い!と言いなさい。", en: "Ouch!" },
                { jp: "カフェテリアで肘が他の生徒の体に当たった。あ、ごめん!と言いなさい。", en: "Oops, I'm sorry!" },
                { jp: "ロナルドが断りもなくあなたのスマホを使っている。おい、俺のスマホを使うなよと言いなさい。", en: "Hey! Don't use my smartphone." },
                { jp: "サリーがあなたに、果物を食べるか聞いた。どんな果物があるか聞きなさい。", en: "What fruit do you have?" },
                { jp: "久しぶりにパンケーキを作ろうと、材料を買ってきた。ルームメートのジョンに、パンケーキが好きか聞きなさい。", en: "Do you like pancakes?" },
                { jp: "新しいルームメートは、芸術については何でも知っているようだ。君は芸術に対して良い目を持っているんだねと言いなさい。", en: "You have a good eye for art." },
                { jp: "春になり、キャンパス内にたくさんの花が咲いている。目の前に何とも美しい花が咲き誇っている。この花はとてもきれいだねとコメントしなさい。", en: "These flowers are very beautiful." },
                { jp: "友人があなたに、何点取れば成績にAが付くか聞いた。80点以上がAだと答えなさい。", en: "Eighty points or over is A." },
                { jp: "サリーに一人っ子の雰囲気を感じた。たぶん、きょうだいはいないだろうと予想しつつ、彼女のクラスメートに(彼女に)きょうだいがいるか聞きなさい。", en: "Does she have any brothers or sisters?" },
                { jp: "トムがあなたに、調子が悪そうだね、と声をかけてきた。腹痛と熱があるんだと答えなさい。", en: "I have a stomachache and a fever." },
                { jp: "ジャネットがあなたに、自宅ではどんな服装か聞いた。自宅では、いつもTシャツとジーンズを着ていると答えなさい。", en: "I usually wear a T-shirt and jeans at home." },
                { jp: "ポールがあなたに、良いズボンをはいているね、と言った。このズボンはとても(値段が)高いんだよと言いなさい。", en: "These pants are very expensive." }
            ],
            "Lesson 1-9": [
                { jp: "友人があなたに、あなたの弟は大学に通っているのか、と聞いた。弟は高校生だと言いなさい。", en: "My brother is a high school student." },
                { jp: "ヨンが、ヨンのお姉さんは東京で仕事をしている、と言った。お姉さんは仕事は何をしているのか聞きなさい。", en: "What does your sister do?" },
                { jp: "フランシスが、あなたのおじいさんとおばあさんは犬好きだねと言った。祖父母は犬を5匹飼っていると言いなさい。", en: "My grandparents have five dogs." },
                { jp: "最近、カフェテリアで朝食を食べているジョンを見かけない。クラスでジョンに会ったとき、君は朝食は食べているの、と聞きなさい。", en: "Do you have breakfast?" },
                { jp: "メイの犬好きは有名だね、と友人が言った。彼女は自分の犬を(複数)とてもかわいがっているよと言いなさい。", en: "She loves her dogs very much." },
                { jp: "友人があなたに、いつもいつ宿題をやるのか聞いた。いつも夕食前に宿題をやると答えなさい。", en: "I do my homework before dinner." },
                { jp: "あなたは、大学に進学したアンナに、久しぶりに会った。大学生活を楽しんでいるか聞きなさい。", en: "Do you enjoy college life?" },
                { jp: "サリーが、自分は料理が好きだと言った。どのくらいの頻度で家で料理をするのか聞きなさい。", en: "How often do you cook at home?" },
                { jp: "友人が、金曜日は履修科目が多く、前夜に行う予習が大変だと言った。金曜日には何クラス履修しているか聞きなさい。", en: "How many classes do you take on Friday?" },
                { jp: "友人が、今日ジョージに会うと言った。なぜ、彼に会うのか聞きなさい。", en: "Why do you meet him?" },
                { jp: "友人が、ボーイフレンドの英語が最近ずいぶん上達したと思う、と言った。(彼は)英語を猛勉強しているのかと聞きなさい。", en: "Does he study English very hard?" },
                { jp: "あなたは、マリアが去年パリに行ったことを思い出した。マリアの友人に、彼女が今もパリに住んでいるのか聞きなさい。", en: "Is she living in Paris now." },
                { jp: "マリアは今、パリには住んでいないのだという。では、彼女は今どこに住んでいるのか聞きなさい。", en: "Where is she living now?" },
                { jp: "トムがあなたに、マリーはまだ来ていないのかと聞いた。(彼女は)今まさに来るところだと答えなさい。", en: "She is coming right now." },
                { jp: "リッチがあなたに、マギーは今どこにいるのかと聞いた。(彼女は)自分の部屋で音楽を聞いているよと答えなさい。", en: "She is listening to music in her room." },
                { jp: "映画に誘おうと思い、ポールに電話をしたら、今忙しいという返事だった。君は今勉強しているの? と彼に聞きなさい。", en: "Are you studying now?" },
                { jp: "パトリシアと出かけるために、ドアを出たところで彼女が来るのを待っていた。なかなか来ないので、彼女は何をもたもたしているのだろうか、と自分自身につぶやきなさい。", en: "What is taking her so long?" },
                { jp: "郵便局への道が分からなくなった。近くを歩いていた人に、すみません、郵便局を探しているんですがと言いなさい。", en: "Excuse me. I'm looking for the post office." },
                { jp: "あなたは自分の自転車を使いたかった。しかし、またあなたの妹が勝手にあなたの自転車で買い物に行ってしまった。友人に、彼女はいつも私の自転車を使うんだよねと、不満顔で言いなさい。", en: "She is always using my bike." },
                { jp: "ルームメートのミンからの電話で、今どこにいるかあなたに聞いてきた。今、家に帰るところだと答えなさい。", en: "I'm on my way home." },
                { jp: "チェリーが、珍しくあなたに親切にしてくれている。友人に、今日、彼女は(どういうわけか)親切なんだよねと言いなさい。", en: "She is being kind today." },
                { jp: "友人があなたに、キムの病気はどんな具合か聞いた。(彼女は)今日は気分が良いよと答えなさい。", en: "She is feeling good today." },
                { jp: "友人があなたに、ボブは寮から引っ越して一人で住んでいるのか、と聞いた。(彼は)今、彼の祖父母と住んでいるよ、と答えなさい。", en: "He is living with his grandparents now." },
                { jp: "サリーが夕飯の準備ができたよ、と言った。すぐにそちらへ行くよと答えなさい。", en: "I'm coming!" },
                { jp: "ペンを使いたいのに、自分のペンが見当たらない。メアリーのペンがテーブルの上に置いてある。メアリーにあなたのペンを使うよと言いなさい。", en: "I'm using your pen!" },
                { jp: "サリーに道で会った。今あなたはどこに行くところ?と聞かれた。今、仕事に行くところだと答えなさい。", en: "I'm going to work now." },
                { jp: "どうやって通勤しているのか、とジンに聞かれた。歩いて通勤しているよと答えなさい。", en: "I go to work on foot." }
            ],
            "Lesson 1-10": [
                { jp: "友人があなたに、あなたのお母さんは英語が上手だねと言った。母は英語の先生だったんだよと言いなさい。", en: "My mother was an English teacher." },

                { jp: "ソンの家に夜遅くまで滞在したあと、帰ろうと思って外に出たら、月明かりもなく真っ暗だった。なんて暗いんだと友人に言いなさい。", en: "How dark it is!" },
                { jp: "起きて学校に行く準備をしなければならない時刻なのに、ルームメートがベッドに寝そべったままグズグズしている。外は明るいよ、目を覚ませと言いなさい。", en: "It is light outside. Wake up!" },
                { jp: "友人の新居を訪ねている。その友人に、ここから大学までどのくらい時間がかかるか聞きなさい。", en: "How long does it take from here to your college?" },
                { jp: "田舎に引っ越してからの生活はどんな具合? とリンゴが電話であなたに聞いた。自然が好きなあなたは、ここ、気に入っているよと答えなさい。", en: "I like it here." },
                { jp: "友人があなたに、あなたの両親と祖父母はどこに住んでいるか聞いた。彼らはみな、京都に住んでいると答えなさい。", en: "They all are living in Kyoto." },

                { jp: "ルームメートが、あなたがどこで何をしているか電話で聞いてきた。今、カフェで勉強していると伝えなさい。", en: "I'm studying at the café right now." },
                { jp: "トムがあなたに、ある情報がウェブサイトのどこにあるのか聞いた。スマホの画面にウェブサイトを表示して見せながら、そのサイトの、まさにここにあると答えなさい。", en: "It is right here on the website." },
                { jp: "知り合いがあなたに、大阪の郊外に住んでいるのかと聞いた。大阪のど真ん中に住んでいると答えなさい。", en: "I live right in the center of Osaka." },
                { jp: "体育館に入ったら寒くて震えるほどだ。ここはかなり寒いねと言いなさい。", en: "It is pretty cold here." },

                { jp: "友人があなたに何時に夕食を食べているかと聞いた。あなたは毎晩7時に夕食を食べていると答えなさい。", en: "I eat dinner at seven every evening." },

                { jp: "ミックが、あのパソコンがとても安いので買おうかな、と言った。あれは安すぎるよとコメントしなさい。", en: "That is too cheap." },

                { jp: "友だちが自分の母親に電話したいが、自宅にスマホを忘れてしまったという。あなたのスマホを使っていいと言いなさい。", en: "You can use my smartphone." },

                { jp: "この地域は夏に暑いのか、と聞かれた。このエリアは夏はとても暑くなる可能性があるよと言いなさい。", en: "Summer can be very hot in this area." },
                { jp: "あなたは医者として患者さんとその人の病気について話している。その患者さんに一般的にこの病気はシリアスになる(重症化する)可能性があると言いなさい。", en: "This illness can be serious." },

                { jp: "友人から、あなたの祖父はお金持ちなんだってね、と言われた。祖父の家は大きくてプールがあると言いなさい。", en: "My grandpa's house is large and has a pool." },
                { jp: "ルームメートのマリアが、あなたの机の上にある時計を指でさして、誰の時計?と聞いた。これは弟の時計だと答えなさい。", en: "This is my brother's watch." },
                { jp: "友人に道でばったり会い、今どこに行くところか聞かれた。歯医者に行くところだと言いなさい。", en: "I'm going to the dentist's." },

        const lessonSelect = document.getElementById('lesson-select');

        const totalCountDisplay = document.getElementById('total-count-display');

        function populateVoices() {
            voices = synth.getVoices().filter(voice => voice.lang.includes('en')); // Filter for English voices
            voiceSelect.innerHTML = '';
            
            if (voices.length === 0) {
                voiceSelect.innerHTML = '<option value="">English voices not available</option>';
                return;
            }

            voices.forEach((voice, i) => {
                const option = document.createElement('option');
                option.textContent = `${voice.name} (${voice.lang})`;
                
                if (voice.default) {
                    option.textContent += ' — Default';
                }
                
                option.setAttribute('data-lang', voice.lang);
                option.setAttribute('data-name', voice.name);
                voiceSelect.appendChild(option);

                // Prefer a generic US female voice if available as default
                if (voice.name.includes("Google US English") || (voice.lang === 'en-US' && voice.name.includes("Female"))) {
                    option.selected = true;
                }
            });
            updateSelectedVoice();
        }

        function updateSelectedVoice() {
            const selectedOption = voiceSelect.selectedOptions[0]?.getAttribute('data-name');
            selectedVoice = voices.find(voice => voice.name === selectedOption);
        }

        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = populateVoices;
        }

        function initApp() {
            // Populate Lesson Dropdown
            for (const lesson in lessonData) {
                const option = document.createElement('option');
                option.value = lesson;
                option.textContent = lesson;
                lessonSelect.appendChild(option);
            }
            
            // Set initial slider progress
            updateSliderProgress();
            
            // Load initial lesson
            loadLesson(lessonSelect.value);
            
            // Initial voice load attempt
            populateVoices();
        }

        function loadLesson(lessonName) {
            currentLesson = lessonName;
            sentences = lessonData[lessonName];
            currentIndex = 0;
            totalCountDisplay.textContent = sentences.length;
            updateCard();
        }

        function updateCard() {
            // Clear any pending timeouts
            clearTimeout(autoPlayTimeout);
            clearInterval(speechCheckInterval);
            synth.cancel();

            const currentData = sentences[currentIndex];
            jpTextEl.textContent = currentData.jp;
            enTextEl.textContent = currentData.en;
            
            // Reset visibility
            enSection.classList.add('hidden');
            showPlayBtn.classList.remove('hidden');
            replayBtn.classList.add('hidden');
            isEnglishShown = false;

            // Update counter
            currentIndexDisplay.textContent = currentIndex + 1;
            
            // Reset progress bar (待ち時間タイマーのリセット)
            resetProgressBar();

            // Update Nav Buttons
            prevBtn.disabled = currentIndex === 0;
            prevBtn.classList.toggle('opacity-50', currentIndex === 0);
            prevBtn.classList.toggle('cursor-not-allowed', currentIndex === 0);
            
            nextBtn.disabled = currentIndex === sentences.length - 1;
            nextBtn.classList.toggle('opacity-50', currentIndex === sentences.length - 1);
            nextBtn.classList.toggle('cursor-not-allowed', currentIndex === sentences.length - 1);

            if (isAutoMode) {
                startAutoSequence();
            }
        }

        function resetProgressBar() {
            const progressBarFill = document.getElementById('progress-bar-fill');
            if (progressBarFill) {
                progressBarFill.style.transition = 'none';
                progressBarFill.style.width = '0%';
            }
        }

        function startProgressBar(duration) {
            const progressBarFill = document.getElementById('progress-bar-fill');
            if (progressBarFill) {
                // DOMの再描画を確実に待ってからアニメーションを開始する
                window.requestAnimationFrame(() => {
                    window.requestAnimationFrame(() => {
                        progressBarFill.style.transition = `width ${duration}ms linear`;
                        progressBarFill.style.width = '100%';
                    });
                });
            }
        }

        function playAudio(text) {
            if (synth.speaking) {
                synth.cancel();
            }
            const utterThis = new SpeechSynthesisUtterance(text);
            if (selectedVoice) {
                utterThis.voice = selectedVoice;
            }
            utterThis.rate = parseFloat(rateSlider.value);
            synth.speak(utterThis);
        }

        function showEnglishAndPlay() {
            // 手動でクリックされた場合、タイマーをキャンセルしてバーをMAXにする
            clearTimeout(autoPlayTimeout);
            const progressBarFill = document.getElementById('progress-bar-fill');
            if (progressBarFill && !isEnglishShown) {
                progressBarFill.style.transition = 'none';
                progressBarFill.style.width = '100%';
            }

            enSection.classList.remove('hidden');
            showPlayBtn.classList.add('hidden');
            replayBtn.classList.remove('hidden');
            isEnglishShown = true;
            playAudio(sentences[currentIndex].en);
        }

        function startAutoSequence() {
            const delayMs = parseInt(delaySelect.value);
            
            // 待機時間プログレスバー開始
            startProgressBar(delayMs);

            // 1. Show Japanese immediately (handled by updateCard)
            // 2. Wait for 'delayMs'
            autoPlayTimeout = setTimeout(() => {
                // 3. Show English & Play
                showEnglishAndPlay();
                
                // 4. Wait for speaking to finish + small pause, then go next
                waitForSpeechEndAndNext();

            }, delayMs);
        }

        function waitForSpeechEndAndNext() {
            // Poll to check if speaking is done. 
            // onend event can be buggy in some browsers, setInterval is more reliable.
            speechCheckInterval = setInterval(() => {
                if (!synth.speaking) {
                    clearInterval(speechCheckInterval);
                    // Add a small pause before jumping to next sentence
                    autoPlayTimeout = setTimeout(() => {
                        if (currentIndex < sentences.length - 1) {
                            currentIndex++;
                            updateCard();
                        } else {
                            // Reached the end, turn off auto mode
                            toggleMode();
                        }
                    }, 1000); 
                }
            }, 100);
        }

        lessonSelect.addEventListener('change', (e) => loadLesson(e.target.value));
        
        voiceSelect.addEventListener('change', updateSelectedVoice);

        rateSlider.addEventListener('input', (e) => {
            const val = parseFloat(e.target.value).toFixed(1);
            rateDisplay.textContent = val + 'x';
            updateSliderProgress();
            // If already showing English, replay with new rate
            if (isEnglishShown) {
                playAudio(sentences[currentIndex].en);
            }
        });

        function updateSliderProgress() {
            const min = parseFloat(rateSlider.min);
            const max = parseFloat(rateSlider.max);
            const val = parseFloat(rateSlider.value);
            const percentage = ((val - min) / (max - min)) * 100;
            sliderProgress.style.width = percentage + '%';
        }

        showPlayBtn.addEventListener('click', showEnglishAndPlay);
        
        replayBtn.addEventListener('click', () => {
            playAudio(sentences[currentIndex].en);
        });

        stopBtn.addEventListener('click', () => {
            synth.cancel();
            clearTimeout(autoPlayTimeout);
            clearInterval(speechCheckInterval);
            resetProgressBar(); // プログレスバーもリセット
            if (isAutoMode) {
                setMode(false);
            }
        });

        prevBtn.addEventListener('click', () => {
            if (currentIndex > 0) {
                currentIndex--;
                updateCard();
            }
        });

        nextBtn.addEventListener('click', () => {
            if (currentIndex < sentences.length - 1) {
                currentIndex++;
                updateCard();
            }
        });

        // Mode Selection
        function setMode(auto) {
            if (isAutoMode === auto) return;
            isAutoMode = auto;
            
            if (isAutoMode) {
                // UI update for Auto mode
                modeManualBtn.classList.remove('bg-white', 'shadow-sm', 'text-gray-800');
                modeManualBtn.classList.add('text-gray-500', 'hover:text-gray-700');
                
                modeAutoBtn.classList.remove('text-gray-500', 'hover:text-gray-700');
                modeAutoBtn.classList.add('bg-white', 'shadow-sm', 'text-blue-600');
                
                delaySelect.disabled = false;
                delaySelect.classList.remove('cursor-not-allowed', 'bg-gray-50', 'text-gray-400');
                delaySelect.classList.add('bg-white', 'text-gray-700');
                document.getElementById('delay-label').classList.replace('text-gray-400', 'text-gray-700');
                
                // Hide manual buttons
                showPlayBtn.classList.add('hidden');
                replayBtn.classList.add('hidden');
                nextBtn.classList.add('hidden');
                prevBtn.classList.add('hidden');

                // Start sequence from current card
                updateCard();

            } else {
                // UI update for Manual mode
                modeAutoBtn.classList.remove('bg-white', 'shadow-sm', 'text-blue-600');
                modeAutoBtn.classList.add('text-gray-500', 'hover:text-gray-700');
                
                modeManualBtn.classList.remove('text-gray-500', 'hover:text-gray-700');
                modeManualBtn.classList.add('bg-white', 'shadow-sm', 'text-gray-800');
                
                delaySelect.disabled = true;
                delaySelect.classList.add('cursor-not-allowed', 'bg-gray-50', 'text-gray-400');
                delaySelect.classList.remove('bg-white', 'text-gray-700');
                document.getElementById('delay-label').classList.replace('text-gray-700', 'text-gray-400');

                // Show manual buttons
                nextBtn.classList.remove('hidden');
                prevBtn.classList.remove('hidden');
                
                // Reset current card to initial state
                clearTimeout(autoPlayTimeout);
                synth.cancel();
                updateCard();
            }
        }

        modeManualBtn.addEventListener('click', () => setMode(false));
        modeAutoBtn.addEventListener('click', () => setMode(true));
        
        delaySelect.addEventListener('change', () => {
            if (isAutoMode) {
                updateCard(); // Restart sequence with new delay
            }
        });

        // Initialize on load
        window.addEventListener('DOMContentLoaded', initApp);

    </script>
</body>
</html>
